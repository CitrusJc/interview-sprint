<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1a73e8">
<title>河南导游面试冲刺 · 12景点全包</title>
<style>
:root{--main:#1a73e8;--main2:#4285f4;--ok:#0a8a3a;--bad:#d93025;--warn:#e8710a;--bg:#f4f6fa;--card:#fff;--line:#e4e8ef;--text:#1f2329;--muted:#5f6368;--soft:#f7f9fc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:16px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.hbar{position:sticky;top:0;z-index:30;box-shadow:0 1px 6px rgba(20,40,80,.07)}
header{background:linear-gradient(135deg,#1a73e8,#4b8bf5);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
.hrow{display:flex;align-items:center;gap:8px}
.hrow h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px}
.hrow .cd{margin-left:auto;font-size:12px;background:rgba(255,255,255,.22);padding:3px 10px;border-radius:12px}
.hsub{display:flex;align-items:baseline;gap:6px;font-size:12.5px;opacity:.95;margin-top:6px}
.hsub b{font-size:17px;font-weight:700}
.pb{height:5px;border-radius:3px;background:rgba(255,255,255,.28);margin-top:7px;overflow:hidden}
.pb i{display:block;height:100%;background:#fff;border-radius:3px;transition:width .35s}
nav{display:flex;gap:6px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);padding:8px 12px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:inherit;font-size:13.5px;padding:6px 13px;border-radius:15px;border:1px solid transparent;background:#f1f3f6;color:#3c4043;position:relative}
nav button.on{background:#e8f0fe;color:#174ea6;border-color:#a8c7f5;font-weight:600}
nav button b{position:absolute;top:-5px;right:-4px;background:var(--bad);color:#fff;font-size:10px;line-height:1;padding:3px 5px;border-radius:8px;font-weight:600}
main{max-width:760px;margin:0 auto;padding:12px 13px 30px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}
.sec-h{display:flex;align-items:center;gap:8px;margin:14px 2px 10px;font-size:14.5px;font-weight:600;color:#202124}
.sec-h .cnt{margin-left:auto;font-size:12.5px;font-weight:400;color:var(--muted)}
.sec-h .dot{width:4px;height:15px;border-radius:2px;background:var(--main)}
.lead{font-size:13px;color:var(--muted);line-height:1.7;margin:0 0 10px}
.tag{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:8px;background:#eef3fe;color:#174ea6;line-height:1.7}
.tag.sp{background:#e9f6ec;color:#0a6b2e}
.tag.core{background:#fff1e0;color:#a35a00}
.tag.w{background:#fdeceb;color:#b3261e}
.idx{font-size:11.5px;color:#9aa0a6}
.stem{font-size:16px;font-weight:600;line-height:1.75;margin:8px 0 12px;word-break:break-word}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:15px;line-height:1.6;background:#fff;transition:.15s}
.opt i{flex:0 0 auto;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:#f1f3f6;font-style:normal;font-size:12.5px;color:#5f6368;margin-top:2px;font-weight:600}
.opt:active{background:#f8fbff}
.opt.pick{border-color:#a8c7f5;background:#f3f8ff}
.opt.right{border-color:#8fd6a5;background:#eefaf1}
.opt.right i{background:#0a8a3a;color:#fff}
.opt.wrong{border-color:#f3b7b2;background:#fdf0ef}
.opt.wrong i{background:#d93025;color:#fff}
.opt.dim{opacity:.45}
.fb{margin-top:12px;font-size:14px;line-height:1.8;border-radius:10px;padding:11px 12px;display:none}
.fb.on{display:block}
.fb.ok{background:#eefaf1;border-left:3px solid var(--ok)}
.fb.no{background:#fdf0ef;border-left:3px solid var(--bad)}
.fb b{font-weight:600}
.fb .ex{display:block;margin-top:5px;color:#3c4043;font-size:13.5px}
.acts{display:flex;gap:9px;margin-top:12px}
.acts button{flex:1}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:10px;min-height:44px;padding:0 12px;cursor:pointer}
button:active{transform:scale(.985)}
button.primary{background:var(--main);color:#fff;border-color:var(--main);font-weight:600}
button.ghost{border-style:dashed;color:var(--main);border-color:#a8c7f5;background:#f8fbff}
button.mini{min-height:32px;font-size:12.5px;padding:0 10px;border-radius:8px}
.fill{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin:4px 0 10px;background:#fff;color:var(--text)}
.fill:focus{outline:none;border-color:var(--main);box-shadow:0 0 0 3px rgba(26,115,232,.12)}
.ans{display:none;background:var(--soft);border-left:3px solid var(--main);border-radius:0 9px 9px 0;padding:11px 13px;font-size:14.5px;line-height:1.9;white-space:pre-wrap;margin-top:11px}
.ans.on{display:block}
.ans .lb{display:block;font-size:11.5px;color:var(--main);font-weight:600;margin-bottom:4px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:44px 12px;line-height:2}
.done{opacity:.5}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;margin-bottom:11px}
.qmeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:2px}
.qmeta .idx{margin-left:auto}
.more{width:100%;margin:6px 0 18px;border-style:dashed;color:var(--main)}
/* 讲稿 */
.sp-tabs{display:flex;gap:7px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.sp-tabs::-webkit-scrollbar{display:none}
.sp-tabs button{flex:0 0 auto;font-size:13px;min-height:34px;padding:0 12px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.sp-tabs button.on{background:var(--main);color:#fff;border-color:var(--main);font-weight:600}
.seg{padding:12px 0;border-bottom:1px dashed var(--line)}
.seg:last-of-type{border-bottom:0}
.seg h4{margin:0 0 6px;font-size:12.5px;color:var(--main);font-weight:600;letter-spacing:.3px}
.seg p{margin:0;font-size:16px;line-height:2;text-align:justify}
.seg p b{color:#0b57d0;background:#eef4ff;padding:0 2px;border-radius:3px}
.kwrow{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 0}
.kwrow span{font-size:12px;background:#f1f5fb;color:#3c5a80;padding:3px 9px;border-radius:9px}
.warnbox{background:#fff8e6;border-left:3px solid var(--warn);border-radius:0 8px 8px 0;padding:9px 12px;font-size:13px;line-height:1.75;margin-top:11px}
.warnbox b{color:#a35a00}
.meta-line{font-size:12.5px;color:var(--muted);margin:2px 0 10px}
/* 导图 */
.mind{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 14px 8px;margin-bottom:11px}
.mind h3{margin:0 0 4px;font-size:15px}
.mind .mm{font-size:12px;color:var(--muted);margin-bottom:10px}
.node{position:relative;padding-left:20px;margin-bottom:13px}
.node::before{content:"";position:absolute;left:5px;top:6px;bottom:-13px;width:1.5px;background:#d7e2f5}
.node:last-child::before{bottom:0}
.node .nh{font-size:14.5px;font-weight:600;color:#0b57d0;position:relative;margin-bottom:4px}
.node .nh::before{content:"";position:absolute;left:-20px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--main);border:2px solid #fff;box-shadow:0 0 0 1px #a8c7f5}
.node ul{margin:2px 0 0;padding-left:16px}
.node li{font-size:13.5px;line-height:1.9;color:#3c4043}
/* 卡片 */
.flip{position:relative;height:112px;perspective:900px;margin-bottom:9px;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;border:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;font-size:14px;line-height:1.6;overflow:auto}
.flip .f{background:#fff;font-weight:600}
.flip .f::after{content:"点击翻面";position:absolute;right:10px;bottom:6px;font-size:10.5px;color:#b0b6be;font-weight:400}
.flip .b{background:#f2f8ff;border-color:#bcd6f7;transform:rotateY(180deg);font-size:13.5px;color:#134a8e}
.flip .b .a{font-weight:700;color:#0a6b2e;margin-right:4px}
/* 通用 */
.sel{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);margin-bottom:10px}
.foot{display:flex;gap:9px;margin:20px 0 6px}
.foot button{flex:1;font-size:13.5px;min-height:40px;color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:60}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:520px;max-height:80vh;display:flex;flex-direction:column}
.mbox h3{margin:0 0 8px;font-size:16px}
.mbox p{font-size:13px;color:var(--muted);margin:0 0 10px;line-height:1.6}
.mbox textarea{flex:1;min-height:150px;font-size:12px;font-family:ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:8px;padding:8px;resize:none;word-break:break-all}
.mbox .row{display:flex;gap:10px;margin-top:10px}
.mbox .row button{flex:1}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:#202124;color:#fff;font-size:13.5px;padding:10px 16px;border-radius:22px;opacity:0;transition:.28s;z-index:70;pointer-events:none;white-space:nowrap;max-width:92vw}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:#8ab4f8;font-size:13.5px;padding:0 0 0 10px;min-height:auto;font-weight:600}
.stat{display:flex;gap:8px;margin-bottom:12px}
.stat div{flex:1;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:20px;line-height:1.3}
.stat span{font-size:11.5px;color:var(--muted)}
.stat div.g b{color:var(--ok)}
.stat div.r b{color:var(--bad)}
.stat div.b b{color:var(--main)}
</style>
</head>
<body>
<div class="hbar">
<header>
  <div class="hrow"><h1>河南导游面试冲刺</h1><span class="cd" id="cd">D1/8</span></div>
  <div class="hsub"><span>今日</span><b id="td">0</b><span>/</span><span id="tt">0</span><span>题</span><span style="margin-left:auto">错题 <b id="wc" style="font-size:14px">0</b></span></div>
  <div class="pb"><i id="pbar" style="width:0%"></i></div>
</header>
<nav id="nav">
  <button class="on" data-tab="today">今日任务</button>
  <button data-tab="script">讲解词 12</button>
  <button data-tab="mind">思维导图</button>
  <button data-tab="card">背诵卡片</button>
  <button data-tab="drill">刷题</button>
  <button data-tab="wrong">错题本<b id="wb" style="display:none">0</b></button>
</nav>
</div>
<main id="app"></main>
<div class="modal" id="modal"><div class="mbox"><h3 id="mtitle"></h3><p id="mdesc"></p><textarea id="mtext" readonly></textarea><div class="row"><button id="mcopy">复制</button><button id="mok">关闭</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
var SPOTS=[{"name":"河南博物院","city":"郑州","mind":[{"h":"开场","kids":["问候考官、自我介绍","全程约一个半小时","重点看四件镇院之宝","不触摸展柜、禁用闪光灯"]},{"h":"城市概况","kids":["郑州是河南省省会","北临黄河、西依嵩山，九州腹地十省通衢","3600 年前即为商代早期都城","1954 年省会由开封迁郑，今为米字形高铁中心"]},{"h":"博物院概况","kids":["1927 年创于开封，1961 年随省会迁郑","1998 年新馆落成，2021 年改造后重开","主展馆取意登封元代观星台，寓意九鼎定中原","馆藏 17 万余件、一级文物 500 余件"]},{"h":"核心讲解","kids":["贾湖骨笛：8000 年、七孔、中华第一笛","莲鹤方壶：郭沫若称时代精神之象征","武则天金简：63 字、唯一皇帝金简","汝窑鹅颈瓶：天蓝釉刻花全球仅一件"]},{"h":"结束","kids":["一部河南史，半部中国史","带走的不只是几张照片","四十分钟后序厅集合","注意台阶、保管随身物品"]}],"cards":[{"f":"河南博物院创建于哪一年？前身叫什么？最初设在哪里？","b":"1927 年创建，前身是河南省博物馆，最初设在开封。串讲：1927 生于开封、1961 才进郑州，这两句一定要连着说。"},{"f":"河南博物院哪一年随省会迁到郑州？","b":"1961 年。串讲：别把 1954 年省会迁郑和博物院 1961 年迁郑混在一起，前后差七年。"},{"f":"河南博物院新馆哪一年落成开放？主展馆哪一年改造提升后重新开放？","b":"1998 年新馆落成开放，2021 年主展馆改造提升后重新开放。串讲：98 建新馆、21 换新颜，两个年份连着记。"},{"f":"河南博物院馆藏文物多少件？其中一级文物多少件？","b":"17 万余件，一级文物 500 余件。串讲：17 万件里只挑四件讲，这就是今天讲解的分量所在。"},{"f":"主展馆的造型取自哪座古建筑？寓意是什么？","b":"取自登封元代观星台，上窄下宽、呈金字塔形，寓意九鼎定中原，暗合天圆地方。串讲：一个博物馆的建筑，本身就是第一件展品。"},{"f":"贾湖骨笛距今约多少年？用什么材料制成？出土于哪里？","b":"距今约 8000 年，用丹顶鹤的尺骨制成，出土于舞阳贾湖遗址，属裴李岗文化。串讲：一支不起眼的骨管，把中国音乐史往前推了八千年。"},{"f":"贾湖骨笛有几个孔？能吹奏什么音阶？被称为什么？","b":"七个孔，至今仍能吹奏完整的七声音阶，被称为中华第一笛。串讲：它一出土就推翻了此前中国早期只有五声音阶的旧说。"},{"f":"莲鹤方壶属哪个时期？哪一年、在哪里出土？谁称它为时代精神之象征？","b":"春秋时期青铜重器，1923 年出土于新郑李家楼，郭沫若称它为时代精神之象征。串讲：一只欲飞的鹤站在沉重的壶上，正是新旧交替的那一刻。"},{"f":"武则天金简哪一年被发现？发现于何处？上面刻了多少个字？","b":"1982 年在登封嵩山峻极峰被一位农民发现，长 36 厘米多，刻 63 个字。串讲：它是目前我国发现的唯一一通皇帝金简。"},{"f":"汝窑传世品全世界有多少？这件天蓝釉刻花鹅颈瓶独特在哪里？","b":"汝窑烧造仅二十来年，传世品全世界不足百件；这件天蓝釉还带刻花，全世界仅此一件。串讲：雨过天青云破处，说的就是这种颜色。"}],"facts":[{"type":"单选","stem":"河南博物院创建于哪一年？","options":["1919 年","1927 年","1949 年","1961 年"],"answer":"B","explain":"1927 年创建，前身是河南省博物馆，最初设在开封。"},{"type":"单选","stem":"河南博物院的前身河南省博物馆，最初设在今天的哪座城市？","options":["郑州","洛阳","开封","安阳"],"answer":"C","explain":"1927 年创办于开封，1961 年才随省会迁到郑州。"},{"type":"单选","stem":"河南博物院随省会迁到郑州是在哪一年？","options":["1954 年","1961 年","1998 年","2021 年"],"answer":"B","explain":"1961 年随省会迁郑；1954 年是河南省会由开封迁郑的年份，两者相差七年。"},{"type":"单选","stem":"河南博物院主展馆的造型取自哪一处古建筑？","options":["登封少林寺","登封元代观星台","洛阳白马寺","开封铁塔"],"answer":"B","explain":"取自登封元代观星台，上窄下宽、呈金字塔形，寓意九鼎定中原。"},{"type":"单选","stem":"河南博物院现有馆藏文物约多少件？","options":["7 万余件","17 万余件","70 万余件","170 万余件"],"answer":"B","explain":"馆藏文物 17 万余件，其中一级文物 500 余件。"},{"type":"单选","stem":"贾湖骨笛出土于哪一处遗址？","options":["舞阳贾湖遗址","新郑李家楼","登封嵩山峻极峰","渑池仰韶村"],"answer":"A","explain":"出土于河南舞阳贾湖遗址，属裴李岗文化；新郑李家楼是莲鹤方壶出土地。"},{"type":"单选","stem":"贾湖骨笛是用哪种动物的骨骼制成的？","options":["丹顶鹤的尺骨","大雁的翅骨","牛的肩胛骨","鹿的腿骨"],"answer":"A","explain":"用丹顶鹤的尺骨制成，上面有七个孔，仍能吹奏七声音阶。"},{"type":"单选","stem":"莲鹤方壶出土于哪一年？","options":["1899 年","1923 年","1939 年","1982 年"],"answer":"B","explain":"1923 年出土于新郑李家楼，是春秋时期的青铜重器。"},{"type":"单选","stem":"武则天金简上共刻有多少个字？","options":["36 个","63 个","83 个","500 个"],"answer":"B","explain":"金简长 36 厘米多，上面刻着 63 个字，大意是祈求除罪消灾。"},{"type":"判断","stem":"河南博物院 1927 年创建于郑州，1961 年迁到开封。","options":["正确","错误"],"answer":"B","explain":"方向说反了：1927 年创办于开封，1961 年才随省会迁到郑州。"},{"type":"判断","stem":"贾湖骨笛距今约 8000 年，至今仍能吹奏出完整的七声音阶。","options":["正确","错误"],"answer":"A","explain":"骨笛距今约 8000 年，七孔仍可吹奏七声音阶，被称为中华第一笛。"},{"type":"判断","stem":"莲鹤方壶是商代晚期的青铜器，出土于安阳殷墟。","options":["正确","错误"],"answer":"B","explain":"莲鹤方壶是春秋时期青铜器，1923 年出土于新郑李家楼，与殷墟无关。"},{"type":"填空","stem":"河南博物院目前馆藏文物____万余件，其中一级文物 500 余件。","answer":"17","explain":"馆藏文物 17 万余件，史前文物、商周青铜器、历代陶瓷、石刻造像是最有特色的四类。"},{"type":"填空","stem":"贾湖骨笛出土于河南____贾湖遗址，属裴李岗文化。","answer":"舞阳","explain":"舞阳贾湖遗址出土，用丹顶鹤尺骨制成，距今约 8000 年。"},{"type":"填空","stem":"武则天金简 1982 年发现于登封____峻极峰，由一位农民捡到。","answer":"嵩山","explain":"1982 年在登封嵩山峻极峰被发现，是我国目前唯一的皇帝金简。"},{"type":"填空","stem":"河南博物院的宣传语是“一部____史，半部中国史”。","answer":"河南","explain":"一部河南史，半部中国史，是结束段用来收束全篇的一句话。"}],"secs":[{"h":"第 1 段 · 开场（约 40 秒）","t":"各位游客朋友，大家好！欢迎大家来到河南博物院。我是大家今天的讲解员，姓×，大家可以叫我小×。很高兴能陪大家一起走进这座\"中原古代文明之光\"的殿堂。大家刚从外面进来，可以先在这边站一站，把外套和背包整理好，缓一口气，咱们再往里走。今天我们的参观大约需要一个半小时，我会带大家重点看四件镇院之宝。参观过程中请大家跟紧队伍，展厅里人多，尽量不要掉队；展厅内请不要触摸展柜、不要使用闪光灯，有需要随时叫我。"},{"h":"第 2 段 · 城市概况（约 1 分 20 秒）","t":"在进馆之前，我先用两分钟，说一说我们脚下的这座城市。大家一边走一边听就好，不用停下来记。郑州是河南省省会，北临黄河、西依嵩山，自古就有\"九州腹地、十省通衢\"的说法。早在 3600 年前，商代早期的都城就建在这里，今天市中心还保留着那段商代城墙遗址，所以我们常说郑州是一座\"火车拉来的城市\"，也是一座\"被城墙托起来的古都\"。大家可以想一想，我们现在走的这条马路底下，说不定就压着三千多年前的人走过的路。1954 年河南省会由开封迁到郑州，今天的郑州是全国重要的铁路枢纽，也是\"米\"字形高铁网的中心。一座城，一头连着三千六百年的商都，一头连着今天的高铁时代，这就是郑州。"},{"h":"第 3 段 · 博物院概况（约 1 分 40 秒）","t":"说完城市，我们再来看这座博物馆。请大家跟着我往这边走，一边走一边抬头看正前方。河南博物院创建于 1927 年，前身是河南省博物馆，最初设在开封；1961 年随省会迁到郑州；1998 年新馆落成开放；2021 年主展馆经过改造提升后重新对外开放。这几个年份听着有点绕，大家可以记个大概：先有馆、再进郑、后建新馆、最近换新颜。大家抬头看主展馆的造型，它取自登封的元代观星台，上窄下宽，呈金字塔形，寓意\"九鼎定中原\"，也暗合古人\"天圆地方\"的宇宙观。一个博物馆的建筑，本身就是一件展品，这一点，等会儿大家走进展厅，会有更深的体会。目前我院馆藏文物 17 万余件，其中一级文物 500 余件，史前文物、商周青铜器、历代陶瓷和石刻造像是最有特色的四类。今天时间有限，我给大家挑四件镇院之宝，一件一件讲，大家先别急着拍照，听我讲完再慢慢看。"},{"h":"第 4 段 · 核心讲解：四件镇院之宝（约 4 分 30 秒）","t":"第一件，贾湖骨笛。请大家往这边靠一靠，找一个能看清展柜的位置。就是这件不起眼的骨管，它用丹顶鹤的尺骨制成，出土于河南舞阳贾湖遗址，距今约 8000 年，是裴李岗文化的遗物。大家可以想一想，八千年前的人，手里只有石头和骨头，是怎么在这么细的一根管子上，一个孔一个孔钻出来的？最让人吃惊的是，它上面有七个孔，至今仍能吹奏出完整的七声音阶。在这之前，学术界一直认为中国早期的乐器只有五声音阶。这支骨笛一出土，直接把中国音乐史向前推了八千年。所以它被称为\"中华第一笛\"。第二件，莲鹤方壶，这一件，我要多讲两句。这是一对春秋时期的青铜重器，1923 年出土于新郑李家楼。大家看它的壶盖，一只仙鹤展翅欲立，好像马上就要从壶顶飞走；壶身又布满了蟠螭纹，厚重庄严。一只轻盈欲飞的鹤，站在一只沉重的青铜壶上——郭沫若先生因此称它为\"时代精神之象征\"，说它象征着一个旧时代即将结束、新时代即将到来的那一刻。看完了正面，大家不妨再绕到侧面看半圈，同一只鹤，换个角度，感觉完全不一样。第三件，武则天金简。这一件个头小，大家要凑近些看。这是 1982 年在登封嵩山峻极峰被一位农民发现的，长 36 厘米多，上面刻着 63 个字，大意是武则天派人在嵩山投下这枚金简，祈求除罪消灾。它是目前我国发现的唯一一通皇帝金简，也是研究武则天晚年思想的第一手实物。一个当了皇帝的女人，到晚年想的还是\"赎罪\"两个字，这枚金简背后的心境，大家可以自己体会。第四件，汝窑天蓝釉刻花鹅颈瓶，也是我最想让大家记住的一件。汝窑是宋代五大名窑之首，烧造时间只有短短二十来年，传世品全世界不足百件。而这件天蓝釉、还带刻花的，全世界仅此一件。古人说\"雨过天青云破处\"，说的就是这种颜色。大家凑近看，釉面像玉一样温润，这就是汝窑\"玛瑙为釉\"的效果。看完这一件，我们这一趟的重点，就算看完了。"},{"h":"第 5 段 · 结束（约 40 秒）","t":"各位朋友，从八千年前的骨笛，到三千年前的青铜，再到一千年前的汝瓷，一个半小时走下来，我们其实只走过了中原文明的几个片段。走出展厅的时候，大家不妨回头再看一眼这座大厅，看看刚才我们一件一件走过的展柜。河南博物院有一句宣传语，叫\"一部河南史，半部中国史\"。希望大家今天带走的，不只是几张照片，还有对这片土地的一点敬意。接下来是自由参观时间，四十分钟后我们在序厅集合，路上有什么想问的，随时过来找我。请大家注意脚下台阶，保管好随身物品。谢谢大家！"}],"kw":["1927 创建","17 万件","观星台造型","贾湖骨笛 8000 年","莲鹤方壶·郭沫若","金简 63 字","汝窑全球唯一"],"warn":"河南博物院在郑州，不是开封——它 1927 年创办于开封，1961 年才迁郑州，这两句一起说不会错。","k":"bowuyuan","core":true},{"name":"龙门石窟","city":"洛阳","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是龙门石窟。各位朋友，欢迎大家来到古都洛阳！咱们今天的目的地，就在洛阳城南的伊河两岸。上车之前我先提三件小事：第一，景区台阶多，石面被踩得很光，一定要穿防滑的鞋，走路不拍照、拍照不走路；第二，洞窟里的造像和题记最怕强光和触摸，闪光灯请关掉，栏杆请不要翻越；第三，跟着我的小旗走，集合时间是十一点半，就在景区北门。好，咱们出发！"},{"h":"第2段 · 城市概况（约1分20秒）","t":"要看懂龙门石窟，得先说说它所在的这座城市——洛阳。洛阳在河南西部，黄河中游，伊河、洛河穿城而过，自古就是中原腹地。历史上先后有多个王朝在这里建都，长期是政治、经济和文化的中心，所以人们常说，洛阳的地下埋着一部中国史。佛教东传以后，洛阳又成了重要的佛教中心，城东的白马寺，就是佛教传入中国后最早兴建寺院的地方之一。洛阳还是著名的牡丹城，每年春天花开的时候，满城都是赏花的人。而龙门石窟，就坐落在洛阳南郊伊河出山口的位置，是洛阳最闪亮的一张名片。可以说，先有洛阳这座千年古都的底蕴，才有伊阙崖壁上那十万余尊造像的气象。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"现在我们把目光转向伊河两岸。龙门石窟分布在伊河东西两面的山崖上，西山叫龙门山，东山叫香山，两山夹着一河，远远望去就像一座天然的门阙，所以古时候这里叫“伊阙”，后来才改称龙门。整个石窟南北绵延长约一公里，现存窟龛两千三百四十五个，造像十万余尊，碑刻题记两千八百余品。它开凿于北魏孝文帝迁都洛阳、也就是公元四百九十三年前后，此后历经四百余年，一代一代接力营造。公元两千年十一月，龙门石窟被列入《世界遗产名录》。要说代表洞窟，北魏有宾阳三洞，唐代有万佛洞，古阳洞以魏碑书法闻名，此外还有药方洞、潜溪寺、看经寺。东山这边，还有香山寺和白园，白园就是白居易的墓园。东西两山一河之隔，我们先看西山，再摆渡到河东，一路走一路讲。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"第一，我们先弄明白，古人为什么偏偏选中了伊阙。龙门一带的山体是厚层石灰岩，石质细腻、硬度适中，既容易开凿，又能刻出很精细的线条；伊河从山谷中穿过，水路旱路都通，石料运得出去，工匠也进得来。那时候没有机械，全靠人力和水路，这条水道就是龙门的命脉。更关键的是位置，这里紧靠着北魏的都城洛阳。公元四百九十三年，孝文帝把都城迁到洛阳，皇室和贵族需要一处就近的佛教圣地来表达信仰、积累功德，伊阙这片崖壁，就成了最好的选择。在这里一直响了下去，前后历经四百多年，直到唐代才慢慢停下来。所以看龙门，其实就是在看两个高峰，一个是北魏，一个是唐代。第二，我们先看北魏的精华。宾阳三洞是北魏皇家主持开凿的一组洞窟，三洞并列，中洞保存最为完整。佛像面容清瘦，脖颈细长，衣纹规整下垂，带着北方民族那种刚健挺拔的气质，这就是美术史上常说的“秀骨清像”。再看古阳洞，它是龙门开凿最早的洞窟之一，洞内密密麻麻布满了北魏贵族、官吏发愿造像留下的佛龛和题记，一龛挨着一龛，几乎没有空隙。有的题记只有短短几行，却把一个家族的祈愿留了一千多年之久。这些题记不只是史料，更是书法珍品，魏碑书法方峻雄强，古阳洞就是它最集中的宝库，可以说，北魏的龙门，是皇家气派和士族信仰一起刻在石头上的一段历史。第三，到了唐代，龙门的风格为之一变。最有代表性的是万佛洞，洞内壁面上密密麻麻刻满了小佛，多得数不清，“万佛”之名就是这么来的；佛像的面容也从清瘦变得圆润丰满，衣纹流畅贴体，神态安详，人间气息更浓，这是盛唐审美最直接的样子。除了万佛洞，潜溪寺、看经寺也各有看点，看经寺的罗汉像，是唐代雕刻中的精品。特别值得一提的是药方洞，洞口两侧刻着大量治病药方，涉及内科、外科、妇科、儿科，是研究古代医学的珍贵实物资料。一个石窟里既有佛法，又有医术，这正是龙门最打动人的地方：它不只有高高在上的神，还有普通人的生老病死。第四，也是全场的高潮，奉先寺。奉先寺是龙门规模最大的一处摩崖佛龛，主尊卢舍那大佛通高十七点一四米，站在佛脚抬头往上看，人才到它的膝盖。这是龙门体量最大的一尊造像，也是唐代石窟艺术的顶点。大佛面容圆润丰腴，双眉弯如新月，双目微微下垂，嘴角含着一丝笑意；无论你站在哪个角度，都觉得它在看着你、听着你，所以有人称它是“东方的蒙娜丽莎”。主佛两侧，还立着弟子、菩萨、天王、力士，有的肃穆，有的威猛，一站一立之间，把佛国的庄严和人间的情感都刻活了。站在这里，四百多年的锤声、无数无名工匠的一生，好像都凝在了这一张脸上。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，今天的龙门之行到这里就接近尾声了。从北魏的清瘦刚健，到唐代的丰腴圆融，四百多年、十万余尊造像，我们在伊河两岸读完了半部中国佛教艺术史。如果还有时间，东山上的香山寺和白园值得走一走，白园里长眠着诗人白居易。请大家带好随身物品，十一点半在北门集合。祝愿大家在洛阳吃得香、玩得好，一路平安，咱们后会有期，再见！"}],"kw":["伊阙","伊河两岸","窟龛2345个","造像十万余尊","魏碑古阳洞","宾阳三洞","万佛洞","卢舍那大佛","世界遗产","白园香山寺"],"warn":"易错提醒：开凿始于北魏孝文帝迁都洛阳前后，别讲成东汉；万佛洞属唐代、宾阳三洞属北魏，两者别对调；卢舍那大佛通高17.14米，不要说成17米。","mind":[{"h":"开场","kids":["问候考官","自我介绍与景点名","安全与集合提醒"]},{"h":"城市概况","kids":["洛阳的古都地位","伊河洛河与佛教中心","牡丹城与龙门的位置"]},{"h":"景点概况","kids":["两山夹一河，古称伊阙","三组数字：窟龛、造像、题记","2000年11月列入世界遗产","代表洞窟与香山寺白园"]},{"h":"核心讲解","kids":["为何选伊阙：石质、水路、靠都城","北魏：宾阳三洞与古阳洞魏碑","唐代：万佛洞与药方洞","奉先寺卢舍那大佛17.14米"]},{"h":"欢送结束","kids":["北魏到唐的艺术脉络","香山寺白园推介","集合时间与祝福"]}],"cards":[{"f":"龙门石窟古称什么？","b":"伊阙。两山夹一水，远望如门阙，先有“伊阙”之名，后有“龙门”之称。"},{"f":"现存窟龛多少个？","b":"2345个。记成两千三百四十五，别和两千四百三十五混淆。"},{"f":"现存造像多少尊？","b":"10万余尊。一公里崖壁上十万余尊，密度惊人。"},{"f":"碑刻题记多少品？","b":"2800余品。题记既是史料，也是书法。"},{"f":"南北绵延多长？","b":"约1公里。走完这一公里，等于走过四百年。"},{"f":"开凿始于哪一年前后？","b":"493年前后，北魏孝文帝迁都洛阳之时。"},{"f":"卢舍那大佛通高多少？","b":"17.14米。站在佛脚抬头看，人才到它的膝盖。"},{"f":"哪一年列入世界遗产？","b":"2000年11月。这是龙门走向世界的一张证书。"},{"f":"哪个洞窟以魏碑书法著称？","b":"古阳洞。学书法的人专程来这里看碑。"},{"f":"宾阳三洞开凿于哪个朝代？","b":"北魏。皇家主持，面容清瘦，秀骨清像。"}],"facts":[{"type":"单选","stem":"龙门石窟位于下列哪条河的两岸？","options":["黄河","伊河","洛河","沁河"],"answer":"B","explain":"龙门石窟分布在伊河两岸的龙门山与香山崖壁上。"},{"type":"单选","stem":"龙门石窟古称什么？","options":["伊阙","伊川","洛汭","嵩阳"],"answer":"A","explain":"两山夹一水，远望如天然门阙，故古称伊阙。"},{"type":"单选","stem":"龙门石窟现存窟龛多少个？","options":["1345个","2345个","2435个","3245个"],"answer":"B","explain":"现存窟龛2345个，注意不要与2435混淆。"},{"type":"单选","stem":"龙门石窟现存造像多少尊？","options":["1万余尊","5万余尊","10万余尊","20万余尊"],"answer":"C","explain":"造像10万余尊，是龙门的核心数字之一。"},{"type":"单选","stem":"龙门石窟现存碑刻题记多少品？","options":["1800余品","2800余品","3800余品","4800余品"],"answer":"B","explain":"碑刻题记2800余品，是研究历史与书法的重要资料。"},{"type":"单选","stem":"龙门石窟南北绵延长约多少？","options":["500米","1公里","2公里","5公里"],"answer":"B","explain":"南北绵延长约1公里，沿伊河两岸展开。"},{"type":"单选","stem":"龙门石窟大规模开凿始于何时？","options":["东汉明帝时期","北魏孝文帝迁都洛阳前后","唐太宗贞观年间","北宋真宗时期"],"answer":"B","explain":"493年孝文帝迁都洛阳前后开凿，历经400余年。"},{"type":"单选","stem":"奉先寺卢舍那大佛通高多少米？","options":["15.14米","16.14米","17.14米","18.14米"],"answer":"C","explain":"卢舍那大佛通高17.14米，是龙门最大的造像。"},{"type":"单选","stem":"龙门石窟被列入《世界遗产名录》的时间是？","options":["1998年12月","2000年11月","2001年11月","2004年7月"],"answer":"B","explain":"2000年11月列入《世界遗产名录》。"},{"type":"判断","stem":"龙门石窟开凿于北魏孝文帝迁都洛阳前后，前后历经四百余年。","options":["正确","错误"],"answer":"A","explain":"493年前后始凿，历北魏至唐，延续400余年。"},{"type":"判断","stem":"万佛洞是北魏时期的代表性洞窟。","options":["正确","错误"],"answer":"B","explain":"万佛洞是唐代洞窟，北魏的代表是宾阳三洞。"},{"type":"判断","stem":"白园是白居易的墓园，位于龙门石窟景区内。","options":["正确","错误"],"answer":"A","explain":"白园在龙门东山，园内有白居易墓。"},{"type":"填空","stem":"龙门石窟位于河南省____市。","options":[],"answer":"洛阳","explain":"龙门石窟在洛阳南郊伊河两岸。"},{"type":"填空","stem":"龙门石窟古称“____”。","options":[],"answer":"伊阙","explain":"两山夹一水如门阙，故名伊阙。"},{"type":"填空","stem":"奉先寺____大佛通高17.14米。","options":[],"answer":"卢舍那","explain":"奉先寺主尊为卢舍那大佛，通高17.14米。"},{"type":"填空","stem":"2000年11月，龙门石窟被列入《____》。","options":[],"answer":"世界遗产名录","explain":"2000年11月列入《世界遗产名录》。"}],"k":"longmen","core":false},{"name":"云台山","city":"焦作","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是云台山。各位朋友，欢迎来到焦作！咱们今天要去的云台山，就在修武县境内、太行山的南麓。出发前我交代几句：山里多是石阶和栈道，湿气重、路面滑，一定穿防滑的鞋，走路不看景、看景不走路；峡谷里水汽大，手机相机注意防水；全程跟紧队伍，下午四点半在景区大门集合。好，我们出发！"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说焦作。焦作在河南西北部，北依太行，南临黄河，过去是一座以煤炭闻名的工业城市，如今已经转型成了山水旅游城市，云台山就是它最响亮的名片。云台山所在的修武县，历史很悠久，这一带自古就是从中原进太行的通道，山高谷深、水源充沛。更难得的是它的人文底色：魏晋时期，竹林七贤曾在云台山一带隐居，寄情山水、饮酒清谈，把一段文人的风骨留在了这片山林里；到了唐代，王维写下《九月九日忆山东兄弟》，一句“遍插茱萸少一人”，又让这里的茱萸峰成了无数人登高思亲的地方。所以我说，云台山不只是一片好山好水，它还是一座有故事的山。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"云台山景区总面积二百四十平方公里，地处太行山南麓，以山称奇、以水叫绝。山是硬的，水是软的，一硬一软，才有了云台山的名气。主峰茱萸峰海拔一千三百零八米，是景区的制高点，站在峰顶往下看，山谷、湖面和盘山路都收在眼里。整个景区由几个园区组成：红石峡，又叫温盘峪；潭瀑峡，又叫小寨沟；此外还有泉瀑峡、茱萸峰、叠彩洞、子房湖和猕猴谷。这里最出名的水景，是泉瀑峡尽头的云台天瀑，单级落差三百一十四米，水从高处直落而下，声势逼人。这里的崖壁上还保存着相当完整的地层剖面，一道道纹路，都是亿万年地壳运动留下的记录。二〇〇四年，云台山成为首批世界地质公园；二〇〇七年，又成为首批国家5A级景区。一块牌子给的是地质价值，一块牌子给的是游览品质，两者加在一起，才是我今天要带大家看的云台山。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"第一站，我们先进红石峡，当地人也叫它温盘峪。这条峡谷是云台山最精华的一段，两岸崖壁是紫红色的石英砂岩，一层一层，像被刀子切过；谷底是碧绿的潭水，红崖映着绿水，颜色对比极强烈，很多朋友第一眼看到，都以为是画。峡谷又窄又深，抬头只见一线天光，人在栈道上走，脚下是水，身边是崖，转过一个弯就是一幅新画，所以有人把它比作一座放大了的盆景，叫它“盆景峡谷”。谷里冬暖夏凉，当地人才叫它温盘峪。这里我要提醒大家，谷里常年晒不到太阳，湿冷路滑，一定扶好栏杆慢慢走，千万别为了拍照往后退，也别把手伸到水边去。第二站，我们去泉瀑峡看云台天瀑。泉瀑峡是云台山水景最集中的一条峡谷，一路走进去，溪流、深潭、跌水一个接一个，水声由远到近，越来越响，越往深处走空气越凉，衣服上很快就挂一层细水珠。走到峡谷尽头，抬头就是云台天瀑，单级落差三百一十四米，水从高处的崖口奔涌而下，中途几乎不沾石壁，落到谷底砸成一片水雾，晴天里常常能看见彩虹。站在观景台上，风裹着水汽扑在脸上，水声盖过人说话的声音，那种气势，照片是拍不出来的。我提醒一句：观瀑台的地面很滑，大家拍照时把手机抓稳，别挤到栏杆边上。第三站，是潭瀑峡，也就是小寨沟。和红石峡的幽深不同，潭瀑峡走的是秀丽一路：谷地平缓，泉水在石头间绕来绕去，一会儿是潭，一会儿是瀑，一会儿又汇成一片浅浅的溪面。这里的看点是水多、潭多、石头有形状，沿着栈道往里走，可以慢慢看、慢慢拍，不用赶时间，很适合带着老人和孩子。水浅的地方，能看清石头上的纹路，孩子们最喜欢蹲在那儿找小鱼。峡谷里的石头被水冲刷了很久很久，圆润光滑，纹理清楚，这也是云台山作为世界地质公园最直观的教材：您随手摸到的一块石头，可能比人类的历史长得多。走完潭瀑峡，旁边就是猕猴谷，太行猕猴在山林间成群活动，蹦跳攀爬，一点不怕人。大家可以远远地看、静静地拍，但千万不要投喂，也不要逗弄，野生动物有野生动物的规矩。最后一站，我们上茱萸峰。车会先走叠彩洞，那不是一条隧道，而是一组盘在山壁上的隧洞，洞洞相连、层层叠叠，车在洞里转，洞外就是深谷，坐在车上既紧张又过瘾。上了山，主峰茱萸峰海拔一千三百零八米，是云台山的最高点，也是看太行群山最好的位置。为什么叫茱萸峰？因为山上多茱萸。唐代王维写下“遥知兄弟登高处，遍插茱萸少一人”，重阳登高、插茱萸寄思念，这座峰从此就和那份思亲之情连在了一起。登上峰顶，太行山一层一层铺到天边，天气好的时候，云就在脚下走。在这里，我请大家放慢脚步，想一想自己心里牵挂的那个人。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，云台山的一天到这里就结束了。红石峡的红、潭瀑峡的秀、云台天瀑的壮、茱萸峰的远，四种味道，一个云台。咱们这一趟，走的是水，看的是山，记住的是一份心情。如果还有时间，子房湖的湖光山色也值得一看，湖名取自汉代张良的字。请大家检查随身物品，四点半景区大门集合。祝大家山路平安、心情舒畅，我们在下一个景点再见！"}],"kw":["太行山南麓","焦作修武县","240平方公里","红石峡温盘峪","云台天瀑314米","茱萸峰1308米","世界地质公园","首批5A景区","竹林七贤","王维茱萸"],"warn":"易错提醒：世界地质公园是2004年、首批5A级景区是2007年，这两个年份最容易对调；云台天瀑314米指单级落差，不要说成总落差。","mind":[{"h":"开场","kids":["问候考官","自我介绍与景点名","防滑与集合提醒"]},{"h":"城市概况","kids":["焦作与修武的位置","煤城转型山水旅游","竹林七贤与王维诗"]},{"h":"景点概况","kids":["240平方公里、太行南麓","主要园区与两处别名","2004世界地质公园、2007首批5A","云台天瀑单级落差314米"]},{"h":"核心讲解","kids":["红石峡：紫红崖壁与碧水","泉瀑峡：云台天瀑314米","潭瀑峡与小寨沟、猕猴谷","茱萸峰1308米与叠彩洞"]},{"h":"欢送结束","kids":["四景一句话总结","子房湖与张良","集合时间与祝福"]}],"cards":[{"f":"云台山位于河南哪个县？","b":"焦作市修武县，太行山南麓。说县名比说市名更准确。"},{"f":"景区总面积多少？","b":"240平方公里。面积大，园区才分得开。"},{"f":"主峰是哪座？海拔多少？","b":"茱萸峰，1308米，是景区制高点。"},{"f":"云台天瀑单级落差多少？","b":"314米。记住“单级”两个字，不是总落差。"},{"f":"哪一年成为首批世界地质公园？","b":"2004年。地质这块牌子来得更早。"},{"f":"哪一年成为首批国家5A级景区？","b":"2007年。别和2004年搞混。"},{"f":"红石峡又名什么？","b":"温盘峪。导游词里两个名字都要会。"},{"f":"潭瀑峡又名什么？","b":"小寨沟。潭瀑峡秀，小寨沟是它的乡土名。"},{"f":"“遍插茱萸少一人”出自谁的笔下？","b":"王维，《九月九日忆山东兄弟》。"},{"f":"哪七位名士曾在云台山一带隐居？","b":"竹林七贤。魏晋风骨留在这片山林。"}],"facts":[{"type":"单选","stem":"云台山位于河南省哪个地级市？","options":["焦作市","新乡市","安阳市","济源市"],"answer":"A","explain":"云台山在焦作市修武县境内。"},{"type":"单选","stem":"云台山地处哪座山脉的南麓？","options":["秦岭","太行山","伏牛山","王屋山"],"answer":"B","explain":"云台山位于太行山南麓。"},{"type":"单选","stem":"云台山景区总面积是多少？","options":["140平方公里","240平方公里","340平方公里","440平方公里"],"answer":"B","explain":"景区总面积240平方公里。"},{"type":"单选","stem":"云台山主峰茱萸峰的海拔是多少？","options":["1108米","1208米","1308米","1408米"],"answer":"C","explain":"主峰茱萸峰海拔1308米。"},{"type":"单选","stem":"云台天瀑的单级落差是多少？","options":["214米","264米","314米","414米"],"answer":"C","explain":"云台天瀑单级落差314米。"},{"type":"单选","stem":"云台山成为首批世界地质公园是哪一年？","options":["2001年","2004年","2007年","2010年"],"answer":"B","explain":"2004年成为首批世界地质公园。"},{"type":"单选","stem":"云台山成为首批国家5A级景区是哪一年？","options":["2004年","2005年","2007年","2010年"],"answer":"C","explain":"2007年成为首批国家5A级景区。"},{"type":"单选","stem":"红石峡又名什么？","options":["温盘峪","小寨沟","老潭沟","百家岩"],"answer":"A","explain":"红石峡又叫温盘峪。"},{"type":"单选","stem":"“遍插茱萸少一人”出自哪位诗人之手？","options":["李白","杜甫","王维","白居易"],"answer":"C","explain":"出自王维《九月九日忆山东兄弟》，与茱萸峰相关。"},{"type":"判断","stem":"云台山位于太行山南麓、焦作市修武县境内。","options":["正确","错误"],"answer":"A","explain":"位置为焦作修武县、太行山南麓。"},{"type":"判断","stem":"云台山于2007年成为首批世界地质公园。","options":["正确","错误"],"answer":"B","explain":"2004年是首批世界地质公园，2007年是首批国家5A级景区。"},{"type":"判断","stem":"潭瀑峡又名小寨沟。","options":["正确","错误"],"answer":"A","explain":"潭瀑峡的乡土名叫小寨沟。"},{"type":"填空","stem":"云台山位于河南省焦作市____县。","options":[],"answer":"修武","explain":"云台山在焦作市修武县境内。"},{"type":"填空","stem":"云台山主峰____峰海拔1308米。","options":[],"answer":"茱萸","explain":"主峰为茱萸峰，海拔1308米。"},{"type":"填空","stem":"云台天瀑位于____峡的尽头。","options":[],"answer":"泉瀑","explain":"云台天瀑在泉瀑峡尽头，单级落差314米。"},{"type":"填空","stem":"魏晋时期，“____”曾在云台山一带隐居。","options":[],"answer":"竹林七贤","explain":"竹林七贤曾在云台山一带隐居。"}],"k":"yuntaishan","core":false},{"name":"清明上河园","city":"开封","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是清明上河园。各位朋友，欢迎来到八朝古都开封，我是今天的讲解员小×。进园之前，我先提醒三件事：园子大、游客多，请大家跟紧队伍，不要走散；园内每天有多场演出，请留意演出时间，跟着我的节奏走；水边拍照请注意脚下，带孩子的朋友一定牵好手。好，现在请大家跟我一起，走进这幅会动的画里。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说开封。开封古称汴梁，又称东京，是北宋的都城，也是八朝古都。北宋的东京城人口稠密、商业繁盛，州桥夜市通宵不绝，瓦舍勾栏里说书唱曲耍百戏的，从早到晚不断人。孟元老在《东京梦华录》里回忆的，就是这座城的烟火气。开封的城市中轴线千年未改，龙亭湖一带至今还留着宋城的格局。开封人爱菊、爱夜市，嘴边常挂一句话：一城宋韵半城水。我们今天要去的清明上河园，就在龙亭湖西岸。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"清明上河园，是以北宋画家张择端的传世名画《清明上河图》为蓝本，按一比一比例复原的宋文化主题景区。它一九九八年十月建成开放，二〇一一年被评为国家五A级景区。园内主要景点有虹桥、汴河、上善门、校场、民俗街和宋都御街，一砖一瓦、一店一铺，都照着宋代的样式来。园子依水而建，汴河穿园而过，桥、街、门、场都围着这条水做文章。白天，园里轮番上演包公迎宾、王员外招婿、汴河漕运、蹴鞠、斗鸡等节目；到了晚上，大型水上实景演出《大宋·东京梦华》在湖面上开演。可以说，这座园子把《清明上河图》从纸上搬到了眼前，也把宋人的生活搬进了今天。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"进园以后，我按一条线带大家走：先看虹桥和汴河，再进上善门、逛宋都御街，然后到校场和民俗街看演出，最后留到晚上看《大宋·东京梦华》。这条线走下来，一幅画就活了。第一，请看这幅画的“画眼”——虹桥。虹桥是一座木结构拱桥，桥身不用一根桥柱，全靠木梁交错叠压、彼此咬合，像一道彩虹横跨汴河，所以叫虹桥。您站在桥上往两边看：桥上是摊贩、行人、车马，桥下是船工、桅杆、漕船，一幅长卷里最热闹的地方，就在这一上一下之间。每到漕船靠岸，船工喊号子、脚店卸货物，桥上桥下挤成一片，那份忙碌，画里画外一个样。汴河是北宋东京城的生命线，南方的粮食、丝绸、茶叶，都顺着这条河运进京城。所以张择端把虹桥放在全画正中，不是随手一画，而是把整座城的命脉点了出来。您再看桥头那几家脚店，就是当年供船工歇脚吃饭的地方。各位拍照时请留意身后，桥上人多。第二，穿过虹桥，我们来到上善门。上善门是园区的城门，“上善”二字取自“上善若水”，城门一开，里面就是另一番天地。进了门便是宋都御街，青石板铺地，两边勾栏瓦舍、酒楼茶坊，幌子迎风招展，伙计当街吆喝。这里的店铺不是布景，而是真在经营：打铁的、织布的、做点心的，都能看见手上的功夫。宋代的城市打破了坊和市的界限，临街可以开店，夜市可以通宵，商业的活力就藏在这条街上。您看那些幌子，写的是店名，也是行当，一眼就能认出哪家卖酒、哪家卖药。宋代人爱逛街，也爱在街上吃，一条御街就走出了市井百态。您不妨放慢脚步，看看招牌、听听吆喝，最有宋人的味道。第三，请各位跟我到校场。校场是园内的演武场，每天上演蹴鞠、斗鸡等节目。蹴鞠在宋代风行朝野，上到皇帝、下到百姓都爱踢，可以说是古代的全民运动；斗鸡则是市井里最有人气的消遣，两只公鸡一较劲，围观的人比鸡还紧张，常把场子围得水泄不通。看完校场，我们再逛民俗街，捏面人的、吹糖人的、演皮影的，宋代的百工技艺在这里都能见到。这些不是摆在玻璃柜里的展品，而是活着的民俗，游客还能上手参与。园里的演员也不只在台上演，散场后还会和游客搭话、合影，您会觉得他们真像从画里走出来的宋人。这也是清明上河园最讨人喜欢的地方：它让历史变得可以摸、可以玩、可以带走。第四，如果各位时间宽裕，我强烈建议留到晚上，看一场《大宋·东京梦华》。这是一台大型水上实景演出，以湖面为舞台、以夜空为背景，把宋词、漕运、市井、战争与繁华，一幕一幕铺展开来。灯光亮起，画舫从水面缓缓驶过，歌声从远处飘来，您会突然明白，张择端画里的汴京，原来是这样活着的。白天我们看的是街市，晚上看的是气象；白天是一幅画，晚上是一场梦。这就是清明上河园想给游客的完整答案，也是我每次带团最舍不得提前离园的一段。看完演出从园里出来，再回头看湖面上的灯影，那种感觉很难说清，只有亲自坐一回才知道。不少游客看完跟我说，这才明白什么叫一夜看尽汴京的繁华。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，今天的清明上河园就为大家讲解到这里。进园后大家可以自由活动，请记住集合的时间和地点，演出时间表在门口可以领取。园子大，建议大家穿舒适的鞋。希望各位把宋代的烟火气看够、吃够、拍够，也把这份“活在画里”的感觉带回家。祝大家在开封玩得开心，谢谢大家！"}],"kw":["龙亭湖西岸","张择端","清明上河图","一比一复原","1998年开放","国家5A景区","虹桥汴河","上善门","大宋·东京梦华","八朝古都"],"warn":"易错点：景区在龙亭湖西岸，不是东岸；园名是“园”，蓝本才是张择端的《清明上河图》，讲解时先报园名，再说蓝本，两者别说混。","mind":[{"h":"开场","kids":["问候考官并报号","转模拟带团口吻","安全与集合提醒","演出时间提醒"]},{"h":"城市概况","kids":["北宋东京、又称汴梁","八朝古都","《东京梦华录》与孟元老","一城宋韵半城水"]},{"h":"景点概况","kids":["张择端画作、一比一复原","1998年10月开放","2011年评5A","六大景点与日夜演出"]},{"h":"核心讲解","kids":["虹桥与汴河漕运","上善门与宋都御街","校场、民俗街与百工","《大宋·东京梦华》夜游"]},{"h":"欢送结束","kids":["自由活动与集合点","穿舒适鞋、注意水边","祝福语收尾"]}],"cards":[{"f":"清明上河园位于开封哪个湖的西岸？","b":"龙亭湖西岸。串讲：所以我们的集合点就定在龙亭湖西岸的园区大门。"},{"f":"园区以谁的画作为蓝本复原？","b":"北宋画家张择端的《清明上河图》。串讲：一幅画撑起一座园，这是它最硬的底气。"},{"f":"复原采用什么比例？","b":"一比一比例复原。串讲：所以画里的桥多宽、街多长，园里走着就是那个尺度。"},{"f":"哪一年建成开放？","b":"1998年10月。串讲：到今年它还不到三十岁，却把千年前的汴京做成了实景。"},{"f":"哪一年被评为国家5A级景区？","b":"2011年。串讲：开园十几年就拿到5A，靠的是“活态宋文化”这条路。"},{"f":"大型水上实景演出叫什么名字？","b":"《大宋·东京梦华》。串讲：白天看街市，晚上看这场演出，才算把园子看完整。"},{"f":"园内的城门叫什么？","b":"上善门。串讲：进了上善门就是宋都御街，一脚步入市井。"},{"f":"《东京梦华录》的作者是谁？","b":"孟元老。串讲：想懂北宋东京的烟火气，这本书是最好的底稿。"},{"f":"北宋都城东京又称什么？","b":"汴梁。串讲：所以开封人说“汴京”，说的就是脚下这片地。"},{"f":"园内每日上演的节目请举三个。","b":"包公迎宾、王员外招婿、汴河漕运，另有蹴鞠、斗鸡等。串讲：节目表就是一张宋代生活时间表。"}],"facts":[{"type":"单选","stem":"清明上河园位于开封哪个湖的西岸？","options":["包公湖","龙亭湖","铁塔湖","汴河"],"answer":"B","explain":"景区在龙亭湖西岸，与龙亭景区隔湖相望。"},{"type":"单选","stem":"清明上河园以哪位画家的作品为蓝本复原？","options":["孟元老","吴自牧","张择端","王希孟"],"answer":"C","explain":"蓝本是北宋张择端的《清明上河图》，孟元老写的是《东京梦华录》。"},{"type":"单选","stem":"园区按什么比例复原宋代风貌？","options":["一比二","一比五","一比十","一比一"],"answer":"D","explain":"按一比一比例复原，所以尺度与画中相近。"},{"type":"单选","stem":"清明上河园建成开放的时间是？","options":["1998年10月","1996年5月","2001年10月","2011年5月"],"answer":"A","explain":"1998年10月建成开放，2011年被评为5A级景区。"},{"type":"单选","stem":"清明上河园被评为国家5A级景区是在哪一年？","options":["2001年","2007年","2011年","2017年"],"answer":"C","explain":"2011年晋级国家5A级景区。"},{"type":"单选","stem":"园区大型水上实景演出的名称是？","options":["《东京梦华录》","《大宋·东京梦华》","《包公迎宾》","《汴河漕运》"],"answer":"B","explain":"《大宋·东京梦华》是水上实景演出，其余为园内日常节目或书名。"},{"type":"单选","stem":"《东京梦华录》的作者是？","options":["张择端","欧阳修","孟元老","苏轼"],"answer":"C","explain":"孟元老追忆北宋东京城而作《东京梦华录》。"},{"type":"单选","stem":"北宋都城东京又称？","options":["临安","汴梁","金陵","洛阳"],"answer":"B","explain":"东京又称汴梁、汴京，即今开封。"},{"type":"单选","stem":"下列不属于清明上河园主要景点的是？","options":["虹桥","上善门","校场","龙门石窟"],"answer":"D","explain":"龙门石窟在洛阳，园内主要景点有虹桥、汴河、上善门、校场、民俗街、宋都御街。"},{"type":"判断","stem":"清明上河园是以《清明上河图》为蓝本、按一比一比例复原的宋文化主题景区。","options":["正确","错误"],"answer":"A","explain":"表述准确，这是景区的根本定位。"},{"type":"判断","stem":"清明上河园位于开封龙亭湖东岸。","options":["正确","错误"],"answer":"B","explain":"位于龙亭湖西岸，方位不能讲反。"},{"type":"判断","stem":"《大宋·东京梦华》是一台室内舞台剧。","options":["正确","错误"],"answer":"B","explain":"它是大型水上实景演出，以湖面为舞台。"},{"type":"填空","stem":"清明上河园位于开封____西岸。","options":[],"answer":"龙亭湖","explain":"答“龙亭湖”即可，不要答成包公湖。"},{"type":"填空","stem":"园区以北宋画家____的《清明上河图》为蓝本。","options":[],"answer":"张择端","explain":"作者是张择端，不是孟元老。"},{"type":"填空","stem":"园区大型水上实景演出的名称是《____》。","options":[],"answer":"大宋·东京梦华","explain":"注意是“大宋”不是“东京梦华录”。"},{"type":"填空","stem":"记录北宋东京城风貌的著作是《____》，作者孟元老。","options":[],"answer":"东京梦华录","explain":"书名与演出名易混，需分清。"}],"k":"qingming","core":false},{"name":"芒砀山","city":"商丘","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是芒砀山。各位朋友，欢迎来到河南商丘永城，我是大家今天的讲解员小×。芒砀山是山岳型景区，游览以步行为主，我先提醒三件事：山上石阶多，请大家穿防滑的鞋，走路不拍照、拍照先停步；墓室里比较阴凉，建议带一件外套；景区文物多，请勿触摸石刻、翻越护栏。好，请大家跟我一起上山，去读一部刻在石头里的西汉史。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说说永城。永城在河南最东部，地处豫、鲁、苏、皖四省交界，自古就是东西往来的要冲，所以被称为“豫东门户”。这里是一片平原，芒砀山是平原上难得的一片山群，山不算高，分量却很重。从永城往北走，地势慢慢起伏，山就到了眼前。商丘地处中原腹地，历史文化厚重，而芒砀山的分量，全在一个“汉”字上：西汉梁国的王陵在这里，刘邦斩蛇起义的传说在这里，孔子避雨的传说也在这里。一座山，把汉代的开国、封国和文脉都收在了一处，所以人们称它是“汉兴之地”。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"芒砀山景区在二〇一七年被评为国家五A级景区，它的核心，是西汉梁国王陵墓群。梁国是西汉分封的重要诸侯国，梁孝王刘武及其王后、李王后等都葬在这片山里，形成了一处规模宏大的王陵墓群。王陵依山开凿，墓室深藏山腹，从外面看几乎不显，走进去才知道别有洞天。其中梁孝王王后墓开凿于山体之中，工程浩大，被称为“天下石室第一陵”。除了王陵，这里还有僖山汉墓出土的金缕玉衣，有中国历史上第一次大规模农民起义领袖陈胜的墓，有相传孔子避雨的夫子山和孔庙，还有汉高祖斩蛇碑。一处景区，从王侯到布衣，从庙堂到战场，都能看到，这在全国也不多见。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"上山这一路，我请大家记住四件事：一座石室王陵，一件金缕玉衣，一座陈胜墓，一块斩蛇碑，四件事串起来，就是芒砀山的骨架。第一，我们先看梁孝王王后墓。这座墓不是用土封起来的，而是直接从山体里凿出来的：工匠顺着石脉开山，凿出墓道、甬道、前室、后室和一圈回廊，把整座山变成了一座地下宫殿。走在里面，头顶是整块岩石，四壁是密密凿痕，您会明白什么叫“以山为陵”。它的规模之大、凿工之精，让它得了个“天下石室第一陵”的名号。更让人佩服的是排水，山体渗水顺着石槽汇到一处，再引出墓外，两千多年过去，墓室依然干爽。墓道两侧的石壁上，还留着当年凿石的痕迹，一道一道，都是人手一寸一寸凿出来的。站在这里，我们看到的不是一座坟，而是西汉的国力、技术和丧葬观念。您留意脚下这条墓道，越往深处越暗，走到尽头再回头看，才知道人在山里有多小。第二，我们去看金缕玉衣。这件玉衣出土于僖山汉墓，是用金丝把玉片一片一片编缀起来做成的殓服。在汉代，玉衣是最高等级的葬服，只有皇帝和高级贵族才有资格使用，编缀用的是金缕还是银缕、铜缕，直接对应墓主人的身份。玉在古代被认为能护住精气，所以人们让逝者玉衣裹身，求一个不朽。一件玉衣，要选料、要切割、要钻孔、要编缀，玉片大小不一，边角还要磨得严丝合缝，一件做下来，耗的是大量人工，背后是一整套汉代的手工业体系。看玉衣，看的不是一块块玉，而是汉人对生死的想象。站在展柜前，玉片的温润和金丝的微光，会让人一下子安静下来。第三，我们到陈胜墓前。陈胜是中国历史上第一次大规模农民起义的领袖，一句“王侯将相，宁有种乎”，喊出了两千多年前普通人的心声。他起兵反秦，虽然事败身死，却点燃了推翻秦朝的第一把火。他最终葬在芒砀山，墓冢就安放在这片山脚下。很多人站在这座坟前，会想起课本里那句“苟富贵，无相忘”，一个雇农的抱负，最后落在了这座山上。有意思的是，芒砀山既有梁王的陵，也有陈胜的墓：一个是诸侯王，一个是戍卒出身；一个以山为陵，一个土冢一抔，相距不远，却把两个世界摆在了一起。这也是我带团时最爱讲的一段：历史不只写在王陵里，也写在土冢上。第四，我们再看两处，夫子山和汉高祖斩蛇碑。夫子山相传是孔子周游列国时避雨的地方，后人在此建庙纪念，山因此得名。一位讲礼乐的老师，在乱世里淋了一场雨，这个画面比任何碑刻都动人。而斩蛇碑记的是另一个故事：相传刘邦在此斩白蛇起义，从此踏上反秦之路，最终建立汉朝。一个讲文的孔子，一个讲武的刘邦，加上西汉梁国的王陵，都聚在芒砀山，这就是“汉兴之地”四个字的来历。孔子避雨是传说，斩蛇起义也是传说，可传说之所以留在这里，是因为这片山真的见证过那段历史。走完这一圈您会发现，芒砀山不高，却把中国历史的一段开头，稳稳放在了这里。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，今天的芒砀山就为大家讲解到这里。下山的路请大家跟着队伍走，石阶湿滑处扶好栏杆。景区里还有几处展馆，感兴趣的朋友可以自由参观，请记住集合时间和地点。希望今天这一趟，让您记住的不只是几座墓、几件玉衣，更是“汉兴之地”这四个字的分量。祝大家一路平安，谢谢大家！"}],"kw":["豫东门户","四省交界","西汉梁国王陵","天下石室第一陵","金缕玉衣","陈胜墓","夫子山孔庙","汉高祖斩蛇碑","汉兴之地","国家5A景区"],"warn":"易错点：“砀”读dàng，石字旁，别读错写错；“天下石室第一陵”指梁孝王王后墓，不是梁孝王墓，讲解时务必分清楚。","mind":[{"h":"开场","kids":["问候考官并报号","转模拟带团口吻","石阶防滑提醒","墓室阴凉、勿触文物"]},{"h":"城市概况","kids":["永城在河南最东部","豫鲁苏皖四省交界、豫东门户","平原上的山群","汉兴之地的三层含义"]},{"h":"景点概况","kids":["2017年评5A","核心为西汉梁国王陵墓群","梁孝王刘武及王后、李王后","其余四处看点"]},{"h":"核心讲解","kids":["王后墓与天下石室第一陵","僖山金缕玉衣与汉代葬制","陈胜墓与王陵的对照","夫子山、斩蛇碑与汉兴之地"]},{"h":"欢送结束","kids":["下山安全提醒","自由参观与集合点","点题收尾祝福"]}],"cards":[{"f":"芒砀山位于哪个省、哪个市？","b":"河南省商丘市永城市北部。串讲：所以我们的行程从永城出发，走的是豫东这条线。"},{"f":"芒砀山地处几省交界，被称为什么？","b":"豫、鲁、苏、皖四省交界，被称为“豫东门户”。串讲：四个省的人赶集都能碰面，位置就是它的第一张名片。"},{"f":"芒砀山的核心文化遗存是什么？","b":"西汉梁国王陵墓群。串讲：一座山藏着几代梁王的陵，这才是它评上5A的底气。"},{"f":"“天下石室第一陵”指的是哪座墓？","b":"梁孝王王后墓。串讲：它是凿山为室，不是封土为陵，别和梁孝王墓讲混。"},{"f":"梁孝王叫什么名字？","b":"刘武。串讲：记住刘武，梁国王陵的谱系就串起来了。"},{"f":"金缕玉衣出土于哪座汉墓？","b":"僖山汉墓。串讲：一件玉衣，把汉代的等级制度和手工业都摆在了眼前。"},{"f":"芒砀山安葬着哪位农民起义领袖？","b":"陈胜，中国历史上第一次大规模农民起义的领袖。串讲：王陵与土冢相邻，正好成了历史的对照。"},{"f":"夫子山因何得名？","b":"相传孔子周游列国时在此避雨，后建孔庙，山因此得名。串讲：一座山有了孔庙，文脉就落了地。"},{"f":"汉高祖斩蛇碑纪念的是哪件事？","b":"相传刘邦在此斩白蛇起义。串讲：碑上一刀，接的是汉朝的开头。"},{"f":"芒砀山的文化定位是什么？哪年评上5A？","b":"文化定位为“汉兴之地”，2017年被评为国家5A级景区。串讲：汉兴之地四个字，正好收住全程讲解。"}],"facts":[{"type":"单选","stem":"芒砀山位于下列哪座城市？","options":["河南永城","安徽砀山","山东单县","江苏丰县"],"answer":"A","explain":"芒砀山在河南省商丘市永城市北部，砀山则是安徽的县名，切勿混淆。"},{"type":"单选","stem":"芒砀山地处几省交界？","options":["三省","四省","五省","六省"],"answer":"B","explain":"地处豫、鲁、苏、皖四省交界，故称“豫东门户”。"},{"type":"单选","stem":"芒砀山的核心文化遗存是？","options":["东汉帝陵","西汉梁国王陵墓群","殷墟遗址","北宋皇陵"],"answer":"B","explain":"核心是西汉梁国王陵墓群，包括梁孝王刘武及王后、李王后墓等。"},{"type":"单选","stem":"被称为“天下石室第一陵”的是？","options":["梁孝王墓","僖山汉墓","梁孝王王后墓","陈胜墓"],"answer":"C","explain":"梁孝王王后墓开凿于山体之中，规模宏大，得此称号。"},{"type":"单选","stem":"僖山汉墓出土的著名文物是？","options":["长信宫灯","莲鹤方壶","司母戊鼎","金缕玉衣"],"answer":"D","explain":"僖山汉墓出土金缕玉衣，是景区重要看点。"},{"type":"单选","stem":"中国历史上第一次大规模农民起义的领袖，葬于芒砀山的是？","options":["陈胜","吴广","项羽","刘邦"],"answer":"A","explain":"陈胜墓在芒砀山，他与吴广共同发动起义，但葬于此地的是陈胜。"},{"type":"单选","stem":"夫子山的得名与哪位思想家有关？","options":["孟子","老子","孔子","荀子"],"answer":"C","explain":"相传孔子周游列国时在此避雨，后建孔庙，山名由此而来。"},{"type":"单选","stem":"汉高祖斩蛇碑纪念的是谁？","options":["项羽","张良","刘邦","萧何"],"answer":"C","explain":"相传刘邦在芒砀山斩白蛇起义，后建碑纪念。"},{"type":"单选","stem":"芒砀山被评为国家5A级景区是在哪一年？","options":["2011年","2017年","2015年","2019年"],"answer":"B","explain":"2017年被评为国家5A级景区。"},{"type":"判断","stem":"芒砀山地处四省交界，被称为“豫东门户”。","options":["正确","错误"],"answer":"A","explain":"表述准确，这是芒砀山区位的第一特征。"},{"type":"判断","stem":"梁孝王王后墓开凿于山体之中，被称为“天下石室第一陵”。","options":["正确","错误"],"answer":"A","explain":"正确，注意称号只属于王后墓。"},{"type":"判断","stem":"芒砀山于2011年被评为国家5A级景区。","options":["正确","错误"],"answer":"B","explain":"是2017年，2011年是清明上河园晋级5A的年份，容易串。"},{"type":"填空","stem":"芒砀山位于河南省商丘市____市北部。","options":[],"answer":"永城","explain":"答“永城”，不要答成安徽砀山。"},{"type":"填空","stem":"芒砀山的文化定位是“____”。","options":[],"answer":"汉兴之地","explain":"四个字概括了梁国王陵、斩蛇碑与夫子山。"},{"type":"填空","stem":"僖山汉墓出土的著名文物是____。","options":[],"answer":"金缕玉衣","explain":"以金丝编缀玉片的汉代高级殓服。"},{"type":"填空","stem":"西汉梁国的诸侯王梁孝王名叫____。","options":[],"answer":"刘武","explain":"梁孝王刘武，其王后墓即“天下石室第一陵”。"}],"k":"mangdang","core":false},{"name":"安阳殷墟","city":"安阳","mind":[{"h":"开场","kids":["问候考官、自我介绍","走进三千三百年前商代晚期都城","景区多是遗址与夯土基址","不攀爬、不触摸，跟队慢行"]},{"h":"城市概况","kids":["安阳在河南最北，太行山东麓、洹水之滨","中国八大古都之一","盘庚迁殷，八代十二王","三张名片：甲骨、周易、红旗渠"]},{"h":"殷墟概况","kids":["小屯村一带，总面积约 30 平方公里","价值三字：字、铜、都","1961 年第一批国保，2006 年世界遗产","2024 年 2 月新馆开放"]},{"h":"核心讲解","kids":["字：15 万片甲骨、2017 入世界记忆名录","铜：后母戊鼎 832.84 公斤","妇好墓 1976 年，唯一完整王室墓","都：YH127 坑一万七千多片"]},{"h":"结束","kids":["甲骨让商朝从传说变信史","不只看出土了多少文物","二十分钟自由参观","新馆门口集合，不越护栏"]}],"cards":[{"f":"殷墟位于安阳市西北的哪个村一带？范围有多大？","b":"小屯村一带，东西约 6 公里、南北约 5 公里，总面积约 30 平方公里。串讲：记住小屯这个村名，殷墟所有故事都从这里挖出来。"},{"f":"商王盘庚迁都于殷大约在公元前多少年？殷做了多少年都城？","b":"公元前 1300 年前后，此后两百多年一直是商代都城，历八代十二王。串讲：盘庚一迁，商朝才算有了固定的家。"},{"f":"殷墟哪一年列为第一批全国重点文物保护单位？哪一年列入《世界遗产名录》？","b":"1961 年列为第一批全国重点文物保护单位，2006 年列入《世界遗产名录》。串讲：61 国保、06 世遗，两个年份要成对说。"},{"f":"1899 年是谁在中药龙骨上发现了甲骨文？","b":"金石学家王懿荣。串讲：他这一眼，让商朝从传说走进了信史。"},{"f":"殷墟出土的有字甲骨约有多少片？上面出现的单字约多少个？","b":"有字甲骨约 15 万片，单字约四千多个，目前只释读了一部分。串讲：考场上说四千多个、释读一部分最稳，别报具体释读字数。"},{"f":"甲骨文哪一年被联合国教科文组织列入世界记忆名录？","b":"2017 年。串讲：2017 入世界记忆、2006 殷墟入世界遗产，两个名录别串。"},{"f":"后母戊鼎哪一年、在哪里出土？有多重？","b":"1939 年出土于武官村，重 832.84 公斤，是我国现存最重的青铜器。串讲：832.84 这个小数点，一定要报准。"},{"f":"妇好墓哪一年发掘？出土文物多少件？","b":"1976 年发掘，是殷墟唯一一座保存完整、未被盗掘的商代王室墓葬，出土文物一千九百多件。串讲：一座墓，把史书、甲骨和实物三方对上了。"},{"f":"妇好是谁？甲骨文记载她最多一次统兵多少人？","b":"商王武丁的王后，中国历史上第一位有文字记载的女将军，最多一次统兵一万三千人。串讲：三千年前的女将军，是靠甲骨文自己证明的。"},{"f":"YH127 坑哪一年发掘？出土带字甲骨多少片？被称为什么？","b":"1936 年在小屯村北发掘，一个坑就出土带字甲骨一万七千多片，被称为甲骨档案库。串讲：一个坑，等于一座商王朝的档案馆。"}],"facts":[{"type":"单选","stem":"殷墟位于安阳市西北的哪一处村落一带？","options":["小屯村","武官村","王垛村","李家楼"],"answer":"A","explain":"殷墟核心区在小屯村一带；武官村是后母戊鼎出土地，王垛村在三门峡灵宝。"},{"type":"单选","stem":"殷墟遗址总面积约多少平方公里？","options":["3 平方公里","13 平方公里","30 平方公里","60 平方公里"],"answer":"C","explain":"东西约 6 公里、南北约 5 公里，总面积约 30 平方公里。"},{"type":"单选","stem":"1899 年在中药龙骨上发现甲骨文的是谁？","options":["郭沫若","王懿荣","罗振玉","王国维"],"answer":"B","explain":"金石学家王懿荣认出龙骨上的刻痕是比青铜铭文更古老的文字。"},{"type":"单选","stem":"后母戊鼎的重量是多少？","options":["382.84 公斤","632.84 公斤","832.84 公斤","1032.84 公斤"],"answer":"C","explain":"重达 832.84 公斤，是我国现存最重的青铜器。"},{"type":"单选","stem":"后母戊鼎出土于哪一年？","options":["1899 年","1927 年","1939 年","1976 年"],"answer":"C","explain":"1939 年出土于武官村，铸造它需要上千公斤铜液同时浇注。"},{"type":"单选","stem":"妇好墓的发掘年份是哪一年？","options":["1936 年","1976 年","1996 年","2006 年"],"answer":"B","explain":"1976 年在宫殿区附近发掘，是殷墟唯一保存完整、未被盗掘的商代王室墓葬。"},{"type":"单选","stem":"殷墟被列入《世界遗产名录》是在哪一年？","options":["1961 年","2006 年","2017 年","2024 年"],"answer":"B","explain":"1961 年列为第一批全国重点文物保护单位，2006 年列入《世界遗产名录》。"},{"type":"单选","stem":"甲骨文被列入世界记忆名录是在哪一年？","options":["2006 年","2017 年","2021 年","2024 年"],"answer":"B","explain":"2017 年甲骨文被联合国教科文组织列入世界记忆名录。"},{"type":"单选","stem":"殷墟博物馆新馆对外开放是在什么时候？","options":["2021 年","2022 年","2023 年","2024 年 2 月"],"answer":"D","explain":"2024 年 2 月开放，是我国首个全景式展现商文明的国家重大考古专题博物馆。"},{"type":"判断","stem":"殷是商朝后期的称呼，墟是废墟，殷墟即商代都城遗址。","options":["正确","错误"],"answer":"A","explain":"开场破题就用这一句，把名字解释清楚再往下讲。"},{"type":"判断","stem":"妇好墓是殷墟唯一一座保存完整、未被盗掘的商代王室墓葬。","options":["正确","错误"],"answer":"A","explain":"1976 年发掘，出土文物一千九百多件，是殷墟唯一未被盗掘的王室墓。"},{"type":"判断","stem":"后母戊鼎 1939 年出土于小屯村，是我国现存最重的青铜器。","options":["正确","错误"],"answer":"B","explain":"出土地说错了：后母戊鼎 1939 年出土于武官村，不是小屯村；重量说法正确。"},{"type":"填空","stem":"公元前 1300 年前后，商王____把都城迁到殷。","answer":"盘庚","explain":"盘庚迁殷，此后八代十二王在此执政，两百多年为商代都城。"},{"type":"填空","stem":"殷墟出土的有字甲骨约有____万片。","answer":"15","explain":"有字甲骨约 15 万片，单字约四千多个，目前只释读了一部分。"},{"type":"填空","stem":"后母戊鼎重____公斤，是我国现存最重的青铜器。","answer":"832.84","explain":"1939 年出土于武官村，重 832.84 公斤。"},{"type":"填空","stem":"1936 年小屯村北发掘的____坑，一个坑就出土带字甲骨一万七千多片。","answer":"YH127","explain":"YH127 坑被称为甲骨档案库，是都城遗址部分最硬的一个数字。"}],"secs":[{"h":"第 1 段 · 开场（约 40 秒）","t":"各位游客朋友，大家好！欢迎来到安阳殷墟。我是今天的讲解员小×。接下来我们将走进三千三百年前商代晚期的都城，去看中国有文字可考的历史是从哪里开始的。大家一下车，脚下踩的就是遗址区的地面，这里的一草一木、一土一石，都比我们想象的要老得多。景区内多是遗址和夯土基址，请大家不要攀爬、不要触摸，跟着我慢慢走，边走边讲；脚下路不平，看清楚再迈步。"},{"h":"第 2 段 · 城市概况（约 1 分 20 秒）","t":"从停车场到景区门口，这一段路正好够我把安阳交代清楚。安阳在河南最北边，太行山东麓、洹水之滨，是中国八大古都之一。这座城市的资历很老：三千多年前商王盘庚把都城迁到这里，此后八代十二王在这里执政；这里出土了甲骨文，是汉字的故乡；周文王被囚羑里而演《周易》，所以这里也是《周易》的发祥地；上世纪六十年代，林县人民又在太行山上凿出了红旗渠。一片甲骨惊天下、一部周易传千古、一条天河绕太行，这就是安阳的三张名片。大家可以想一想，这三张名片，随便拿出哪一张，别的城市都未必接得住。"},{"h":"第 3 段 · 殷墟概况（约 1 分 40 秒）","t":"现在请大家把注意力收回来。先说殷墟这两个字：\"殷\"是商朝后期的称呼，\"墟\"是废墟，合起来就是\"商代都城遗址\"。它位于安阳市西北的小屯村一带，东西约 6 公里、南北约 5 公里，总面积约 30 平方公里。公元前 1300 年前后，商王盘庚迁都于此，一直到商纣王亡国，这里做了两百多年的都城。殷墟的价值，可以用三个字概括：字、铜、都——甲骨文、青铜器、都城遗址。大家先把这三个字记住，后面我就按这个顺序，一件一件给大家展开。1961 年它被列为第一批全国重点文物保护单位，2006 年被列入《世界遗产名录》。2024 年 2 月，殷墟博物馆新馆对外开放，是我国首个全景式展现商文明的国家重大考古专题博物馆。等会儿大家在园子里看到的那些高高低低的土台子，可不要当成普通的荒地，那都是当年建筑的基址——我们脚下踩着的，是一座三千年前的城。"},{"h":"第 4 段 · 核心讲解（约 4 分 40 秒）","t":"先说\"字\"——甲骨文。1899 年，金石学家王懿荣在中药\"龙骨\"上发现了刻痕，认出这是比青铜铭文更古老的文字，甲骨文从此被认识。大家可以想一想，一味治病的药材，里头居然藏着一段失传的历史，这一发现有多偶然。到今天，殷墟出土的有字甲骨约有 15 万片，上面出现的单字约四千多个，目前能确认释读的只是其中一部分。这些字是干什么用的？占卜。商人事事要问鬼神：今年会不会涝、出兵能不能胜、王后什么时候生孩子，都要在龟甲或牛肩胛骨上钻凿、灼烧，看裂纹判断吉凶，再把问的事和结果刻在旁边。所以甲骨文其实是商王朝的\"国家档案\"。2017 年，甲骨文被联合国教科文组织列入\"世界记忆名录\"。大家今天写的每一个汉字，往上追，都能追到这些刀刻的痕迹。再说\"铜\"——青铜器，请大家跟着我的手指往这边看。殷墟出土的青铜器，代表了中国青铜时代的顶峰。最有名的是后母戊鼎，1939 年出土于武官村，重达 832.84 公斤，是我国现存最重的青铜器。铸造这样一件大鼎，需要上千公斤的铜液同时浇注，三千年前的工匠是靠成百上千人协同才完成的。大家可以想象一下那个场面：炉火通红，几百个人围着一座陶范，谁早一步、谁晚一步，这一炉铜就废了。还有一位不能不提的人物——妇好，这一位，我要多讲两句。1976 年，考古队在宫殿区附近发掘了妇好墓，这是殷墟唯一一座保存完整、未被盗掘的商代王室墓葬，出土文物一千九百多件。妇好是商王武丁的王后，也是中国历史上第一位有文字记载的女将军，甲骨文里记着她带兵征伐、最多一次统兵一万三千人。一座墓，把史书、甲骨和实物三方对上了。最后说\"都\"——都城遗址，这一部分最容易被看轻。殷墟分为宫殿宗庙区、王陵区、手工业作坊区和甲骨窖穴。1936 年在小屯村北发掘的 YH127 坑，一个坑里就出土带字甲骨一万七千多片，被称为\"甲骨档案库\"。宫殿区、王陵区、作坊区的布局，让我们看到了一座三千年都城完整的骨架——它不是传说，是挖出来的。站在这里，大家可以闭上眼睛想一想：三千年前走在这条路上的那些人，和我们今天走的，其实是同一条路。"},{"h":"第 5 段 · 结束（约 40 秒）","t":"各位朋友，一片甲骨让商朝从传说变成了信史，一座都城让我们看见了三千年前的城市，一件大鼎让我们看见了当时的手工业有多强。殷墟的意义，不只是出土了多少文物，而是它证明了中华文明有文字可考的历史有多长。讲到这里，我这一趟要说的也差不多了，剩下的时间留给大家自己走、自己看。接下来给大家二十分钟自由参观，请不要越过护栏，我们在殷墟博物馆新馆门口集合。谢谢大家！"}],"kw":["盘庚迁殷","八代十二王","15 万片甲骨","王懿荣 1899","后母戊鼎 832.84 公斤","妇好墓 1976","2006 世界遗产","YH127 坑"],"warn":"甲骨文单字数量各方说法不一（四千多、已释读一千五到两千五），考试时说\"单字四千多个，目前只释读了一部分\"最稳，不要报具体释读字数。","k":"yinxu","core":true},{"name":"三门峡函谷关","city":"三门峡","mind":[{"h":"开场","kids":["问候考官、自我介绍","一道峡谷挡过千军万马","留下一部五千言《道德经》","古道石阶多，注意脚下"]},{"h":"城市概况","kids":["河南最西边，号称西大门","北临黄河、西接陕西","1957 年因三门峡大坝设市","1921 年仰韶村、虢国墓地玉柄铁剑"]},{"h":"函谷关概况","kids":["灵宝市北 15 公里王垛村","深险如函，函就是匣子","一夫当关，万夫莫开","秦代古关与曹操魏关"]},{"h":"核心讲解","kids":["老子李耳字聃，周王室守藏室之史","尹喜见紫气东来，请著五千言","紫气东来、鸡鸣狗盗、白马非马","古道车辙深十几厘米"]},{"h":"结束","kids":["地理决定历史，思想超越地理","三十分钟自由参观","老子著经塑像前集合","注意台阶、保管随身物品"]}],"cards":[{"f":"函谷关位于三门峡哪个县市？具体在哪个村？","b":"灵宝市北边约 15 公里的王垛村。串讲：记住灵宝王垛这四个字，千万不能顺口说到洛阳去。"},{"f":"函谷的函是什么意思？为什么叫函谷关？","b":"函就是匣子；峡谷两边是陡壁，中间一条窄路，人走在里面像装进一只匣子，所以叫函谷关。串讲：名字本身就是一幅地形图。"},{"f":"老子姓什么、名什么、字什么？担任什么官职？","b":"姓李名耳，字聃，是周王室的守藏室之史，相当于国家图书馆馆长。串讲：管典籍的人写出五千言，一点也不意外。"},{"f":"是谁在关前迎候老子、请他著书？","b":"关令尹喜，他远远看见紫气东来，知道有圣人过关，就把老子留下著书。串讲：没有尹喜这一拦，可能就没有《道德经》。"},{"f":"《道德经》共多少言？分为哪两篇？","b":"五千余言，分《道经》《德经》两篇，是中国历史上被翻译成外文最多的典籍之一。串讲：五千字，影响中国两千多年。"},{"f":"三门峡哪一年设市？因何而设？","b":"1957 年，随着万里黄河第一坝三门峡水利枢纽的兴建而设市，是一座因坝而生的城市。串讲：先有坝、后有市，这是三门峡最特别的地方。"},{"f":"仰韶村遗址哪一年发掘？意义是什么？","b":"1921 年渑池仰韶村遗址发掘，让中国现代考古学从这里起步，三门峡因此成为仰韶文化的发现地。串讲：1921 这个年份，是中国考古学的起点。"},{"f":"虢国墓地出土的中华第一剑叫什么？","b":"玉柄铁剑。串讲：一坝、一陶、一剑，是三门峡除了函谷关之外的三张底牌。"},{"f":"历史上这里设过哪两座关？魏函谷关是谁设置的？","b":"一座是秦代的古函谷关，就是今天看的这座；另一座是汉代以后东移的魏函谷关，为曹操西征时设置。串讲：说到关，先分清秦关和魏关。"},{"f":"函关古道上的车辙印有多深？是怎么形成的？","b":"深的能有十几厘米，是两千多年车轮一寸一寸压出来的，不是人工刻的。串讲：这条路上的车辙，比任何碑文都更诚实。"}],"facts":[{"type":"单选","stem":"函谷关位于三门峡市下辖的哪个县市？","options":["渑池县","灵宝市","陕州区","义马市"],"answer":"B","explain":"在灵宝市北边约 15 公里的王垛村；渑池是仰韶村遗址所在地。"},{"type":"单选","stem":"三门峡因三门峡水利枢纽兴建而设市，时间是哪一年？","options":["1921 年","1949 年","1957 年","1986 年"],"answer":"C","explain":"1957 年设市，三门峡水利枢纽被称为万里黄河第一坝。"},{"type":"单选","stem":"渑池仰韶村遗址的发掘是在哪一年？","options":["1899 年","1921 年","1957 年","1976 年"],"answer":"B","explain":"1921 年发掘，中国现代考古学从这里起步。"},{"type":"单选","stem":"老子在周王室担任的职务是什么？","options":["秦国令尹","楚国大夫","周王室守藏室之史","魏国史官"],"answer":"C","explain":"守藏室之史，相当于国家图书馆馆长，管的是王室典籍。"},{"type":"单选","stem":"在函谷关迎候老子并请他著书的关令是谁？","options":["公孙龙","孟尝君","尹喜","王懿荣"],"answer":"C","explain":"关令尹喜望见紫气东来，知道有圣人过关，留下老子请其著书。"},{"type":"单选","stem":"《道德经》大约有多少字？","options":["三千言","五千余言","七千言","一万言"],"answer":"B","explain":"五千余言，分《道经》《德经》两篇。"},{"type":"单选","stem":"魏函谷关是下列哪一位人物西征时设置的？","options":["秦始皇","汉武帝","曹操","孟尝君"],"answer":"C","explain":"汉代以后东移的魏函谷关，是曹操西征时设置的。"},{"type":"单选","stem":"白马非马这一辩论的提出者是？","options":["老子","公孙龙","尹喜","孟尝君"],"answer":"B","explain":"名家公孙龙过关时以白马非马的一番辩论免了关税。"},{"type":"单选","stem":"鸡鸣狗盗典故中，被扣在秦国、靠门客逃出关的是谁？","options":["孟尝君","公孙龙","尹喜","曹操"],"answer":"A","explain":"孟尝君靠门客一个学鸡叫、一个装狗偷出狐白裘，才得以出关。"},{"type":"判断","stem":"函谷关位于三门峡灵宝市，是秦代的古函谷关所在地。","options":["正确","错误"],"answer":"A","explain":"今天看的是秦代古函谷关；汉代以后东移的那座叫魏函谷关。"},{"type":"判断","stem":"紫气东来说的是尹喜望见紫气，知道有圣人过关，于是迎候老子。","options":["正确","错误"],"answer":"A","explain":"这个典故后来成了吉祥话，过年贴的春联上常见。"},{"type":"判断","stem":"函关古道上深深的车辙印，是后人为了景观效果人工雕刻的。","options":["正确","错误"],"answer":"B","explain":"车辙是两千多年车轮一寸一寸压出来的自然痕迹，不是人工刻的。"},{"type":"填空","stem":"函谷关在灵宝市北边约____公里的王垛村。","answer":"15","explain":"灵宝市北边约 15 公里的王垛村，是我国古代最著名的关隘之一。"},{"type":"填空","stem":"老子姓李名耳，字____。","answer":"聃","explain":"姓李名耳，字聃，周王室守藏室之史。"},{"type":"填空","stem":"《道德经》分为《道经》和《____》两篇。","answer":"德经","explain":"五千余言分《道经》《德经》两篇，是道家文化的核心经典。"},{"type":"填空","stem":"景区里后人纪念老子著经的地方叫____。","answer":"太初宫","explain":"太初宫是后人纪念老子著经的地方，也是函谷关作为道家文化祖庭之一的凭据。"}],"secs":[{"h":"第 1 段 · 开场（约 40 秒）","t":"各位游客朋友，大家好！欢迎来到三门峡函谷关。我是讲解员小×。今天我们要看的这座关，只有短短一道峡谷，却挡过千军万马，也留下了一部五千言的《道德经》。大家往两边看，一边是塬，一边是谷，风从谷口灌进来，脚底下这条道，就是当年车马走的路。请大家跟好队伍，古道石阶比较多，注意脚下，走慢一点不要紧。今天这一趟路不长，故事不少，大家慢慢听。"},{"h":"第 2 段 · 城市概况（约 1 分 20 秒）","t":"从景区门口到关楼还有一段路，我先把三门峡交代几句。它在河南最西边，是河南的\"西大门\"，北边是黄河，西边接陕西，自古就是中原通往关中、西域的咽喉。大家可以想一想，从前的商队、使节、军队要打这儿过，得先看天、再看路、最后看关上的人放不放行。1957 年，随着万里黄河第一坝——三门峡水利枢纽的兴建，这里设市，所以它是一座\"因坝而生\"的城市。三门峡还有两个响亮的名号：一个是仰韶文化的发现地，1921 年渑池仰韶村遗址的发掘，让中国现代考古学从这里起步；另一个是虢国墓地，出土过\"中华第一剑\"玉柄铁剑。一坝、一陶、一剑，再加上我们脚下这座关，三门峡的底气，就都在这儿了。"},{"h":"第 3 段 · 函谷关概况（约 1 分 40 秒）","t":"现在说函谷关。大家顺着我手指的方向看，前面那道两边夹壁的口子，就是我们要进的关。它在灵宝市北边约 15 公里的王垛村，是我国古代最著名的关隘之一。为什么叫\"函谷\"？因为这道峡谷深险如函——\"函\"就是匣子，两边是陡壁，中间一条窄路，人走在里面像装进一只匣子，所以叫函谷关。它的军事地位，用一句话说就是\"一夫当关，万夫莫开\"。大家可以试着想一想：一个人守在这道口子上，一万人马挤在谷里施展不开，那是什么局面。这里是关中与中原之间的门户：东边来的人要进关中，必须走这里；关中要东出，也必须走这里。战国时秦国凭它挡住六国，楚汉相争时它又是必争之地。历史上这里曾设过两座关：一座是秦代的古函谷关，就是我们今天看的这座；另一座是汉代以后东移的魏函谷关，是曹操西征时设的。这两座关大家容易混，记住一句就好：脚下这座是秦关，东边那座是魏关。等会儿走到关楼底下，大家可以抬头看看那道门洞，人从下面过，会觉得自己很渺小。"},{"h":"第 4 段 · 核心讲解（约 4 分 20 秒）","t":"先说老子和《道德经》，这是函谷关真正的魂。老子姓李名耳，字聃，是周王室的守藏室之史，相当于国家图书馆馆长，管的是王室的典籍。大家可以想一想，一个天天跟典籍打交道的人，心里得装多少东西，才写得出五千言。后来他见周室衰微，便骑青牛西去。走到函谷关时，关令尹喜远远看见紫气东来，知道有圣人过关，就把他留下来，请他著书。老子于是写下了五千余言，分《道经》《德经》两篇，这就是《道德经》。写完出关，从此不知所终。一个人，一部书，就在关前写下来，转身便走，这件事本身就很传奇。这五千字影响有多大？它是中国历史上被翻译成外文最多的典籍之一，全世界几十种语言都有译本。\"道可道，非常道\"\"上善若水\"\"治大国若烹小鲜\"，这些话到今天还在用。所以这座关不只是一座军事要塞，它还是道家文化的祖庭之一，景区里的太初宫，就是后人纪念老子著经的地方，等会儿我们会在太初宫前面停下来，我再指给大家看。再说几个和这座关有关的典故，我一个一个讲给大家听。第一个是\"紫气东来\"，说的就是尹喜望气迎老子，后来这四个字成了吉祥话，过年贴的春联上常见。第二个是\"鸡鸣狗盗\"，战国时孟尝君被扣在秦国，靠门客一个学鸡叫、一个装狗偷出狐白裘，才得以出关逃回，故事就发生在这里。第三个是\"白马非马\"，名家公孙龙过关时，靠\"白马非马\"的一番辩论，硬是把白马说成不是马，免了关稅。大家可以想一想，一道关口，怎么就逼出这么多聪明人。一座关，能留下这么多成语，说明它当时有多重要——所有东来西往的人、货、思想，都要从这里过。最后看古道，请大家低头看看脚下。这条函关古道，是古代连接两京的官道，秦汉唐宋的车马都从这里碾过。路面上的车辙印至今还在，深的能有十几厘米。这不是人工刻的，是两千多年车轮一寸一寸压出来的。大家有空可以伸手比一比那两道凹槽的深浅，摸到的不是石头，是时间。"},{"h":"第 5 段 · 结束（约 40 秒）","t":"各位朋友，一道峡谷，守住了关中的门户；一部五千言，影响了中国两千多年。函谷关让我们看到，地理可以决定历史，思想却能超越地理。我们这一路走过来，看的是关，说的是人。咱们今天走过的这一段路并不长，可脚下踩的，是两千多年。接下来是自由参观时间，三十分钟后在老子著经塑像前集合，大家可以先去太初宫那边走走，也可以回到古道上站一站。请大家注意台阶、保管好随身物品。谢谢大家！"}],"kw":["灵宝王垛村","深险如函","一夫当关","尹喜·紫气东来","五千言","鸡鸣狗盗","白马非马","太初宫"],"warn":"函谷关在三门峡灵宝，不在洛阳；老子是\"西出函谷关\"著书，不是\"入关\"。另外\"白马非马\"是公孙龙的名家辩论，别安到老子或孔子头上。","k":"hangu","core":true},{"name":"红旗渠","city":"安阳","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是红旗渠。各位朋友，大家好，欢迎来到安阳林州。今天我们要看的这条渠，不在平地上，它是从太行山的悬崖峭壁上凿出来的。一会儿上山，路窄、台阶多，请大家跟紧队伍，不要为了拍照往崖边挤，安全第一。现在请随我往上走，去看看那条挂在半山腰上的水。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说说安阳。安阳在河南的最北边，往西就是太行山。很多朋友对安阳的印象是甲骨文、是殷墟，其实安阳还有另一面：太行山把最硬的一段山体留在了这里，也把最缺水的日子留给了山里的林州。林州过去叫林县，现在是安阳市代管的县级市，地处太行山东麓。从安阳市区往林州走，一路向西，山越来越高，路越来越窄，地越来越少，石头越来越多。就是在这种地方，上世纪六十年代，林县人干成了一件让全国都记住的事，这件事，就是我们今天要看的红旗渠。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"红旗渠是一条引水渠，水是从山西的浊漳河引过来的。渠首在山西，得跨省协调，渠线又长，一路都得跟大山争地方。1960年2月开工，到1969年7月，支渠配套工程全部建成。总干渠全长70.6公里；如果把干渠、支渠、斗渠都算上，大约1500公里。为了这条渠，人们削平了1250座山头，架设了151座渡槽，开凿了211个隧洞。这些数字摊开来看，最险的一段叫青年洞，全长616米，整段挂在悬崖上，底下就是深谷。当年全县大约十万人上了工地，后来人们叫他们十万开山者。县委书记杨贵是主要决策者，技术员吴祖太把命留在了工地上。这条渠后来被称为人工天河，也被称为新中国两大奇迹之一。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"先说为什么要修。林州老辈人有句话，叫十年九旱、水贵如油。这里是石头山，土层薄，雨落下来存不住，顺着坡就流走了。有人问，为什么不打井？山是石头山，打下去还是石头，打不出水来。旱起来是什么景象？地裂口子，庄稼从根上枯，一季没收成，一年就空了；山下的河断流，山上的泉见底，人吃水要翻几道梁去挑，一瓢水洗完脸再洗菜，最后还要喂牲口。历史上这里不止一次旱灾绝收，人往外逃荒。所以林州人不是不知道修渠苦，是算过账：不修，年年苦；修，苦一阵子。这笔账，县里算过，老百姓也算过。唯一的出路，是把山那边山西的水引过来。1960年2月，渠开工了。引水口在山西，从浊漳河把水引出来，再沿着太行山的山腰一路往东送。这个决心是县委书记杨贵下的，方向一定，全县就动了起来。当时全县大约十万人上山，后来人们叫他们十万开山者。没有机械，就靠锤、钎、筐、绳；没有房子住，就住山洞、睡石崖底下；粮食不够，就掺着野菜吃。工地上分段包干，一段一段往前推，谁的段谁负责。工地上不分干部和群众，吃一口锅里的饭，睡一样的工棚。水一出山，就得贴着崖壁走，遇到沟架渡槽，遇到山凿隧洞。今天我们在渠边看到的那一层层石砌的渠墙，就是这些人一块一块垒起来的，垒得齐，也垒得结实。最险的一段是青年洞，全长616米。这段渠叫这个名字，是因为当年在这里突击施工的主力是青年人。它挂在悬崖上，人得腰里系绳，从山顶吊下去，脚蹬着崖壁，在半空中抡锤打钎。打一个炮眼要换几根钎子，一天下来，手上全是血口子。洞里放炮，烟散不出去，人进去呛得睁不开眼，只能轮着班干。整个工程算下来，削平1250座山头，架设151座渡槽，开凿211个隧洞，这些数字背后，是一个个具体的人。技术员吴祖太负责勘测设计，把命留在了工地上，牺牲的时候还很年轻。所以我说，红旗渠不是没有代价的，这条渠是拿人的力气、拿人的命换来的，不是画在纸上的。1969年7月，支渠配套工程全部建成。总干渠70.6公里，干支斗渠加起来大约1500公里，水从山西一路进了林州的地。这条渠不是一段，是一张网，主干送到县里，支渠斗渠送到地头。有了水，坡地能浇，庄稼能种，人不用再翻山挑水，过去要走半天去驮水的村子，门口就能舀到水。这条渠后来被叫做人工天河，也被称为新中国两大奇迹之一。可我更愿意讲那十六个字：自力更生、艰苦创业、团结协作、无私奉献。这不是写在墙上的口号。自力更生，是没有工具自己造；艰苦创业，是啃着野菜也往前推；团结协作，是上游下游、各村各队一起上；无私奉献，是像吴祖太那样把命交出去。四句话，是十万人在悬崖上一天一天干出来的。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，我们今天就走到这里。大家回头再看一眼那面崖壁，上面还留着当年抡锤打钎的痕迹。红旗渠不是一处普通的风景，它是一笔账：十万人的力气，换来山里的一渠水。希望大家带走的不只是照片，还有那十六个字。下山的路大家慢一点，注意脚下。祝各位一路平安，欢迎再来安阳，再来红旗渠！"}],"kw":["人工天河","太行山东麓","浊漳河引水","总干渠70.6公里","青年洞616米","十万开山者","杨贵","吴祖太","十年九旱水贵如油","自力更生艰苦创业"],"warn":"易错提醒：开工是1960年2月、建成是1969年7月，别说成“修了十年”；616米是青年洞长度，70.6公里才是总干渠，别串。","mind":[{"h":"开场","kids":["问候考官","自我介绍（×号考生）","山路安全提醒"]},{"h":"城市概况","kids":["安阳在河南最北、太行山东麓","林州原称林县","向西进山，越走越缺水"]},{"h":"景点概况","kids":["山西浊漳河引水","1960年2月开工、1969年7月建成","70.6公里与约1500公里","青年洞616米"]},{"h":"核心讲解","kids":["十年九旱、水贵如油","杨贵决策、十万开山者上山","青年洞与吴祖太","精神十六个字落地讲"]},{"h":"欢送","kids":["回望崖壁锤痕","带走十六个字","下山安全与祝福"]}],"cards":[{"f":"红旗渠在哪个省、哪个市？","b":"河南省安阳市林州市（原林县），地处太行山东麓。串讲：所以开场我就说，这是太行山里的一条渠。"},{"f":"红旗渠的水从哪里引来？","b":"从山西的浊漳河引水。串讲：跨省引水，才有“引漳入林”这个说法。"},{"f":"总干渠多长？干支斗渠合计多长？","b":"总干渠70.6公里，干渠、支渠、斗渠合计约1500公里。串讲：一条主干加一张水网，水才送得到地里。"},{"f":"红旗渠何时开工、何时建成？","b":"1960年2月开工，1969年7月支渠配套工程全部建成。串讲：这是跨了好几个年头的工程，不是一年半载。"},{"f":"削平多少座山头、架多少座渡槽、开多少个隧洞？","b":"削平1250座山头，架设151座渡槽，开凿211个隧洞。串讲：三个数字连起来，就是悬崖上的工程量。"},{"f":"最险要的工程段是哪里？多长？","b":"青年洞，全长616米。串讲：讲青年洞一定要讲“吊在悬崖上打钎”。"},{"f":"修建时全县大约多少人参与？","b":"约十万人，后来被称作“十万开山者”。串讲：数字背后是人力和人力气，不是机械。"},{"f":"主要决策者是谁？牺牲的技术员是谁？","b":"县委书记杨贵是主要决策者，技术员吴祖太牺牲在工地上。串讲：讲人比喊口号更打动人。"},{"f":"红旗渠被称为什么？","b":"被称为“人工天河”，也被称为“新中国两大奇迹之一”。串讲：这两个称号是硬考点，必须点出来。"},{"f":"红旗渠精神是哪十六个字？","b":"自力更生、艰苦创业、团结协作、无私奉献。串讲：四句一口气说完，别漏字、别改字。"}],"facts":[{"type":"单选","stem":"红旗渠位于河南省的哪个地级市？","options":["新乡市","焦作市","安阳市","鹤壁市"],"answer":"C","explain":"红旗渠在安阳市林州市（原林县），地处太行山东麓。"},{"type":"单选","stem":"红旗渠的水引自哪条河？","options":["浊漳河","清漳河","沁河","淇河"],"answer":"A","explain":"渠首在山西，从浊漳河引水，属于跨省引水。"},{"type":"单选","stem":"红旗渠总干渠全长约多少公里？","options":["60.6公里","70.6公里","80.6公里","1500公里"],"answer":"B","explain":"1500公里是干渠、支渠、斗渠的合计长度。"},{"type":"单选","stem":"被称为红旗渠最险要工程段的青年洞，全长多少米？","options":["516米","606米","616米","716米"],"answer":"C","explain":"青年洞全长616米，整段挂在悬崖上。"},{"type":"单选","stem":"红旗渠的开工时间是？","options":["1958年2月","1960年2月","1962年12月","1965年7月"],"answer":"B","explain":"1960年2月开工，1969年7月支渠配套工程全部建成。"},{"type":"单选","stem":"红旗渠支渠配套工程全部建成的时间是？","options":["1965年7月","1966年7月","1968年7月","1969年7月"],"answer":"D","explain":"建成时间按支渠配套工程全部建成计，为1969年7月。"},{"type":"单选","stem":"修建红旗渠共削平多少座山头？","options":["1050座","1150座","1200座","1250座"],"answer":"D","explain":"削平1250座山头，与151座渡槽、211个隧洞一起记忆。"},{"type":"单选","stem":"修建红旗渠共架设渡槽多少座？","options":["151座","211座","616座","1250座"],"answer":"A","explain":"渡槽151座，211是隧洞数量，616是青年洞长度。"},{"type":"单选","stem":"修建红旗渠共开凿隧洞多少个？","options":["151个","211个","616个","1250个"],"answer":"B","explain":"隧洞211个，容易与渡槽151座混淆。"},{"type":"判断","stem":"红旗渠位于安阳林州市，从山西浊漳河引水。","options":["正确","错误"],"answer":"A","explain":"位置与水源都正确，可连起来作为一句话记忆。"},{"type":"判断","stem":"红旗渠1960年2月开工，1969年7月支渠配套工程全部建成。","options":["正确","错误"],"answer":"A","explain":"一开工一建成，两个时间点要成对记。"},{"type":"判断","stem":"青年洞全长151米，是红旗渠最险要的工程段。","options":["正确","错误"],"answer":"B","explain":"青年洞全长616米，151是渡槽的数量。"},{"type":"填空","stem":"红旗渠干渠、支渠、斗渠合计约____公里。","options":[],"answer":"1500","explain":"总干渠70.6公里，干支斗渠合计约1500公里。"},{"type":"填空","stem":"红旗渠被群众称为“____”，也被称为“新中国两大奇迹之一”。","options":[],"answer":"人工天河","explain":"“人工天河”是红旗渠最常考的美称。"},{"type":"填空","stem":"主持修建红旗渠的县委书记是____。","options":[],"answer":"杨贵","explain":"杨贵是主要决策者，可与技术员吴祖太成对记。"},{"type":"填空","stem":"在红旗渠工地牺牲的技术员是____。","options":[],"answer":"吴祖太","explain":"吴祖太负责勘测设计，牺牲在工地上。"}],"k":"hongqiqu","core":false},{"name":"焦裕禄纪念园","city":"开封","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是焦裕禄纪念园。各位朋友，大家好，欢迎来到开封兰考。今天这个地方，和一般的景点不太一样，它没有奇山异水，讲的是一个干部和一片土地的故事。进园以后，请把手机调成静音，说话轻一点，因为这里安葬着焦裕禄同志。现在请随我往前走。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说兰考。兰考在开封的东边，是黄河故道经过的地方。黄河在这里反复改道，走了以后留下三样东西：沙丘、洼地、盐碱。风一起，沙子打脸，庄稼苗刚出来就被埋；雨一大，水排不出去，地里泡着；天一旱，地表泛白，碱把苗烧死。老百姓把这三样叫三害，这三害是一根绳上的三个扣，得一块儿解。当地人形容那时候的饭，说一碗饭里半碗沙。从开封市区往东走，一路看着是平地，其实地力薄，收成没保证。1962年12月，焦裕禄到兰考任县委书记，接的就是这个摊子。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"焦裕禄纪念园在兰考县城里，由几部分组成：焦裕禄烈士墓、焦裕禄同志纪念馆，还有焦桐和焦林。纪念馆里陈列着他当年用过的东西，其中有一把藤椅，右边被顶穿了一个窟窿——肝疼得厉害的时候，他就拿硬东西顶住，时间长了，藤椅就顶穿了。馆里还有他写过的东西、用过的农具，一件件都不值钱，可放在一起，就能看出一个人的日子是怎么过的。墓前常年摆着各地来的人献的花。焦桐，是他亲手种下的那棵泡桐，如今长得很高，树干很粗，一个人抱不过来，树冠撑开一大片阴凉。焦林，是当年推广种泡桐留下的林子。一个墓、一个馆、一棵树、一片林，把一个人和一块土地的关系说清楚了。纪念园是后人建的，为的是让来的人有地方站一站、想一想。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"先说他是怎么摸情况的。1962年12月，焦裕禄到兰考。那时候兰考的三害是内涝、风沙、盐碱。他没有坐在办公室里听汇报，而是带着人往下跑：风最大的时候，他去看流沙往哪儿走；雨最大的时候，他去看水往哪儿积；哪个村的地泛碱最厉害，他就到哪个村蹲下来看，一个村一个村地跑，一户一户地问。他在兰考一共工作了470多天，这470多天，大半是在路上、在地里。摸清底数这件事听着不热闹，可没有这一步，后面所有的办法都是空的。他心里装的不是一份报告，是这块地到底怎么回事。他下乡带着干粮，走到哪儿住到哪儿。他常说，吃别人嚼过的馍没味道，情况得自己去看。情况摸清了，办法就出来了，主要是四条：翻淤压沙、翻淤压碱、育草封沙、广植泡桐。翻淤压沙，是把底下的黏土翻上来盖住流沙；翻淤压碱，是同样的道理，用淤土压住往上泛的碱；育草封沙，是先让草把沙固定住，不让它到处跑；广植泡桐，是种树挡风。草先活了，沙就不动了，再种树才站得住。这四条听着朴素，可都是从地里长出来的办法，不是从文件里抄的，是蹲在地头跟老农一句一句聊出来的。他要求干部蹲点，一个村一个村地试，试成了再推开。谁摸清了哪个村的情况，就让谁来讲，讲不清就再去跑。先试验、再推广，这种路子后来被概括成四个字：科学求实。纪念园里最动人的，是那棵焦桐。它是焦裕禄亲手种下的一棵泡桐。为什么种泡桐？泡桐长得快，根扎得深，能挡风，能固沙，成材还能用，在兰考这种地上，它是能活的树。风把上面的沙吹走了，它的根还把土抓住。焦裕禄种下的这一棵，兰考人给它起了名字，就叫焦桐。今天这棵树长得很高很粗，树冠撑开，夏天底下能站不少人。焦桐底下，常有人站着不说话，这棵树成了一个记号。树有树的时间，人有人的时间。树还在长，人已经走了。兰考人守着这棵树，守的是一个念想：这个人来过，而且真的干了事。后来泡桐成了兰考的产业，做乐器、做板材，这是当年种树时想不到的。最后说他的病。焦裕禄的肝病越来越重，疼得厉害的时候，他就用硬东西顶住肝部，办公室那把藤椅的右边，被顶穿了一个窟窿。1964年5月14日，他因肝癌病逝，年仅42岁。他在兰考只干了470多天。470多天能干什么？他把三害的底数摸清了，把治理的办法试出来了，把树种下了，把干部的心聚起来了。后来兰考的三害被治住，地能种了，日子慢慢好起来。他的精神被概括为二十个字：亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献。这二十个字不是追认出来的评语，是他470多天里做出来的事。1990年，习近平同志写下《念奴娇·追思焦裕禄》，词里说“百姓谁不爱好官？把泪焦桐成雨”，又说“生也沙丘，死也沙丘”。这两句，兰考人听得懂。"},{"h":"第5段 · 欢送结束（约40秒）","t":"各位朋友，参观到这里就结束了。走出园子的时候，大家可以回头看一眼那棵焦桐。它还在长，兰考也早就不是当年那个兰考了。焦裕禄在兰考只干了470多天，可他留下的东西一直在长：那套摸实情、想办法的路子，那二十个字，还有这棵树。谢谢大家听我讲完，祝各位一路顺利，欢迎再来兰考。"}],"kw":["开封兰考","内涝风沙盐碱","1962年12月到任","470多天","翻淤压沙","育草封沙","广植泡桐","焦桐","病逝时年仅42岁","念奴娇追思焦裕禄"],"warn":"易错提醒：焦裕禄1962年12月到兰考、1964年5月14日病逝，在兰考470多天，不是几年；精神是二十个字，别背成十六个；焦桐是一棵树。","mind":[{"h":"开场","kids":["问候考官","自我介绍（×号考生）","纪念园礼仪提醒"]},{"h":"城市概况","kids":["兰考在开封东边、黄河故道","三害：内涝、风沙、盐碱","1962年12月到任"]},{"h":"景点概况","kids":["烈士墓","纪念馆（藤椅上的窟窿）","焦桐与焦林"]},{"h":"核心讲解","kids":["往下跑、摸清底数","四条治理办法","焦桐为什么是泡桐","病逝与二十个字"]},{"h":"欢送","kids":["回望焦桐","470多天留下的东西","致谢与祝福"]}],"cards":[{"f":"焦裕禄纪念园在哪个市、哪个县？","b":"河南省开封市兰考县。串讲：兰考在开封东边，是黄河故道经过的地方。"},{"f":"焦裕禄何时到兰考任职？","b":"1962年12月任兰考县委书记。串讲：到1964年5月病逝，前后470多天。"},{"f":"焦裕禄何时病逝？多大年龄？","b":"1964年5月14日因肝癌病逝，年仅42岁。串讲：讲到这里语速要慢下来，不要一带而过。"},{"f":"他在兰考工作了多久？","b":"470多天。串讲：时间不长，但摸清了三害、试出了办法。"},{"f":"兰考当时的“三害”是什么？","b":"内涝、风沙、盐碱。串讲：三害是整场讲解的背景，必须先交代清楚。"},{"f":"治理“三害”的主要办法有哪几条？","b":"翻淤压沙、翻淤压碱、育草封沙、广植泡桐。串讲：四条办法对着三害讲，一条一条落地。"},{"f":"“焦桐”指的是什么？","b":"焦裕禄亲手种下的那棵泡桐。串讲：是一棵树，不是整片林，别和“焦林”混。"},{"f":"纪念园由哪几部分组成？","b":"焦裕禄烈士墓、焦裕禄同志纪念馆、焦桐、焦林。串讲：一墓一馆一树一林。"},{"f":"焦裕禄精神是哪二十个字？","b":"亲民爱民、艰苦奋斗、科学求实、迎难而上、无私奉献。串讲：是二十个字，不能说成十六个字。"},{"f":"习近平哪一年写了什么作品追思焦裕禄？","b":"1990年作《念奴娇·追思焦裕禄》。串讲：词牌名和题目都要说全，别只说“念奴娇”。"}],"facts":[{"type":"单选","stem":"焦裕禄纪念园位于河南省的哪个地级市？","options":["商丘市","周口市","开封市","新乡市"],"answer":"C","explain":"纪念园在开封市兰考县。"},{"type":"单选","stem":"焦裕禄到兰考任县委书记的时间是？","options":["1962年2月","1962年12月","1963年12月","1964年5月"],"answer":"B","explain":"1962年12月到任，1964年5月14日病逝。"},{"type":"单选","stem":"焦裕禄病逝的日期是？","options":["1963年5月14日","1964年5月4日","1964年5月14日","1965年5月14日"],"answer":"C","explain":"1964年5月14日因肝癌病逝。"},{"type":"单选","stem":"焦裕禄病逝时年仅多少岁？","options":["38岁","40岁","42岁","45岁"],"answer":"C","explain":"焦裕禄病逝时年仅42岁。"},{"type":"单选","stem":"焦裕禄在兰考工作了多少天？","options":["270多天","370多天","470多天","570多天"],"answer":"C","explain":"在兰考工作470多天，是常考数字。"},{"type":"单选","stem":"下列不属于兰考当时“三害”的是？","options":["内涝","风沙","盐碱","蝗灾"],"answer":"D","explain":"三害是内涝、风沙、盐碱。"},{"type":"单选","stem":"下列不属于焦裕禄治理“三害”办法的是？","options":["翻淤压沙","翻淤压碱","育草封沙","围湖造田"],"answer":"D","explain":"四条办法是翻淤压沙、翻淤压碱、育草封沙、广植泡桐。"},{"type":"单选","stem":"焦裕禄亲手种下的那棵泡桐，被兰考人称为？","options":["兰考桐","焦桐","裕禄桐","追思桐"],"answer":"B","explain":"这棵泡桐被称为“焦桐”，是一棵树。"},{"type":"单选","stem":"1990年习近平同志追思焦裕禄的作品是？","options":["《念奴娇·追思焦裕禄》","《水调歌头·追思焦裕禄》","《沁园春·焦裕禄》","《满江红·焦桐》"],"answer":"A","explain":"1990年作《念奴娇·追思焦裕禄》。"},{"type":"判断","stem":"焦裕禄1962年12月到兰考任县委书记，1964年5月14日因肝癌病逝。","options":["正确","错误"],"answer":"A","explain":"到任与病逝两个时间点要成对记。"},{"type":"判断","stem":"焦裕禄在兰考工作了470多天，后来因工作需要调离兰考。","options":["正确","错误"],"answer":"B","explain":"他没有调离，是病逝在岗位上。"},{"type":"判断","stem":"兰考当时的“三害”是内涝、风沙、盐碱。","options":["正确","错误"],"answer":"A","explain":"三害是全场讲解的背景，必须记准。"},{"type":"填空","stem":"焦裕禄在兰考工作了____多天。","options":[],"answer":"470","explain":"470多天，短时间做出大事情。"},{"type":"填空","stem":"焦裕禄亲手种下的那棵泡桐，兰考人称之为“____”。","options":[],"answer":"焦桐","explain":"焦桐是一棵树，焦林是一片林。"},{"type":"填空","stem":"兰考治理“三害”的办法包括翻淤压沙、翻淤压碱、育草封沙和广植____。","options":[],"answer":"泡桐","explain":"广植泡桐既挡风又固沙，后来成了当地产业。"},{"type":"填空","stem":"1990年，习近平同志作《____·追思焦裕禄》。","options":[],"answer":"念奴娇","explain":"词牌是念奴娇，题目是追思焦裕禄。"}],"k":"jiaoyulu","core":false},{"name":"王屋山","city":"济源","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是王屋山。各位朋友，一路辛苦了，前面就是王屋山景区。请大家带好随身物品，跟紧队伍。山上石阶比较多，记住一句话：走路不观景，观景不走路。今天由我陪大家一起上山，慢慢走，慢慢看，把这座山的故事一件一件讲给大家听。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先说说我们脚下的这座城市。济源在河南西北部，太行山的南端，是一座因济水发源而得名的城市。这里山多、泉多、故事也多。太行山走到这里收了尾，把最雄的一段留给了王屋山；济水从这里出发，一路向东。所以当地人常说，济源是山之源、水之源，也是愚公精神的源头。这座城市的节奏不快，街边下棋的老人爱讲古，讲来讲去，总绕不开两样东西——王屋山和愚公。等会儿进了山，大家就会明白，这两个名字为什么能拴住一座城的记忆。一座城和一座山处久了，气质是会互相染的。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"王屋山在济源西部，是太行山南端的一座名山。它在道教中的地位极高，被列为道教“十大洞天”之首，称为“天下第一洞天”。主峰天坛山，海拔一千七百一十五米，相传轩辕黄帝曾在这里设坛祭天，天坛之名就是这么来的。山中的阳台宫，是唐代创建的道教宫观，现存主体建筑为明清时期所建。大家熟悉的愚公移山，出自《列子·汤问》，故事发生地就在王屋山。二〇〇六年，王屋山与黛眉山一起成为世界地质公园。至于山名的来历，一说“山形如王者车盖”，一说“王者所居”，两种说法都指向同一个意思：这座山，气象不凡。今天我们的路线，是先看阳台宫，再上天坛顶，从人间烟火一步步走到云上。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"先说第一点，天下第一洞天。道教把天下名山分为十大洞天、三十六小洞天、七十二福地，王屋山稳坐十大洞天之首，这个位次一千多年没有动摇过。为什么是它？大家抬头看，山势一层一层往上叠，像一座座天然的坛台，古人认为这样的地形离天最近，最适合通神。唐代高道司马承祯曾在此修行，把王屋山写进了道教的洞天体系；李白、白居易、韩愈也都来过，留下诗篇。所以王屋山不只是一座山，它是中国道教的一处祖庭，是无数人心中“离天最近”的地方。待会儿上山，大家可以留意山形，看看是不是像一座天然的大祭坛。山是静的，云是动的，一静一动之间，人就明白了古人为什么把这里叫作洞天。第二点，主峰天坛山。天坛山海拔一千七百一十五米，是王屋山的主峰，也是整座山的精神高点。相传轩辕黄帝统一各部之后，曾在这里设坛祭天，告慰天地，天坛之名由此而来。大家可能想问，黄帝为什么选这儿？因为古人祭天讲究高山之巅、洁净之处，王屋山南临黄河、北依太行，站上峰顶视野开阔，正是通天的地方。天气好的时候，从坛顶望出去，黄河像一条带子从山脚绕过。一座坛，把神话和历史接在了一起，也让王屋山在中华文明的记忆里，有了一个别人替代不了的位置。所以天坛山不只是一个山头，它是“敬天法祖”这四个字的一块实物注脚，也是每一个登临者心里的一个坐标。第三点，阳台宫。阳台宫是王屋山现存最重要的一组道教宫观，唐代创建，现存主体建筑是明清时期留下来的。宫里最值得看的是石柱，柱身上雕着盘龙、祥云和人物故事，一刀一刀全是手工凿出来的，看一次就明白什么叫“石头上的画”。院里还有千年古柏，树干要几个人才能合抱，枝干拧着劲儿往上长，当地人叫它“龙爪柏”。唐代玉真公主曾在这里修道，所以阳台宫在道教史上地位不低。提醒大家，进殿参观请放轻脚步，不要触摸石柱和碑刻，这些都是几百上千年的老物件。进院以后先看石柱，再看古柏，最后看碑刻，三样看完，这座宫观的分量就掂出来了，也知道了什么叫“慢工出细活”。第四点，愚公移山。这个故事出自《列子·汤问》，发生地就在王屋山。说的是年近九十的愚公，家门口被太行、王屋两座大山挡着，出门要绕很远的路，于是他带着子孙一筐一筐地挖山。智叟笑他傻，他回答：我死了有儿子，儿子死了有孙子，子子孙孙没有穷尽，可山不会再长高，挖一点就少一点。最后天帝被他的诚意打动，派大力神把两座山搬走了。这个故事讲的不是蛮干，而是一种认准了就不回头的韧劲。后来有人引用这个典故，“愚公移山”就成了一个民族的精神符号。今天大家脚下的每一级台阶，其实都是这种精神的延续。一个人和一架山的关系，说到底就是一个民族面对困难时最朴素的态度：不怨天，不认输，一代接着一代干。"},{"h":"第5段 · 欢送结束（约40秒）","t":"好了，各位朋友，今天的王屋山之行就到这里。回头再看一眼天坛顶，那座坛还在云里；想一想愚公，那把锄头还在我们心里。希望大家带走的不只是照片，还有那股认准了就不回头的劲儿。大巴车已经在停车场等候，请大家清点好随身物品，有序上车。也欢迎大家下次再来，换个季节，看看王屋山的另一副面孔。祝大家一路平安，万事顺遂，谢谢！"}],"kw":["天下第一洞天","天坛山","黄帝设坛祭天","阳台宫","愚公移山","列子·汤问","世界地质公园","王者车盖","济源"],"warn":"别把“天下第一洞天”说成“天下第一福地”，也别把愚公移山的出处说成《山海经》；天坛山海拔1715米，不是1517米，数字说错最容易被扣分。","mind":[{"h":"开场","kids":["问候考官并报号","自我介绍","说明行程与集合时间","安全与文明提示"]},{"h":"城市概况","kids":["济源在河南西北部","太行山南端","因济水发源得名","愚公故里的城市气质"]},{"h":"景点概况","kids":["天下第一洞天","天坛山海拔1715米","阳台宫唐建明清存","愚公移山与地质公园"]},{"h":"核心讲解","kids":["十大洞天与洞天体系","黄帝设坛祭天","阳台宫石柱与古柏","愚公移山的精神内核"]},{"h":"欢送结束","kids":["回顾今日看点","升华愚公精神","清点随身物品","致谢与祝福"]}],"cards":[{"f":"王屋山在哪座城市？属于哪条山脉？","b":"河南省济源市，太行山南端。记住“济源—太行南端”这一组定位，就不会和焦作的云台山弄混。"},{"f":"王屋山在道教中有什么称号？","b":"道教“十大洞天”之首，称“天下第一洞天”。这是王屋山最硬的一块招牌，开口先说它。"},{"f":"王屋山主峰叫什么？海拔多少？","b":"天坛山，海拔1715米。数字只记一个1715，别和1517混。"},{"f":"天坛山的“天坛”二字怎么来的？","b":"相传轩辕黄帝在此设坛祭天，故名天坛。山名、传说、人物三者要连起来讲。"},{"f":"阳台宫什么年代创建？现存建筑是什么年代？","b":"唐代创建，现存主体为明清建筑。两个朝代都要说，只说唐代会丢一半分。"},{"f":"“愚公移山”出自哪部典籍？","b":"《列子·汤问》，故事发生地即王屋山。答题时把书名和发生地一起说，才完整。"},{"f":"王屋山哪一年成为世界地质公园？与谁一起？","b":"2006年，与黛眉山一起，合称王屋山—黛眉山世界地质公园。"},{"f":"王屋山的山名有哪两种解释？","b":"一说“山形如王者车盖”，一说“王者所居”。两种说法都落在“王者气象”上。"},{"f":"带团上王屋山，安全提示怎么说？","b":"石阶多，提醒“走路不观景、观景不走路”，并交代集合时间与地点，这是面试里的加分细节。"},{"f":"王屋山讲解最容易错的一个点是什么？","b":"把“洞天”说成“福地”。洞天指山中的仙境洞府，福地是另一套体系，两者不能混用。"}],"facts":[{"type":"单选","stem":"王屋山位于河南省哪座城市？","options":["洛阳市","济源市","焦作市","三门峡市"],"answer":"B","explain":"王屋山在济源市境内，属太行山南端，与焦作云台山不是一处。"},{"type":"单选","stem":"道教将王屋山列为“十大洞天”之首，其称号是？","options":["天下第一福地","天下第一洞天","天下第一丛林","天下第一仙山"],"answer":"B","explain":"“洞天”与“福地”是两套体系，王屋山是洞天之首。"},{"type":"单选","stem":"王屋山的主峰是？","options":["天坛山","玉皇顶","日观峰","老君顶"],"answer":"A","explain":"主峰天坛山，因相传黄帝设坛祭天而得名。"},{"type":"单选","stem":"天坛山的海拔约为？","options":["1517米","1615米","1715米","1815米"],"answer":"C","explain":"主峰天坛山海拔1715米，这是最容易被追问的数字。"},{"type":"单选","stem":"相传在天坛山设坛祭天的是？","options":["炎帝","黄帝","尧","舜"],"answer":"B","explain":"轩辕黄帝设坛祭天，是天坛山名称的由来。"},{"type":"单选","stem":"“愚公移山”的故事出自哪部典籍？","options":["《山海经》","《淮南子》","《列子·汤问》","《庄子》"],"answer":"C","explain":"出自《列子·汤问》，故事发生地即王屋山。"},{"type":"单选","stem":"阳台宫创建于哪个朝代？","options":["汉代","唐代","宋代","明代"],"answer":"B","explain":"唐代创建，现存主体建筑为明清时期所建。"},{"type":"单选","stem":"王屋山成为世界地质公园的年份是？","options":["2006年","2004年","2010年","2015年"],"answer":"A","explain":"2006年，王屋山与黛眉山共同成为世界地质公园。"},{"type":"单选","stem":"与王屋山一起列入世界地质公园的是？","options":["云台山","嵩山","黛眉山","老君山"],"answer":"C","explain":"合称王屋山—黛眉山世界地质公园。"},{"type":"判断","stem":"王屋山被道教列为“十大洞天”之首。","options":["正确","错误"],"answer":"A","explain":"道教十大洞天，王屋山居首，称“天下第一洞天”。"},{"type":"判断","stem":"“愚公移山”的故事发生地在太行山，与王屋山无关。","options":["正确","错误"],"answer":"B","explain":"故事里太行、王屋二山并提，发生地即王屋山。"},{"type":"判断","stem":"“山形如王者车盖”是王屋山得名的一种说法。","options":["正确","错误"],"answer":"A","explain":"另一说为“王者所居”，两说并存。"},{"type":"填空","stem":"王屋山位于河南省____市。","answer":"济源","explain":"济源市，太行山南端。"},{"type":"填空","stem":"王屋山主峰天坛山海拔约____米。","answer":"1715","explain":"1715米，注意不要写成1517。"},{"type":"填空","stem":"“愚公移山”出自《____》。","answer":"列子·汤问","explain":"《列子·汤问》，作者列御寇。"},{"type":"填空","stem":"2006年，王屋山与____山一起成为世界地质公园。","answer":"黛眉","explain":"王屋山—黛眉山世界地质公园。"}],"k":"wangwushan","core":false},{"name":"嵖岈山","city":"驻马店","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是嵖岈山。各位朋友，前面就是嵖岈山景区大门。请大家带好随身物品，跟紧我。这里的石头造型奇特，拍照之前先站稳，还是那句老话：走路不观景，观景不走路。今天咱们慢慢逛，把这座“中华盆景”看个够。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"先介绍一下嵖岈山所在的地方。嵖岈山在驻马店市遂平县境内，地处伏牛山的东缘。驻马店在河南中南部，地势西高东低，西边是伏牛山、桐柏山的余脉，东边是平坦的平原，嵖岈山正好卡在山地与平原交界的这条线上。正因为身处这样的过渡地带，这里的山不高却奇，石不大却怪，走在山里，一会儿是石缝，一会儿是林荫，转个弯景就变了。当地人说，遂平人有福气，家门口就摆着一座大盆景。这话不假，等会儿大家进山就知道了。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"嵖岈山是国家5A级旅游景区，2015年获批。它最出名的是花岗岩象形石地貌，山上的石头被风化、剥蚀成各种形状，像人、像兽、像器物，因此有了“中华盆景”的美誉。景区里最标志性的景观是“石猴”，人称“天下第一石猴”，远远望去，一只石猴蹲在山头，惟妙惟肖。1998年，央视《西游记》续集把这里作为主要外景拍摄地，六小龄童版的孙悟空就在这些石头上翻腾跳跃。景区主要分为南山、北山、蜜蜡山、六绝洞等几个片区，今天我们先走南山，再看北山，节奏不赶，大家跟紧就行。山不算高，但石头有戏，看一遍不够，很多人回头还会再来。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"第一点，先说说这些石头是怎么来的。嵖岈山是花岗岩象形石地貌，花岗岩原本是地下深处慢慢冷却结晶的岩体，后来地壳抬升，岩体露出地表，再经过长期的风化、剥蚀和崩塌，硬的部分留下来，软的部分被掏空，就雕出了今天这些奇形怪状的石峰、石柱和石洞。大家看，山上的石头很少有棱角，多是圆头圆脑的，那是被风雨打磨了很久的结果。所以“中华盆景”这四个字不是夸张，它把一座山的石头，浓缩成了可以近看、可以细品的盆景。看这种山，三分靠看，七分靠想，你心里想着什么，石头上就像什么。这里的石头还有一个特点，成片成组，一处一处地摆着，像有人精心布置过，其实是岩体顺着裂隙被反复冻融、冲刷、掏空的结果。第二点，天下第一石猴。进了山，大家一定要找一找那块石头。顺着我手指的方向看，山顶上蹲着一块巨石，头、肩、身子的轮廓都很清楚，像一只猴子蹲在那里望着远方，这就是嵖岈山的标志——石猴，人称“天下第一石猴”。为什么叫天下第一？一是形似，远看近看都像；二是位置好，它守在山口，像给整座山看门；三是它有故事，当地关于石猴的传说讲了一代又一代。大家拍照的时候可以换个角度，往左走几步，猴子的侧脸会更明显。不过要提醒一句，观景台地方不大，拍完就往前走，别都挤在一块儿。石猴这一带是全山水土最好的一段，不妨多留几分钟，绕着走一圈，四面看，姿态各不相同。第三点，《西游记》与嵖岈山。1998年，中央电视台拍摄《西游记》续集，把嵖岈山定为主要外景拍摄地，六小龄童饰演的孙悟空，就在这些石头上取景。为什么选这里？因为嵖岈山的石头天生带着神话气，石猴、石洞、石缝，不用搭景就是花果山。当年拍摄时，很多镜头都是实景完成，演员在石头上攀爬跳跃，条件很苦。现在山里还留着一些拍摄时的痕迹和故事，走到相应位置，我会指给大家看。可以说，嵖岈山不只是自然的作品，也是一代人童年记忆的背景板。很多游客一来就说，看见这些石头，耳边就响起了片头曲。山水借影视走红，影视也借山水立住了脚，这是互相成就的事。第四点，几个片区怎么逛。嵖岈山主要分南山、北山、蜜蜡山、六绝洞等片区。南山是精华，象形石最集中，石猴就在这一带，路也相对好走，适合大多数游客；北山山势更野，石峰更陡，喜欢爬山的可以多走一段；蜜蜡山的名字来自山石的色泽，阳光一照，石面泛着温润的光；六绝洞以洞景见长，洞里凉气足，夏天进去特别舒服。今天我们的安排是先南山、后北山，六绝洞看时间，能进就进。大家记住集合点和时间，手机保持畅通，山里信号有时不稳，别单独走岔路。队伍里有老人和孩子，走北山时我会放慢脚步，遇到陡的地方先扶一把，安全永远排在风景前面，风景跑不掉，人得平平安安。"},{"h":"第5段 · 欢送结束（约40秒）","t":"好了，各位朋友，今天的嵖岈山就逛到这儿。回头再看一眼那只石猴，它还在山头蹲着，看了那么多年，也不着急。希望今天这些石头，能在大家的相册里、记忆里多待些日子。请大家清点好随身物品，把垃圾带下山，有序上车。也欢迎大家换一个季节再来，看看石头上落雪、山脚开花的模样。祝大家一路顺风，阖家安康，谢谢！"}],"kw":["中华盆景","花岗岩象形石","天下第一石猴","西游记续集","六小龄童","南山北山","蜜蜡山","六绝洞","遂平县","5A景区"],"warn":"嵖岈山是花岗岩象形石地貌，不要说成喀斯特；5A是2015年，“中华盆景”是它的雅号，也别顺口给它编景区面积。","mind":[{"h":"开场","kids":["问候考官并报号","自我介绍","提示石头区拍照安全","说明集合时间"]},{"h":"城市概况","kids":["驻马店遂平县","伏牛山东缘","山地平原过渡带","家门口的大盆景"]},{"h":"景点概况","kids":["2015年评5A","花岗岩象形石地貌","中华盆景之誉","石猴与西游记"]},{"h":"核心讲解","kids":["象形石的成因","天下第一石猴","1998年西游记续集取景","四大片区怎么逛"]},{"h":"欢送结束","kids":["回望石猴","提醒带走垃圾","清点物品","致谢祝福"]}],"cards":[{"f":"嵖岈山在哪座城市、哪个县？","b":"驻马店市遂平县。答完市再补县，信息才完整。"},{"f":"嵖岈山位于哪条山脉的东缘？","b":"伏牛山东缘。这是它山地与平原过渡地貌的成因背景。"},{"f":"嵖岈山哪一年成为国家5A级景区？","b":"2015年。年份记牢，别和云台山、老君山的评定时段混。"},{"f":"嵖岈山以什么地貌著称？","b":"花岗岩象形石地貌。说成喀斯特是硬伤，花岗岩是岩浆岩，不是可溶岩。"},{"f":"嵖岈山有什么雅号？","b":"“中华盆景”。四个字既说石头，也说尺度，讲解时可以先抛雅号再解释。"},{"f":"嵖岈山的标志景观是什么？","b":"石猴，人称“天下第一石猴”。位置在山头，远看轮廓最像。"},{"f":"哪部影视作品让嵖岈山广为人知？","b":"1998年央视《西游记》续集，主要外景拍摄地，孙悟空由六小龄童饰演。"},{"f":"嵖岈山主要分哪几个片区？","b":"南山、北山、蜜蜡山、六绝洞。四个名字要能一口气报出来。"},{"f":"带团游嵖岈山，路线怎么安排？","b":"先南山后北山，六绝洞视时间安排。南山象形石集中、路好走，适合大多数游客。"},{"f":"嵖岈山的象形石是怎么形成的？","b":"花岗岩抬升出露后，经长期风化、剥蚀、崩塌，软处被掏空、硬处留存，遂成象形。"}],"facts":[{"type":"单选","stem":"嵖岈山位于河南省哪个市？","options":["信阳市","南阳市","驻马店市","周口市"],"answer":"C","explain":"嵖岈山在驻马店市遂平县境内。"},{"type":"单选","stem":"嵖岈山位于哪条山脉的东缘？","options":["太行山","伏牛山","桐柏山","大别山"],"answer":"B","explain":"地处伏牛山东缘，山地与平原的过渡带。"},{"type":"单选","stem":"嵖岈山哪一年被评为国家5A级景区？","options":["2015年","2011年","2013年","2017年"],"answer":"A","explain":"2015年获批国家5A级旅游景区。"},{"type":"单选","stem":"嵖岈山以什么地貌著称？","options":["喀斯特地貌","丹霞地貌","花岗岩象形石地貌","雅丹地貌"],"answer":"C","explain":"花岗岩经风化剥蚀形成象形石，是典型的花岗岩象形石地貌。"},{"type":"单选","stem":"嵖岈山被称为什么？","options":["中华盆景","天下奇观","中原第一山","北方石林"],"answer":"A","explain":"“中华盆景”是嵖岈山最常用的雅号。"},{"type":"单选","stem":"嵖岈山的标志景观是？","options":["石龟","石笋","石猴","石林"],"answer":"C","explain":"石猴，又称“天下第一石猴”。"},{"type":"单选","stem":"1998年央视哪部作品把嵖岈山作为主要外景拍摄地？","options":["《西游记》续集","《三国演义》","《水浒传》","《封神榜》"],"answer":"A","explain":"《西游记》续集，六小龄童饰演孙悟空。"},{"type":"单选","stem":"在嵖岈山取景的孙悟空扮演者是？","options":["马德华","六小龄童","徐少华","迟重瑞"],"answer":"B","explain":"六小龄童饰孙悟空，马德华饰猪八戒，不要混。"},{"type":"单选","stem":"下列不属于嵖岈山主要片区的是？","options":["南山","北山","蜜蜡山","云台山"],"answer":"D","explain":"主要片区为南山、北山、蜜蜡山、六绝洞。"},{"type":"判断","stem":"嵖岈山位于驻马店市遂平县境内。","options":["正确","错误"],"answer":"A","explain":"遂平县，伏牛山东缘。"},{"type":"判断","stem":"嵖岈山以喀斯特地貌著称。","options":["正确","错误"],"answer":"B","explain":"是花岗岩象形石地貌，喀斯特属可溶岩地貌，两者不同。"},{"type":"判断","stem":"嵖岈山的标志景观石猴被称为“天下第一石猴”。","options":["正确","错误"],"answer":"A","explain":"石猴是嵖岈山的标志性景观。"},{"type":"填空","stem":"嵖岈山位于河南省____市遂平县。","answer":"驻马店","explain":"驻马店市遂平县。"},{"type":"填空","stem":"嵖岈山因花岗岩象形石地貌被誉为“____”。","answer":"中华盆景","explain":"“中华盆景”四字概括了它的石头与尺度。"},{"type":"填空","stem":"1998年央视《西游记》续集在嵖岈山拍摄，孙悟空的扮演者是____。","answer":"六小龄童","explain":"六小龄童，本名章金莱。"},{"type":"填空","stem":"嵖岈山主要分为南山、北山、____、六绝洞等片区。","answer":"蜜蜡山","explain":"四大片区：南山、北山、蜜蜡山、六绝洞。"}],"k":"chayashan","core":false},{"name":"太昊伏羲陵","city":"周口","secs":[{"h":"第1段 · 开场（约40秒）","t":"各位考官好，我是×号考生，今天我为大家讲解的景点是太昊伏羲陵。各位朋友，我们眼前就是太昊陵的大门。这里是祭祀人文始祖伏羲的地方，请大家把手机调成静音，进殿以后不要大声喧哗，不要踩门槛，拍照时不要用闪光灯。今天我们一起走进这座陵庙，去认识一位很久很久以前的先人。"},{"h":"第2段 · 城市概况（约1分20秒）","t":"太昊陵在周口市淮阳区。淮阳是个老地方，古称宛丘，又叫陈州，历史上一直是豫东平原上的重镇。这里地势平坦，水源充足，城被湖水环抱着，这座湖就是龙湖。淮阳还有个别称叫“龙都”，因为伏羲当年以龙纪官，用龙来命名官职，龙的形象从这里走进了中华文化的血脉。走在淮阳城里，你能感觉到一种很特别的气息：一边是湖水、荷花、渔船，一边是香火、碑刻、古柏。一座城把神话、历史和日子过在了一起，这在别处不多见。"},{"h":"第3段 · 景点概况（约1分40秒）","t":"太昊伏羲陵是陵和庙合在一起的建筑群，陵在前，庙在后。这一布局很特别：前头是陵墓，后头是庙宇，祭祀和凭吊连成一条线。它是全国重点文物保护单位，始建于春秋，历代都有增修，今天看到的格局是明清时期形成的。庙区的主体建筑有统天殿、显仁殿、太极门、先天门，一进一进往里走，殿宇层层抬高，人的心也跟着静下来。后面的太昊陵高约二十米，周长约一百五十米，封土堆圆圆的，长满了古树和青草。陵前还有蓍草园，相传伏羲就是在这里用蓍草画八卦的。一会儿走到园前，大家可以留意这种草的茎，直直的一根，风一吹，整片都在动。"},{"h":"第4段 · 核心讲解（约4分30秒）","t":"第一点，先看这组建筑的格局。太昊陵最特别的地方，是陵庙合一，而且陵在前、庙在后。大家从大门进来，先过太极门，再进先天门，然后是统天殿、显仁殿，一进比一进高，最后才走到陵前。为什么要这样安排？因为在中国人的观念里，先有祖先，才有后代；先有陵，才有庙。陵是安放身体的地方，庙是安放敬意的地方。你注意看殿名，太极、先天、统天，这些词都跟八卦、跟天地本源有关。一座建筑群，把伏羲在文化里的位置，写在了门额上。走这一条路，其实是在走一条从人到神、从历史到信仰的路。大家注意脚下的中轴线，一条线走到底，这就是中国人的礼制秩序：中正、对称、层层递进，不偏不倚。第二点，说说伏羲这个人。伏羲被尊为“人文始祖”，他的功劳，讲解时记住四句话：画八卦、结网罟、正姓氏、制嫁娶。画八卦，是观察天地万物，用简单的符号把规律记下来，这是中国最早的哲学思维；结网罟，是教人结网捕鱼、驯养牲畜，解决了吃饭问题；正姓氏，是给人定姓，同姓不通婚，族群从此有了边界；制嫁娶，是定下婚配的礼制，家庭开始成形。这四件事，件件都是从野蛮走向文明的门槛。所以后人叫他“人文始祖”，不是客套，是实打实的分量。四件事连起来看，就是一条线：先有想法，再有饭吃，再有姓，再有家。文明的顺序，大概也就是这样。第三点，蓍草园。陵前这片园子，种的是蓍草，相传伏羲就是在这里用蓍草画八卦的。蓍草是一种多年生草本，茎秆直，古人认为它通灵，占卜时用它的茎来演算。大家可能会问，为什么偏偏是草？因为远古没有纸笔，天地之间的信息，只能靠身边最寻常的东西去承接。一根草、一道痕、一个符号，慢慢就长成了八卦，长成了《易经》。所以这片园子看着不起眼，其实是中国人思维方式的一个起点。参观时请不要采摘蓍草，也不要跨过围栏，让这片草继续长下去。古人把蓍草看得很重，说它活得越久，茎就越灵，这话带着神话色彩，却也说明蓍草在古人心里的位置有多重。一根草能撑起一套学问，这就是古人的本事。第四点，庙会和龙湖。太昊陵庙会从农历二月初二开始，到三月初三结束，前后一个月，2006年被列入首批国家级非物质文化遗产。到了那一个月，四面八方的人往淮阳赶，香火、小吃、民间手艺，满街都是人声。当地人讲，这是“人祖”的生日会，来一趟，心里踏实。庙会之外，淮阳还有龙湖，这是一圈环城的湖，水面开阔，荷花连片，被称为“内陆奇观”。一个陵、一个庙、一个会、一片湖，把淮阳的日子填得满满当当。大家如果有机会二月里来，一定要感受一次。不过庙会期间人山人海，带团要提前约好集合点，让老人和孩子走在队伍中间，别让人群把队伍冲散。"},{"h":"第5段 · 欢送结束（约40秒）","t":"好了，各位朋友，今天的太昊陵就讲解到这里。从陵前走到庙后，我们其实走过了很长很长的一段路，从结网捕鱼，到画卦定姓，再到今天我们站在这里。始祖留下的不只是这座陵，还有一种看待天地的方式。请大家带好随身物品，有序离场，殿内的香火请不要带出来。祝大家平安顺遂，谢谢！"}],"kw":["人文始祖","陵庙合一","统天殿","显仁殿","太极门","先天门","蓍草画卦","龙都淮阳","太昊陵庙会","龙湖"],"warn":"太昊陵是“陵在前、庙在后”，别说反；庙会是农历二月初二至三月初三，2006年列入首批国家级非遗，“人文始祖”指伏羲，不是黄帝。","mind":[{"h":"开场","kids":["问候考官并报号","自我介绍","殿堂参观礼仪","说明集合时间"]},{"h":"城市概况","kids":["周口淮阳区","古称宛丘、陈州","龙都的来历","龙湖环城"]},{"h":"景点概况","kids":["陵庙合一、陵前庙后","始建于春秋、明清格局","四座主体建筑","陵高约20米、周长约150米"]},{"h":"核心讲解","kids":["中轴建筑的礼制秩序","伏羲四大功绩","蓍草园与画卦","庙会与龙湖"]},{"h":"欢送结束","kids":["回顾中轴线","点出文化传承","提醒不带香火出场","致谢祝福"]}],"cards":[{"f":"太昊陵在哪座城市、哪个区？","b":"周口市淮阳区。淮阳古称宛丘，又称陈州，地名要能顺口带出来。"},{"f":"太昊陵的布局有什么特别？","b":"陵庙合一，陵在前、庙在后。这是它区别于很多帝王陵的地方。"},{"f":"太昊陵始建于什么年代？现存格局是什么年代？","b":"始建于春秋，历代增修，现存格局为明清建筑。两个时间层次都要交代。"},{"f":"庙区四座主体建筑分别是什么？","b":"统天殿、显仁殿、太极门、先天门。按中轴线顺序说，条理最清楚。"},{"f":"太昊陵的陵墓有多大？","b":"高约20米，周长约150米。只记这两个数，别再加别的尺寸。"},{"f":"伏羲的四大功绩是什么？","b":"画八卦、结网罟、正姓氏、制嫁娶。四个动宾短语，背下来最省力。"},{"f":"伏羲为什么被尊为“人文始祖”？","b":"因为他把先民从蒙昧带向文明：有思想、有饭吃、有姓、有家。"},{"f":"淮阳为什么叫“龙都”？","b":"伏羲以龙纪官，用龙命名官职，龙的文化符号由此发端。"},{"f":"蓍草园和伏羲有什么关系？","b":"相传伏羲在此用蓍草画八卦。草是工具，卦是成果。"},{"f":"太昊陵庙会的时间和非遗身份？","b":"农历二月初二至三月初三，2006年列入首批国家级非物质文化遗产。"}],"facts":[{"type":"单选","stem":"太昊伏羲陵位于周口市哪个区？","options":["川汇区","淮阳区","项城市","扶沟县"],"answer":"B","explain":"在周口市淮阳区，古称宛丘、陈州。"},{"type":"单选","stem":"淮阳古称宛丘，又称？","options":["陈州","陈留","谯郡","颍川"],"answer":"A","explain":"宛丘、陈州都是淮阳的古称。"},{"type":"单选","stem":"太昊陵的布局特点是？","options":["陵在后、庙在前","陵在前、庙在后","陵庙并列","有庙无陵"],"answer":"B","explain":"陵庙合一，陵在前、庙在后，祭祀与凭吊连成一线。"},{"type":"单选","stem":"太昊陵始建于哪个时期？","options":["春秋","秦汉","唐宋","明清"],"answer":"A","explain":"始建于春秋，历代增修，现存格局为明清建筑。"},{"type":"单选","stem":"现存太昊陵的建筑格局形成于？","options":["唐代","宋代","元代","明清"],"answer":"D","explain":"现存格局为明清时期形成。"},{"type":"单选","stem":"太昊陵陵墓的高度约为？","options":["10米","15米","20米","30米"],"answer":"C","explain":"高约20米，周长约150米。"},{"type":"单选","stem":"太昊陵庙会结束于农历？","options":["三月初三","三月十五","四月初八","二月初二"],"answer":"A","explain":"二月初二开始，三月初三结束，前后一个月。"},{"type":"单选","stem":"太昊陵庙会被列入首批国家级非物质文化遗产的年份是？","options":["2004年","2006年","2008年","2011年"],"answer":"B","explain":"2006年列入首批国家级非物质文化遗产名录。"},{"type":"单选","stem":"伏羲被后人尊称为？","options":["人文始祖","至圣先师","太上老君","武圣"],"answer":"A","explain":"“至圣先师”指孔子，“人文始祖”指伏羲。"},{"type":"判断","stem":"太昊陵的陵墓位于庙区的前面。","options":["正确","错误"],"answer":"A","explain":"陵在前、庙在后，是太昊陵的独特布局。"},{"type":"判断","stem":"太昊陵庙会从农历三月初三开始，到二月初二结束。","options":["正确","错误"],"answer":"B","explain":"起止说反了：二月初二开始，三月初三结束。"},{"type":"判断","stem":"“人文始祖”是后人对黄帝的尊称。","options":["正确","错误"],"answer":"B","explain":"“人文始祖”指伏羲，黄帝通常称“人文初祖”。"},{"type":"填空","stem":"太昊伏羲陵位于河南省周口市____区。","answer":"淮阳","explain":"淮阳区，古称宛丘、陈州。"},{"type":"填空","stem":"太昊陵庙区主体建筑有统天殿、显仁殿、太极门和____。","answer":"先天门","explain":"四座主体建筑：统天殿、显仁殿、太极门、先天门。"},{"type":"填空","stem":"伏羲以龙纪官，淮阳因此被称为“____”。","answer":"龙都","explain":"龙都之名源于伏羲以龙纪官。"},{"type":"填空","stem":"太昊陵庙会从农历二月初二持续到____。","answer":"三月初三","explain":"前后一个月，2006年列入首批国家级非遗。"}],"k":"taihao","core":false}];
