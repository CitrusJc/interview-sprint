<script>
var QUIZ=[{"type":"多选","stem":"导游人员应具备较强的独立工作能力，其表现主要包括（多选）","options":["独立执行政策和独立进行宣传讲解的能力","较强的独立组织协调能力","善于和各种人打交道的能力","独立处理问题和事故的能力"],"answer":"ABCD","explain":"独立工作能力含政策执行与讲解、组织协调、人际交往、处理问题事故四方面，四项均属其中内容。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪接团前的准备工作包括六个方面，下列不属于其中内容的是？","options":["熟悉接待计划","落实接待事宜","做好形象和心理准备","为旅游团设计游览线路"],"answer":"D","explain":"接团前六项准备为熟悉计划、落实事宜、语言知识、物质、形象、心理；设计线路属产品设计环节。","spot":"","cat":"服务规范"},{"type":"判断","stem":"地陪接团前的准备工作包括语言和知识准备、物质准备、形象准备和心理准备。","options":["正确","错误"],"answer":"A","explain":"六项准备中确含语言知识、物质、形象、心理四项，另两项为熟悉接待计划和落实接待事宜。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪在前往旅游景区（点）途中的服务中，下列属于其应向游客介绍内容的是？","options":["重申当日活动安排","协助办理饭店入住手续","清点交接行李件数","结算游客在店内的个人消费"],"answer":"A","explain":"途中服务为重申日程、沿途风光、景点介绍、活跃气氛；入住、行李、结账分属其他环节。","spot":"","cat":"服务规范"},{"type":"判断","stem":"地陪在前往景区途中应进行沿途风光导游和景点介绍，并注意活跃车内气氛。","options":["正确","错误"],"answer":"A","explain":"途中服务共四项：重申当日安排、沿途风光导游、介绍旅游景点、活跃气氛，缺一不可。","spot":"","cat":"服务规范"},{"type":"单选","stem":"抵达景区（点）下车前，地陪应提醒游客记住的内容是？","options":["旅游车的标志、车号、停车地点和开车时间","景区门票价格和优惠政策","当地特产的价格和购买地点","下一站城市的入住饭店名称"],"answer":"A","explain":"下车前必须讲清车标、车号、停车地点与开车时间，这是防止游客走失、误时的关键。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪讲明游览线路、所需时间以及集合时间和地点，通常在何处进行？","options":["景区（点）示意图前","旅游车车门处","景区检票口内侧","游客用餐的餐厅门口"],"answer":"A","explain":"惯例是在景区示意图前讲明线路、用时与集合时间地点，便于游客形成空间概念。","spot":"","cat":"服务规范"},{"type":"单选","stem":"旅游团离店前，全陪、领队和地陪共同确认的事项中，与行李有关的是？","options":["确认行李件数并办妥交接手续","确认行李重量是否符合航空规定","确认行李内有无违禁物品","确认行李是否已办理保险"],"answer":"A","explain":"离店时要清点行李件数并办妥交接手续；重量、违禁品、保险不属此环节确认内容。","spot":"","cat":"服务规范"},{"type":"判断","stem":"旅游团离店前，地陪应提醒游客确认旅行证件和钱物是否带齐。","options":["正确","错误"],"answer":"A","explain":"证件与钱物清点是离店确认的四项内容之一，可避免后续行程受阻。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪在旅游大巴车内导游时，应站立的位置是？","options":["车厢前部、司机附近，面向游客","车厢中部，侧身面向游客","车厢尾部，背向游客","车门处，面向车外"],"answer":"A","explain":"站车前部司机附近并面向游客，便于观察游客反应、交流情感，也便于随时与司机联系。","spot":"","cat":"服务规范"},{"type":"单选","stem":"领队带团出境前召开“出国旅游说明会”，其内容一般不包括？","options":["代表旅行社致欢迎词","进行旅游行程说明","提出要求、讲清注意事项","为全团统一兑换外币"],"answer":"D","explain":"说明会内容为致欢迎词、行程说明、目的地国情风俗、提要求讲注意事项、落实分房交款等。","spot":"","cat":"服务规范"},{"type":"判断","stem":"领队召开出国旅游说明会时，应向旅游者介绍旅游目的地国家或地区的基本情况及风俗习惯。","options":["正确","错误"],"answer":"A","explain":"目的地国情与风俗介绍是说明会五项内容之一，有助于游客文明、顺利出行。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪欢送词中，对旅游活动不尽如人意之处表示真诚歉意的内容属于？","options":["感谢语","回顾语","惜别语","祝愿语"],"answer":"A","explain":"道歉寄于感谢语中，借感谢合作之机致歉，既显诚意又不显突兀。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪所致欢送词，一般不包括下列哪项内容？","options":["回顾旅游活动，加深游客体验","感谢游客及领队、全陪、司机的合作","诚恳征询对接待工作的意见","介绍下一站景点的讲解要点"],"answer":"D","explain":"欢送词为回顾、感谢、征求意见、惜别、祝愿五部分；下一站介绍属沿途导游内容。","spot":"","cat":"服务规范"},{"type":"单选","stem":"地陪送团时，乘国内航班应提前多长时间到达机场？","options":["1小时","2小时","3小时","4小时"],"answer":"B","explain":"国内航班提前2小时，出境航班提前3小时，火车提前1小时，三个时限最易混淆。","spot":"","cat":"服务规范"},{"type":"判断","stem":"地陪送团乘火车时，应提前1小时到达火车站。","options":["正确","错误"],"answer":"A","explain":"火车提前1小时、国内航班2小时、出境航班3小时，切勿把航班时限套用到火车。","spot":"","cat":"服务规范"},{"type":"多选","stem":"导游人员树立良好形象的途径包括（多选）","options":["重视第一印象","保持行中形象","强化最终印象","多提供个性化服务"],"answer":"ABCD","explain":"首因、行中、最终印象构成形象主线，个性化服务是重要补充，另需多与游客沟通。","spot":"","cat":"服务规范"},{"type":"多选","stem":"导游人员处理旅游者个别要求时应遵循的原则包括（多选）","options":["符合法律法规的原则","合理而可能的原则","尊重旅游者的原则","公平对待的原则"],"answer":"ABCD","explain":"个别要求处理须合法、合理可能、尊重游客、公平对待，另需维护人格尊严。","spot":"","cat":"服务规范"},{"type":"单选","stem":"旅游者处于旅游中期阶段时，其心理主要表现为？","options":["求安全、求新、求异心理","懒散心理和求全心理","忙于处理个人事务","归心似箭、急于返程"],"answer":"B","explain":"中期表现为懒散与求全；初期求安全求新求异，后期忙于个人事务，三段易错位。","spot":"","cat":"服务规范"},{"type":"判断","stem":"旅游初期阶段，旅游者的心理主要表现为求安全、求新、求异。","options":["正确","错误"],"answer":"A","explain":"初期以安全感和新奇感为主，中期转为懒散求全，后期忙于个人事务。","spot":"","cat":"服务规范"},{"type":"多选","stem":"导游人员接待儿童时应掌握“四不宜”原则，其中包括（多选）","options":["不宜突出儿童而冷落成年旅游者","不宜给儿童买食物、玩具","不宜单独带旅游者的孩子外出活动","儿童生病时不宜建议家长给儿童服药"],"answer":"ABCD","explain":"四不宜还包括不准将自己的药品给儿童服用，应建议家长带孩子去医院治疗。","spot":"","cat":"服务规范"},{"type":"单选","stem":"从性格上看，旅游者一般可划分为哪几类？","options":["活泼型、急躁型、稳重型、忧郁型","外向型、内向型、混合型、中间型","理智型、情绪型、意志型、混合型","保守型、开放型、冒险型、从众型"],"answer":"A","explain":"按性格分为活泼、急躁、稳重、忧郁四类，其余组合是常见混淆项。","spot":"","cat":"服务规范"},{"type":"单选","stem":"下列不属于按性格划分的旅游者类型是？","options":["活泼型","急躁型","稳重型","享受型"],"answer":"D","explain":"四类型为活泼、急躁、稳重、忧郁；“享受型”属按消费需求划分的类型。","spot":"","cat":"服务规范"},{"type":"单选","stem":"导游人员调整旅游者情绪的方法不包括？","options":["补偿法","转移注意法","暗示法","批评教育法"],"answer":"D","explain":"调节情绪常用补偿、转移注意、暗示三法；批评教育不属于情绪调节手段。","spot":"","cat":"服务规范"},{"type":"单选","stem":"接待高龄旅游者时，下列做法不恰当的是？","options":["妥善安排行程，留出充裕时间","做好提醒工作，注意放慢速度","耐心解答问题，预防游客走失","为节省时间，催促老人加快步伐"],"answer":"D","explain":"高龄游客须放慢节奏、耐心解答并防走失，催促赶路易致疲劳和意外。","spot":"","cat":"服务规范"},{"type":"判断","stem":"接待高龄旅游者时，导游应注意放慢速度并预防游客走失。","options":["正确","错误"],"answer":"A","explain":"妥善安排行程、做好提醒、放慢速度、耐心解答、预防走失是接待高龄游客五项要点。","spot":"","cat":"服务规范"},{"type":"单选","stem":"出境领队的主要职责不包括？","options":["落实旅游合同","做好组织和团结工作，全程服务、旅途向导","协调联络，维护权益，解决难题","核定旅游线路的销售价格"],"answer":"D","explain":"领队职责为落实合同、组织团结、全程向导、协调维权；定价属计调与销售环节。","spot":"","cat":"服务规范"},{"type":"判断","stem":"画龙点睛法是用精辟的词语概括旅游目的地或游览景点突出特征的讲解方法。","options":["正确","错误"],"answer":"A","explain":"该法以凝练词句点出景点精华所在，使游客留下突出印象，故称画龙点睛。","spot":"","cat":"服务规范"},{"type":"单选","stem":"导游语言的基本要求是？","options":["清楚、准确、生动、灵活","洪亮、快速、幽默、规范","简洁、含蓄、典雅、庄重","通俗、风趣、亲切、随和"],"answer":"A","explain":"清楚、准确、生动、灵活是四项基本要求，其余选项只是表达风格的描述。","spot":"","cat":"服务规范"},{"type":"判断","stem":"导游语言应力求清楚、准确、生动、灵活。","options":["正确","错误"],"answer":"A","explain":"四项要求中清楚与准确是底线，生动与灵活则提升讲解的感染力。","spot":"","cat":"服务规范"},{"type":"单选","stem":"根据《旅游法》第四十一条，导游和领队从事业务活动时应当？","options":["佩戴导游证、领队证，遵守职业道德","向游客索取适当小费","按游客要求随时变更行程","替游客垫付另行付费项目费用"],"answer":"A","explain":"法律要求持证上岗、遵守职业道德，且不得擅自变更行程、索取小费、强迫购物。","spot":"","cat":"服务规范"},{"type":"判断","stem":"《旅游法》规定，导游和领队不得诱导、欺骗、强迫或者变相强迫旅游者购物。","options":["正确","错误"],"answer":"A","explain":"第四十一条还禁止擅自变更行程、中止服务、索取小费及安排另行付费项目。","spot":"","cat":"服务规范"},{"type":"单选","stem":"导游接待女性旅游者时，下列做法不属于应注意事项的是？","options":["体现女士优先","适当安排购物","讲解生动","为活跃气氛多开玩笑、探问私事"],"answer":"D","explain":"四项要点为女士优先、适当购物、讲解生动、关注健康；玩笑过度、探问私事有失分寸。","spot":"","cat":"服务规范"},{"type":"多选","stem":"导游运用突出重点法讲解时，一般应突出的内容包括（多选）","options":["景点的独特之处","具有代表性的景观","旅游者感兴趣的内容","“……之最”"],"answer":"ABCD","explain":"突出重点法不面面俱到，从独特处、代表性景观、游客兴趣和“之最”四方面着力。","spot":"","cat":"服务规范"},{"type":"多选","stem":"体态语言主要包括（多选）","options":["表情语","姿态语","手势语","服饰语"],"answer":"ABCD","explain":"体态语言含表情、姿态、手势、服饰、界域五类，界域语指空间距离的运用。","spot":"","cat":"服务规范"},{"type":"单选","stem":"出境领队接待前的准备工作不包括？","options":["听取计调人员情况介绍并接收有关资料","熟悉旅游接待计划","开好出境前的说明会","赴境外为团队预订餐厅并实地踩线"],"answer":"D","explain":"领队准备为听取介绍、熟悉计划、做好有关准备、开好说明会；踩线属产品设计范畴。","spot":"","cat":"服务规范"},{"type":"单选","stem":"出境领队接待前准备工作中，与旅行社计调人员交接的环节是？","options":["听取该团情况介绍并接收有关资料","核定团队成本与销售报价","与境外接待社签订接待合同","为团队办理意外险投保手续"],"answer":"A","explain":"准备第一步即听取计调介绍、接收资料；成本核定、签约、投保均非领队职责。","spot":"","cat":"服务规范"},{"type":"单选","stem":"《中华人民共和国旅游法》的施行日期是？","options":["2013年4月25日","2013年10月1日","2013年5月19日","2014年1月1日"],"answer":"B","explain":"2013年4月25日颁布、10月1日起施行，颁布日与施行日最易互换。","spot":"","cat":"服务规范"},{"type":"判断","stem":"《中华人民共和国旅游法》于2013年4月25日颁布，同年10月1日起施行。","options":["正确","错误"],"answer":"A","explain":"颁布与施行相隔五个多月，答题时须分清颁布日和施行日两个节点。","spot":"","cat":"服务规范"},{"type":"多选","stem":"导游常用的讲解方法包括（多选）","options":["概述法、分段讲解法","突出重点法、问答法","虚实结合法、触景生情法","制造悬念法、类比法、画龙点睛法"],"answer":"ABCD","explain":"常用讲解方法共十种，除四项所列外还有妙用数字法，均属同一体系。","spot":"","cat":"服务规范"},{"type":"单选","stem":"导游日常工作中的礼仪要求，下列做法不恰当的是？","options":["按规定时间提前到达出发地点","用导游旗或手指清点旅游者人数","旅游车发动时提示客人坐稳扶好","不随意进入旅游者房间"],"answer":"B","explain":"清点人数应默数，用导游旗或手指点数既不礼貌，也易引起客人误解。","spot":"","cat":"服务规范"},{"type":"判断","stem":"导游清点旅游者人数时，应避免使用导游旗或手指点数，而采取默数的方法。","options":["正确","错误"],"answer":"A","explain":"默数可避免不礼貌与误解；遵守时间、尊重游客、注意细节同属日常礼仪要求。","spot":"","cat":"服务规范"},{"type":"单选","stem":"全陪（地陪）与领队协作时，下列做法不正确的是？","options":["尊重领队，遇事多与其磋商","关心领队生活，支持其工作","多给领队荣誉以调动其积极性","遇分歧时当众与领队争辩以明是非"],"answer":"D","explain":"协作要尊重磋商、争取游客支持并避免正面冲突，当众争辩只会激化矛盾。","spot":"","cat":"服务规范"},{"type":"单选","stem":"全程陪同导游的主要职责不包括？","options":["实施旅游接待计划","做好联络工作","做好组织协调工作","承担各站景点的现场讲解"],"answer":"D","explain":"全陪负责实施计划、联络、组织协调、维护安全与宣传调研；景点讲解由地陪承担。","spot":"","cat":"服务规范"},{"type":"单选","stem":"导游与司机合作时，下列做法不恰当的是？","options":["及时向司机通报相关信息","协助司机做好安全行车工作","征求司机对日程安排的意见","行车途中与司机长时间交谈以活跃气氛"],"answer":"D","explain":"导游应通报信息、协助安全行车、征求意见；行车中长谈易分散司机注意力。","spot":"","cat":"服务规范"},{"type":"单选","stem":"景区导游的主要职责之一是？","options":["提供导游讲解","核定景区门票价格","审批景区建设项目","管理景区商户经营"],"answer":"A","explain":"景区导游负责讲解、安全提示和知识宣传；票价核定、项目审批、商户管理非其职责。","spot":"","cat":"服务规范"},{"type":"单选","stem":"全陪在离站服务阶段，需要与地陪当面核对的内容是？","options":["交通票、离港时间及地点","行李的重量和体积","游客的健康状况","下一站的餐饮标准"],"answer":"A","explain":"离站时全陪与地陪当面核对交通票、离港时间地点，并交接票据与行李托运单。","spot":"","cat":"服务规范"},{"type":"单选","stem":"团队入住饭店时，下列不属于地陪服务工作内容的是？","options":["协助办理入住手续","介绍饭店设施及注意事项","确定叫早时间","代替游客保管贵重物品"],"answer":"D","explain":"入住服务含协助办手续、介绍设施、带好用第一餐、处理问题、照顾行李、定叫早。","spot":"","cat":"服务规范"},{"type":"判断","stem":"地陪应在游客入住饭店后确定叫早时间，并照顾行李进房。","options":["正确","错误"],"answer":"A","explain":"叫早时间与行李进房均属入住环节服务，须与饭店总台、行李员逐项落实。","spot":"","cat":"服务规范"},{"type":"单选","stem":"旅游者情绪由高涨转为消极烦恼，其原因一般不包括？","options":["旅游者的需求未得到满足","旅游团中出现了矛盾","旅游者本人或其家庭方面的原因","导游讲解中使用了类比法"],"answer":"D","explain":"情绪变化多因需求未满足、团内矛盾、个人或家庭原因；类比法是正常讲解方法。","spot":"","cat":"服务规范"},{"type":"多选","stem":"关于握手礼仪，下列属于导游应注意的禁忌的有（多选）","options":["用左手与他人相握","握手时戴手套或墨镜","握手时把另一只手插在口袋里","仅握住对方手指尖"],"answer":"ABCD","explain":"左手被视为不洁，戴手套墨镜、插兜、只捏指尖均属禁忌；女士社交场合可戴薄纱手套。","spot":"","cat":"服务规范"},{"type":"单选","stem":"游客因同室人夜间打鼾严重要求换房，地陪的正确处理是？","options":["饭店有空房可协助满足，房费由提出换房的游客自理","饭店有空房可协助满足，房费由旅行社承担","直接拒绝，劝其自行克服","请全陪把自己的房间让给该游客"],"answer":"A","explain":"换房可协助满足但费用由提出者自理；因生活习惯差异应先请领队在内部调整。","spot":"","cat":"应变能力"},{"type":"判断","stem":"游客因生活习惯不同要求调房，地陪应先请领队在内部调整，调不成再视住房情况解决。","options":["正确","错误"],"answer":"A","explain":"处理顺序为先内部调整、后饭店协调，费用原则上由提出换房要求的客人自理。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客付费住单间致自然单间取消后，领队要求退还自然单间房费，地陪应？","options":["耐心解释：自然单间原为接待社损失，取消只是减少损失","立即退还该笔房费以示诚意","请领队直接向饭 ,{"type":"判断","stem":"遇到浓烟时，应用浸湿的衣物披裹身体、掩捂口鼻，顺墙弯腰低姿转移。","options":["正确","错误"],"answer":"A","explain":"浓烟中用湿衣掩捂口鼻、贴墙弯腰低姿转移，可减少烟气吸入，是正确逃生方法。","spot":"","cat":"应变能力"},{"type":"多选","stem":"饭店发生火灾时，导游应采取的处置措施有（多选）","options":["立即拨打119报警","火速通知全团客人","组织指挥客人通过安全通道疏散避灾","先清点、搬运客人行李，再组织客人撤离"],"answer":"ABC","explain":"火灾时应立即报警、通知全团并组织经安全通道疏散，不能因清点行李延误撤离。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客餐后出现头晕恶心、上吐下泻、四肢无力等疑似食物中毒症状，导游为缓解毒性应首先？","options":["立即给患者服用止泻药","让患者大量进食以稀释毒素","设法为患者催吐，并让其多喝水加速排泄","让患者平躺休息，观察后再作处理"],"answer":"C","explain":"应立即采取催吐、多喝水加速排泄的排毒措施，并尽快送医，不能自行用药或拖延。","spot":"","cat":"应变能力"},{"type":"判断","stem":"送疑似食物中毒的游客就医时，只须口头告知旅行社，不必请医生开具诊断证明。","options":["正确","错误"],"answer":"B","explain":"诊断证明是认定食物中毒、追究供餐单位责任的依据，导游必须请医生出具，不能省略。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客醉酒后摔碎酒杯、喧闹不休，对深度醉酒神志不清、无法自制的闹事者，导游应？","options":["将其独自送回房间休息","强行灌水或喂食为其解酒","当场宣布其行为违法并予以罚款","请有关人员协助临时隔离看管，并请医务人员设法为其醒酒"],"answer":"D","explain":"应先好言规劝制止；对神志不清者须协助隔离看管并由医务人员醒酒，导游无处罚权。","spot":"","cat":"应变能力"},{"type":"判断","stem":"醉酒者神志清醒后，导游应说明饮酒过量的危害，并要求其对扰乱公共秩序、伤害他人身体和毁坏物品等过失行为承担相应法律责任。","options":["正确","错误"],"answer":"A","explain":"待其清醒后应讲明危害，并明确其应承担相应法律责任，既教育当事人又便于后续处理。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客晕车呕吐污染车内设施并与司机发生矛盾，导游应安排司机把车停靠在？","options":["最近的服务区","隧道内的紧急停车带","行车道的路肩","高速公路应急车道"],"answer":"A","explain":"处理此类问题须停靠最近服务区，应急车道、隧道停车带、路肩停车均违法且危险。","spot":"","cat":"应变能力"},{"type":"判断","stem":"为节省时间，导游可安排司机将车停在应急车道处理游客呕吐污染车内的问题。","options":["正确","错误"],"answer":"B","explain":"应急车道不得随意停车，应驶入最近服务区处理，这是处理此类问题的明确要求。","spot":"","cat":"应变能力"},{"type":"多选","stem":"游客晕车呕吐与司机发生矛盾，导游的正确做法有（多选）","options":["请游客下车暂时休息，呼吸新鲜空气","安抚司机，并及时同司机一起处理车内被污染的地方","处理完毕后调节游客心情，尽量化解双方矛盾","当场批评司机服务意识差，要求其向游客道歉"],"answer":"ABC","explain":"应让游客下车透气、与司机共同清理并化解矛盾；当众批评司机只会激化双方冲突。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客因团队餐质量不好要求加菜但不愿承担任何费用，导游应？","options":["直接拒绝，并说明团队餐标准不可变更","向客人说明原因，并与餐厅负责人联系，尽量满足客人的要求","由导游个人垫付加菜费用","答应加菜，事后由餐厅向客人追收费用"],"answer":"B","explain":"应先说明原因并联系餐厅尽量满足；无法满足时向旅行社说明并申请调换团队餐厅。","spot":"","cat":"应变能力"},{"type":"判断","stem":"如餐厅无法满足游客加菜的要求，导游应向旅行社说明情况，并申请调换团队餐厅。","options":["正确","错误"],"answer":"A","explain":"餐质问题无法解决时应上报旅行社并申请调换团队餐厅，而不是由导游个人承担。","spot":"","cat":"应变能力"},{"type":"单选","stem":"游客对导游的讲解提出异议，导游首先应？","options":["不予理会，按原讲稿继续讲解","立即与游客辩论，澄清事实","耐心听取游客的意见和要求","请领队出面制止游客发言"],"answer":"C","explain":"应耐心听取意见，不与游客争论辩解，从中吸取合理成分，观点错误可私下交流。","spot":"","cat":"应变能力"},{"type":"多选","stem":"游客对导游讲解提出异议时，导游的正确做法有（多选）","options":["耐心听取游客的意见和要求","不要与游客争论、辩解，从中吸取合理成分","确认游客观点错误后，当众予以纠正","以游客的观点为中心进行讲解，满足合理需求"],"answer":"ABD","explain":"听取意见、不争辩、以游客合理需求为中心均正确；观点错误应私下交流而非当众纠正。","spot":"","cat":"应变能力"},{"type":"单选","stem":"发现游客溺水，将其救上岸后导游首先应？","options":["立即进行胸外按压","立即将其倒挂控水","立即背起送医","将其平放在地面上，撬开嘴清理口鼻脏东西，保证呼吸道畅通"],"answer":"D","explain":"上岸后应先平放、清理口鼻异物以畅通呼吸道，这是后续救护措施的基础。","spot":"","cat":"应变能力"},{"type":"多选","stem":"发现游客溺水时，可采取的救护方法有（多选）","options":["不会游泳的导游立即下水徒手施救","大声呼救，寻求帮助","抛送救生圈等物品给溺水者","溺水者上岸后清理其口鼻脏物，保证呼吸道畅通"],"answer":"BCD","explain":"应抛送救生物品、呼救求援并做好岸上急救；不会游泳者贸然下水只会徒增伤亡。","spot":"","cat":"应变能力"},{"type":"单选","stem":"接近用餐时间或到达餐厅后旅游者提出换餐，而该餐厅有这项服务，地陪应？","options":["协助解决","不予接受，请其自行处理","答应换餐，差价由导游承担","要求其另付全额餐费后再换"],"answer":"A","explain":"餐厅有此服务时地陪应协助解决；无此服务可不接受但须解释，坚持换餐则建议零点自理。","spot":"","cat":"应变能力"},{"type":"判断","stem":"旅游者坚持换餐时，可建议其到零点餐厅点菜，费用由地陪承担、原餐费全额退还。","options":["正确","错误"],"answer":"B","explain":"零点餐厅用餐费用应由旅游者自理，原餐费不退，由地陪承担并退费不符合规定。","spot":"","cat":"应变能力"},{"type":"单选","stem":"旅游者要求导游带他乘坐一次地铁，导游应？","options":["同意，但不必特别提醒安全事项","时间允许且非上下班高峰期可满足，并提醒注意人身安全和财物安全","让其自行前往，导游不陪同也不提醒","一律拒绝，以免发生意外承担责任"],"answer":"B","explain":"时间允许且避开上下班高峰可满足其要求，同时必须提醒注意人身安全和财物安全。","spot":"","cat":"应变能力"},{"type":"判断","stem":"只要旅游者提出乘坐地铁的要求，导游无论时间是否允许都必须满足。","options":["正确","错误"],"answer":"B","explain":"满足该要求以时间允许、避开上下班高峰为前提，并非任何情况下都必须满足。","spot":"","cat":"应变能力"},{"type":"单选","stem":"旅游者因生活习惯不愿与其他人一起用餐、要求单独用餐，地陪首先应？","options":["立即协助联系餐厅，并告知餐费自理","同意单独用餐，原餐费照退","耐心劝解，并请领队进行协调","直接拒绝，要求其随团用餐"],"answer":"C","explain":"应先耐心劝解并请领队协调；无效再协助联系餐厅，餐费自理且原餐费不退。","spot":"","cat":"应变能力"},{"type":"判断","stem":"劝说及协调无效、旅游者仍坚持单独用餐的，地陪协助与餐厅联系，并告知餐费自理、原餐费不退。","options":["正确","错误"],"answer":"A","explain":"坚持单独用餐属旅游者个人要求，地陪协助联系餐厅，费用自理、原餐费不退。","spot":"","cat":"应变能力"},{"type":"单选","stem":"晚餐后旅游者想去酒吧街自由活动，天气好又不太晚，导游应？","options":["同意并全程陪同，费用由导游承担","婉言拒绝，晚间一律不得自行外出","同意，但要求其交出证件由导游保管","可满足其要求，提醒带上酒店卡片，不离开太远、不带贵重物品、不到秩序混乱场所、不太晚回酒店"],"answer":"D","explain":"天气好又不太晚可满足要求，但须提醒带酒店卡片、不带贵重物品、不去混乱场所、早归。","spot":"","cat":"应变能力"},{"type":"多选","stem":"旅游者晚间自行外出自由活动，导游应提醒的内容有（多选）","options":["不要携带贵重物品","不要到秩序混乱的场所，不要太晚回酒店","不要离开太远","带上酒店卡片"],"answer":"ABCD","explain":"四项均属夜间外出的安全提醒，目的是保障旅游者的人身安全与财物安全。","spot":"","cat":"应变能力"},{"type":"单选","stem":"旅游者随团购物所买鼻烟壶有质量问题，请求导游帮忙办理退货或更换，导游应？","options":["积极协助，必要时陪同前往购物商店，设法帮助解决","仅提供商店电话，由旅游者自行交涉","告知购物属个人行为，导游不承担责任","建议旅游者回国后再行投诉"],"answer":"A","explain":"对旅游者购物出现的质量问题，导游应积极协助，必要时陪同前往商店帮助解决。","spot":"","cat":"应变能力"},{"type":"判断","stem":"旅游者所购商品出现质量问题要求退换时，导游可以以“购物自愿”为由不予协助。","options":["正确","错误"],"answer":"B","explain":"导游应积极协助退换，必要时陪同前往购物商店，不能以购物自愿为由推卸责任。","spot":"","cat":"应变能力"},{"type":"单选","stem":"旅游者请导游代购暂时无货的丝绸睡衣、蚕丝被并托运出境，地陪应？","options":["婉言拒绝，不再提供任何帮助","请示接待社领导，被批准后接受此项委托","直接答应并先行垫付货款","以个人名义购买后自行邮寄"],"answer":"B","explain":"受托代购托运须先请示接待社领导，获批准后方可接受，导游个人不得擅自承办。","spot":"","cat":"应变能力"},{"type":"多选","stem":"地接导游接受旅游者代购托运委托后，应做的工作有（多选）","options":["收取购货款、托运费、保险费、手续费等必要钱款","请旅游者写出委托书","旅游团离开后将购货发票、托运单等原件寄送旅游者，复印件交旅行社保存","告知定点商店基本都有托运服务"],"answer":"ABCD","explain":"代购托运须有委托书、收齐费用，可借助定点商店托运，事后寄原件、留复印件备查。","spot":"","cat":"应变能力"},{"type":"单选","stem":"旅游团提出变更计划或活动日程的要求，全程导游应？","options":["一律拒绝，不作任何解释","让游客直接与组团社交涉","严守合同、落实计划，视客观条件是否允许决定是否满足，并说明理由","一律答应，以让游客满意为先"],"answer":"C","explain":"应严守合同落实计划，按客观条件决定是否满足并说明理由，特殊情况上报旅行社。","spot":"","cat":"应变能力"},{"type":"判断","stem":"旅游者提出变更计划的要求遇到特殊情况时，全程导游可自行决定变更，无须上报旅行社。","options":["正确","错误"],"answer":"B","explain":"特殊变更须上报旅行社做特殊处理，导游不得自行决定更改合同约定的计划。","spot":"","cat":"应变能力"},{"type":"单选","stem":"接到全陪通知旅游团需提前一天离开本地，地接导游应？","options":["先按原计划执行，团队离站后再补办退房退餐","只通知下一站，其余事项由全陪负责","压缩全部参观项目，安排游客在酒店休息等候","最大限度地落实活动日程内容，及早办理退房、退车、退餐事宜，并及时通知下一站"],"answer":"D","explain":"应最大限度落实日程内容，及早办理退房、退车、退餐，并及时通知下一站。","spot":"","cat":"应变能力"},{"type":"判断","stem":"旅游团需提前一天离开本地时，地接导游应先取消全部参观游览项目，让游客在酒店等候。","options":["正确","错误"],"answer":"B","explain":"正确做法是最大限度地落实活动日程内容，而非取消全部项目让游客在酒店等候。","spot":"","cat":"应变能力"},{"type":"单选","stem":"中国公民出境旅游时丢失护照、签证，补办手续的第一步是？","options":["由当地接待社出具证明","先回国再向公安机关报失","直接到我国驻该国使、领馆领取旅行证","请当地警方补发新护照"],"answer":"A","explain":"应先由当地接待社出具证明，再持证明到当地警察机构报案取得遗失证明，逐步补办。","spot":"","cat":"应变能力"},{"type":"判断","stem":"回国后可凭中华人民共和国旅行证和境外警方的报失证明申请补发新护照。","options":["正确","错误"],"answer":"A","explain":"旅行证与境外警方报失证明是回国后申请补发新护照的凭证，符合规定的补办流程。","spot":"","cat":"应变能力"},{"type":"多选","stem":"嵩山地区的汉三阙包括（多选）","options":["少室阙","启母阙","太室阙","中岳庙阙"],"answer":"ABC","explain":"嵩山汉三阙指太室阙、少室阙、启母阙三座汉代石阙，中岳庙阙为干扰项，不属汉三阙。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选","stem":"龙门石窟所在之地在春秋战国时期称为什么？","options":["阙塞","伊阙","龙门关","伊川"],"answer":"B","explain":"香山与龙门山东西对峙、伊水从中流过形成门阙，故春秋战国时称伊阙，隋唐后称龙门。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选","stem":"龙门石窟始建于哪个时期？","options":["唐贞观年间","北魏永平年间","北魏太和年间","东魏天平年间"],"answer":"C","explain":"龙门石窟始建于北魏太和年间，历经东魏、西魏、北齐、隋、唐至宋，前后400多年。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选","stem":"龙门石窟中规模最大的造像是？","options":["万佛洞阿弥陀佛","宾阳中洞主佛","潜溪寺阿弥陀佛","奉先寺卢舍那大佛"],"answer":"D","explain":"奉先寺卢舍那大佛通高17.14米，头高4米，是龙门石窟所有窟龛中规模最大的造像。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选","stem":"被奉为“人文之祖”的伏羲氏，根据河图洛书画成了什么？","options":["八卦和九畴","河图和洛书","八卦和五行","九畴和六艺"],"answer":"A","explain":"中华民族最早的历史文献“河图洛书”出自洛阳，伏羲氏据此画成了八卦和九畴。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"龙门石窟群大部分集中在哪里？","options":["香山北麓的山谷中","伊水西岸的崖壁上","伊水东岸的崖壁上","伊水两岸的平地上"],"answer":"B","explain":"龙门石窟群大部分集中在伊水西岸龙门山的崖壁上，东山一带仅有少量窟龛。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选","stem":"除洛阳龙门石窟外，中国三大佛教石窟艺术宝库的另外两处是？","options":["敦煌莫高窟、天水麦积山石窟","敦煌莫高窟、杭州飞来峰造像","敦煌莫高窟、大同云冈石窟","大同云冈石窟、天水麦积山石窟"],"answer":"C","explain":"三大石窟为龙门石窟、敦煌莫高窟、大同云冈石窟，麦积山、飞来峰不在其列。","spot":"龙门石窟","cat":"景点知识"},{"type":"单选 点知识"},{"type":"单选","stem":"商朝在殷建都多少年，历经几代几王？","options":["255年，8代12王","255年，10代12王","275年，8代12王","254年，8代12王"],"answer":"A","explain":"建都255年、历8代12王，年数与代王数须成套记忆，勿拆分错配。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"殷墟宫殿宗庙遗址的大门是根据甲骨文中的哪个字设计建造的？","options":["门","宫","殷","商"],"answer":"A","explain":"整扇大门由3个甲骨文“门”字组成，两侧浮雕仿妇好墓龙形玉玦。","spot":"安阳殷墟","cat":"景点知识"},{"type":"判断","stem":"殷墟宫殿宗庙遗址大门由3个甲骨文“门”字组合而成。","options":["正确","错误"],"answer":"A","explain":"门数为3个，两侧浮雕仿1976年妇好墓出土的龙形玉玦放大制作。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"迄今世界上出土最大、最重的青铜礼器叫什么名字？","options":["后母戊鼎","四羊方尊","莲鹤方壶","司母辛鼎"],"answer":"A","explain":"后母戊鼎又称司母戊鼎，为最重青铜礼器；司母辛鼎出自妇好墓。","spot":"安阳殷墟","cat":"景点知识"},{"type":"判断","stem":"后母戊鼎真品现存于河南博物院。","options":["正确","错误"],"answer":"B","explain":"真品藏于中国国家博物馆，河南博物院所展为复制品，此处最易设错。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"1936年殷墟出土甲骨最多的一坑共出土多少片甲骨？","options":["17096片","15096片","17896片","17000片"],"answer":"A","explain":"YH127坑出土17096片，是殷墟出土甲骨最多的一坑，注意数字错位。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"殷墟科学发掘以来发现的唯一保存完整的商代王室成员墓葬叫什么？","options":["妇好墓","武官村大墓","后冈大墓","侯家庄一号墓"],"answer":"A","explain":"妇好墓是唯一保存完整的商代王室成员墓，其余王陵多遭盗扰。","spot":"安阳殷墟","cat":"景点知识"},{"type":"多选","stem":"古老的安阳有“三根”，是指（多选）","options":["文字之根","文化之根","民族之根","商业之根"],"answer":"ABC","explain":"“三根”为文字之根、文化之根、民族之根，与甲骨文、殷商文化呼应。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"被列为“中国20世纪100项考古重大发现”之首的是指哪里？","options":["殷墟","仰韶遗址","二里头遗址","郑州商城"],"answer":"A","explain":"殷墟居百项之首，并于2006年7月13日被列入《世界遗产名录》。","spot":"安阳殷墟","cat":"景点知识"},{"type":"判断","stem":"殷墟闻名于世的第一个原因是甲骨文。","options":["正确","错误"],"answer":"B","explain":"第一个原因是青铜器，甲骨文虽重要，却不是官方答案所指的“第一”。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"从平面上看，殷墟博物院老馆的造型酷似甲骨文中的哪个字？","options":["洹","殷","商","亳"],"answer":"A","explain":"老馆平面取甲骨文「洹」字之形，取殷墟依附洹河之意；「殷」「商」虽与殷墟相关，却非造型所本。","spot":"安阳殷墟","cat":"景点知识"},{"type":"判断","stem":"殷墟博物院老馆的造型取「殷墟依附洹河」之意，象征洹水在商文明发展过程中的重要作用。","options":["正确","错误"],"answer":"A","explain":"造型之「形」为洹字，「意」为依附洹河，形与意须对应，勿只记字形而漏掉寓意。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"鼎最初的作用是什么？","options":["烹煮食物","祭祀礼器","权力象征","储藏粮食"],"answer":"A","explain":"鼎本为炊器，夏商周才演变为权力象征；题干问「最初」，不能答成权力象征。","spot":"安阳殷墟","cat":"景点知识"},{"type":"判断","stem":"到夏商周时期，鼎已经成为权力的象征。","options":["正确","错误"],"answer":"A","explain":"鼎兼有炊器与权力象征两义，题干限定「夏商周」，与「最初用来烹煮食物」并不矛盾。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"殷墟景区由殷墟博物馆、宫殿宗庙遗址和下列哪一部分组成？","options":["王陵遗址","洹北商城","后冈遗址","甲骨窖穴遗址"],"answer":"A","explain":"景区三大板块为博物馆、宫殿宗庙遗址、王陵遗址；洹北商城、后冈属相邻考古遗址，最易误加。","spot":"安阳殷墟","cat":"景点知识"},{"type":"单选","stem":"历史上函谷关有秦关、汉关、魏关三处，其中最为著名的是哪一处？","options":["秦关","汉关","魏关","唐关"],"answer":"A","explain":"秦关为春秋战国时建关，地处长安古道、紧靠黄河，名气最大；汉关、魏关系后世移置。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"判断","stem":"秦关位于三门峡灵宝市北15千米处，距三门峡市约75千米。","options":["正确","错误"],"answer":"A","explain":"两个距离数字不要互换：至灵宝市北15千米，距三门峡市区约75千米。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"多选","stem":"函谷关以什么闻名于世？（多选）","options":["名人老子","名著《道德经》","名关函谷关","名楼瞻紫楼"],"answer":"ABC","explain":"函谷关「三名」指名人老子、名著《道德经》、名关本身；瞻紫楼只是关内观紫气的楼台。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"老子广场西侧的道德天书总长多少米？","options":["365米","265米","465米","565米"],"answer":"A","explain":"道德天书长365米，寓意一年365天日日感悟老子文化；勿与12.3米的高度互换。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"春申君黄歇是战国四君子中哪一国的公子？","options":["楚国","齐国","魏国","赵国"],"answer":"A","explain":"四君子与国别配对为齐孟尝君田文、楚春申君黄歇、魏信陵君魏无忌、赵平原君赵胜。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"判断","stem":"春申君黄歇是齐国人。","options":["正确","错误"],"answer":"B","explain":"黄歇为楚国人，齐国对应的是孟尝君田文；国别与封号错位是本题最常见的失分点。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"多选","stem":"函谷关城楼景区目前还保留的历史遗迹有哪些？（多选）","options":["古城墙","兵器库","函谷古道","太初宫"],"answer":"ABC","explain":"保留遗迹为古城墙、兵器库、函谷古道等；太初宫属纪念老子的建筑，不在所列遗迹之中。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"相传三门峡是哪个传说人物治水时用神斧将高山劈成三道峡谷而形成的？","options":["大禹","愚公","夸父","后羿"],"answer":"A","explain":"三门峡得名于大禹治水劈出人门、神门、鬼门；愚公移山故事在同省王屋山，勿张冠李戴。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"三门峡因「人门、神门、鬼门」三道峡谷得名，下列哪一项不属于这三门？","options":["龙门","人门","神门","鬼门"],"answer":"A","explain":"「三门」为人门、神门、鬼门；龙门在洛阳，属另一处名胜，最易被误添入三门之列。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"据联合国教科文组织统计，发行量在全球仅次于《圣经》、位居第二的是哪部书？","options":["《道德经》","《论语》","《孙子兵法》","《周易》"],"answer":"A","explain":"《道德经》五千言，全球发行量居第二；《论语》同为经典但排名不同，须盯住题干「第二」。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"判断","stem":"《道德经》的作者老子被国人尊称为「哲圣」。","options":["正确","错误"],"answer":"A","explain":"老子著《道德经》，被尊为「哲圣」；「哲圣」与「诗圣」「书圣」等称号易混，此处只对应老子。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"下列哪一事件曾发生在函谷关？","options":["周武王「出谷会师」","赤壁之战","官渡之战","巨鹿之战"],"answer":"A","explain":"函谷关著名战事有出谷会师、割城求和、二出函谷、张钫出关等；其余三战均不在函谷关。","spot":"三门峡函谷关","cat":"景点知识"},{"type":"单选","stem":"红旗渠景区位于河南省哪一座城市？","options":["林州市","辉县市","沁阳市","禹州市"],"answer":"A","explain":"红旗渠在安阳林州市，地处太行山东麓；辉县、沁阳同属豫北，地貌相近最易误选。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"红旗渠引的是哪条河的水？","options":["漳河","淇河","沁河","洛河"],"answer":"A","explain":"红旗渠引山西漳河水，即「引漳入林」；淇河、沁河虽在豫北，却非红旗渠水源。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"红旗渠的水最终汇入哪条河流？","options":["海河","黄河","淮河","卫河"],"answer":"A","explain":"引漳入林后水流归海河，并非黄河；水源与尾闾分属两题，两条水系最易混淆。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"红旗渠景区由分水苑、青年洞和下列哪一处景点组成？","options":["络丝潭","桃花谷","鹰咀山","太行平湖"],"answer":"A","explain":"三大景点为分水苑、青年洞、络丝潭；鹰咀山只是青年洞景区内的第一景，层级不同。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"红旗渠从开始建渠到竣工共用了多长时间？","options":["9年零5个月","8年零5个月","10年零5个月","9年零3个月"],"answer":"A","explain":"历时9年零5个月，约言也可称10年；「约10年」并不等于「10年零5个月」。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"修建红旗渠过程中共削平了多少座山头？","options":["1250座","1150座","1350座","1520座"],"answer":"A","explain":"削平山头1250座，与架设渡槽152座、开凿隧洞211个同属一组数据，切勿串位。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"修建红旗渠过程中共开凿了多少个隧洞？","options":["211个","152个","1250个","12408个"],"answer":"A","explain":"隧洞211个、渡槽152座、各类建筑物12408座，三个数字常在题中互换设陷。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"「青年洞」全长多少米？","options":["616米","516米","716米","816米"],"answer":"A","explain":"青年洞全长616米，是红旗渠总干渠上的咽喉工程；与616仅百位之差者最易误选。","spot":"红旗渠","cat":"景点知识"},{"type":"判断","stem":"「青年洞」全长516米。","options":["正确","错误"],"answer":"B","explain":"正确长度为616米；516米是常见干扰值，与616米仅百位不同，须精确记忆。","spot":"红旗渠","cat":"景点知识"},{"type":"多选","stem":"红旗渠精神包括下列哪些内容？（多选）","options":["自力更生","艰苦创业","团结协作","改革创新"],"answer":"ABC","explain":"红旗渠精神为自力更生、艰苦创业、团结协作、无私奉献；「改革创新」属其他精神表述。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"周恩来总理对外国友人说中国有两大奇迹，除南京长江大桥外还有哪一项？","options":["林州红旗渠","三门峡大坝","小浪底工程","安阳殷墟"],"answer":"A","explain":"两大奇迹指南京长江大桥与林州红旗渠；勿与省内三门峡、小浪底等水利工程相混。","spot":"红旗渠","cat":"景点知识"},{"type":"判断","stem":"1996年6月，江泽民视察红旗渠并题词「发扬自力更生、艰苦创业的红旗渠精神」。","options":["正确","错误"],"answer":"A","explain":"题词时间为1996年6月，题词只取前两句八字精神，勿擅自补入团结协作、无私奉献。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"进入青年洞景区的第一个景点叫什么名字？","options":["鹰咀山","络丝潭","分水苑","青年洞"],"answer":"A","explain":"鹰咀山是青年洞景区的第一景；络丝潭、分水苑是红旗渠另两处并列景点，不可混答。","spot":"红旗渠","cat":"景点知识"},{"type":"判断","stem":"络丝潭是进入青年洞景区的第一个景点。","options":["正确","错误"],"answer":"B","explain":"第一景是鹰咀山；络丝潭虽为红旗渠三大景点之一，却不在青年洞景区入口。","spot":"红旗渠","cat":"景点知识"},{"type":"单选","stem":"中组部命名的五位「共产党员优秀代表」中，不包括下列哪位？","options":["孔繁森","雷锋","王进喜","钱学森"],"answer":"A","explain":"五人为雷锋、焦裕禄、王进喜、史来贺、钱学森；孔繁森同为楷模却不在其列，最易误加。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"判断","stem":"王进喜是中共中央组织部命名的五位「共产党员优秀代表」之一。","options":["正确","错误"],"answer":"A","explain":"五位为雷锋、焦裕禄、王进喜、史来贺、钱学森，「铁人」王进喜确在其中。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"多选","stem":"焦裕禄纪念园景区主要建筑物由哪三部分组成？（多选）","options":["革命烈士纪念碑","焦裕禄烈士墓","焦裕禄纪念馆","焦裕禄故居"],"answer":"ABC","explain":"三部分为纪念碑、烈士墓、纪念馆；焦裕禄故居不在纪念园建筑之列，属常见误加项。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"现在的焦裕禄纪念馆于哪一年落成开馆？","options":["1994年","1984年","1990年","2004年"],"answer":"A","explain":"1994年5月14日落成，正值焦裕禄逝世30周年；年份与「30周年」可相互印证。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"判断","stem":"现在的焦裕禄纪念馆是为纪念焦裕禄逝世30周年而落成开馆的。","options":["正确","错误"],"answer":"A","explain":"1994年落成对应逝世30周年，周年数与年份要能对上，勿记成20周年或40周年。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"多选","stem":"焦裕禄在兰考需要面对并治理的「三害」是哪三害？（多选）","options":["风沙","盐碱","内涝","旱灾"],"answer":"ABC","explain":"兰考「三害」为风沙、盐碱、内涝；旱灾虽同为灾害，却不在「三害」的固定表述之内。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"临上任前，组织上告诉焦裕禄兰考的「三个最」，排在第一位的是什么？","options":["最苦","最穷","最难","最偏"],"answer":"A","explain":"三个最的顺序为最苦、最穷、最难，第一是最苦；顺序颠倒或位置互换最易失分。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"判断","stem":"组织上告诉焦裕禄，兰考的第一个「最」是最穷。","options":["正确","错误"],"answer":"B","explain":"第一最苦、第二最穷、第三最难；「最穷」居次，与「最苦」的位置最易互换。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"焦裕禄提出的「三同」做法是什么？","options":["同住、同吃、同劳动","同吃、同住、同学习","同住、同劳动、同开会","同吃、同劳动、同值班"],"answer":"A","explain":"三同为同住、同吃、同劳动，强调与群众同甘共苦；「同学习」「同开会」皆属臆加。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"1966年9月15日，毛泽东在天安门城楼上接见的是焦裕禄的哪位亲属？","options":["二女儿焦守云","长子焦国庆","妻子徐俊雅","大女儿焦守凤"],"answer":"A","explain":"被接见的是二女儿焦守云；焦守凤、焦国庆、徐俊雅均为其亲属，身份最易张冠李戴。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"判断","stem":"2014年3月，习近平视察兰考，提出从公仆情怀、求实作风、奋斗精神、道德情操四方面学习焦裕禄精神。","options":["正确","错误"],"answer":"A","explain":"四方面依次为公仆情怀、求实作风、奋斗精神、道德情操，内涵与顺序都要对应准确。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"判断","stem":"1966年2月7日《人民日报》发表的长篇通讯题为《县委书记的榜样——焦裕禄》。","options":["正确","错误"],"answer":"A","explain":"同日还配有社论《向毛泽东同志的好学生焦裕禄同志学习》，一社论一通讯切勿混称。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"1966年2月7日刊发《县委书记的榜样——焦裕禄》长篇通讯的是哪家报纸？","options":["《人民日报》","《河南日报》","《光明日报》","《解放军报》"],"answer":"A","explain":"社论与长篇通讯均发表于1966年2月7日《人民日报》，勿因写兰考而误选河南日报。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"焦裕禄在兰考工作了多长时间？","options":["一年零三个月","一年零五个月","两年零三个月","一年零一个月"],"answer":"A","explain":"1962年12月到兰考、1964年5月病逝，前后一年零三个月，时间虽短而事迹厚重。","spot":"焦裕禄纪念园","cat":"景点知识"},{"type":"单选","stem":"小浪底工程的拦河大坝是我国江河上修建的最大的什么坝？","options":["土石坝","混凝土重力坝","浆砌石坝","橡胶坝"],"answer":"A","explain":"小浪底拦河大坝为土石坝，南接祁山、北接王屋；「最大土石坝」是其标志性定位。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"小浪底拦河大坝的坝顶长多少米？","options":["1317米","1173米","1517米","1731米"],"answer":"A","explain":"坝顶长1317米、宽15米，两个数字易互换；记住「长逾千米、宽十余米」的比例关系。","spot":"王屋山","cat":"景点知识"},{"type":"多选","stem":"下列哪些唐代诗人曾先后来王屋山游历并留下名篇？（多选）","options":["李白","杜甫","韩愈","苏轼"],"answer":"ABC","explain":"李白、杜甫、白居易、李商隐、韩愈均曾游王屋；苏轼为宋人，时代不合，最易误选。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"王屋山主峰天坛峰的海拔是多少米？","options":["1715米","1571米","1815米","1615米"],"answer":"A","explain":"天坛峰海拔1715米；1571米是数字颠倒的干扰值，注意「17」在前、「15」在后。","spot":"王屋山","cat":"景点知识"},{"type":"多选","stem":"王屋山著名的「四大天象奇观」包括下列哪些？（多选）","options":["天坛云海","天坛倒影","天坛日出","天坛佛光"],"answer":"ABC","explain":"四大奇观为天坛云海、天坛倒影、天坛日出、王母仙灯；「佛光」属其他名山景象。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"记载王屋山「山形如王者之屋」而得名的我国最早地理志是哪一部？","options":["《禹贡》","《山海经》","《水经注》","《徐霞客游记》"],"answer":"A","explain":"出处为《禹贡》，是我国最早的地理志；《山海经》《水经注》虽记山川，却非此说出处。","spot":"王屋山","cat":"景点知识"},{"type":"判断","stem":"王屋山因山形如「王者之屋」而得名，此说见于《禹贡》。","options":["正确","错误"],"answer":"A","explain":"「王者之屋」为名称由来，出处为《禹贡》，名称与典籍要成对记忆，勿错挂他书。","spot":"王屋山","cat":"景点知识"},{"type":"多选","stem":"阳台宫坐北朝南、依山而建，沿中轴线依次有哪些建筑？（多选）","options":["山门","三清殿","玉皇阁","西王母殿"],"answer":"ABC","explain":"中轴线为山门、三清殿、玉皇阁、长生殿遗址；西王母殿在两侧廊房之列，不在中轴。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"王屋山主峰为什么被称为「天坛峰」？","options":["相传黄帝在此设坛祭天","相传大禹在此治水","相传老子在此著经","相传愚公在此移山"],"answer":"A","explain":"天坛峰得名于黄帝设坛祭天；老子著经在函谷关，愚公移山属王屋传说，三者最易混。","spot":"王屋山","cat":"景点知识"},{"type":"多选","stem":"王屋山景区最著名的道教三宫，除阳台宫外还有哪二宫？（多选）","options":["迎恩宫","紫微宫","上清宫","太清宫"],"answer":"AB","explain":"三宫为阳台宫、迎恩宫、紫微宫；上清宫、太清宫属其他道教宫观名号，最易混入。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"盛赞「济源山水好」的是哪位名人？","options":["白居易","李白","杜甫","韩愈"],"answer":"A","explain":"「济源山水好」出自白居易；李白、杜甫、韩愈也曾游王屋，四人并列时须辨作者。","spot":"嵖岈山","cat":"景点知识"},{"type":"单选","stem":"王屋山运动大约发生在距今多少年前？","options":["14.5亿年前","12.5亿年前","16.5亿年前","18.5亿年前"],"answer":"A","explain":"王屋山运动距今约14.5亿年，数量级为「亿年」；勿与万年级的近期地质事件相混。","spot":"王屋山","cat":"景点知识"},{"type":"单选","stem":"嵖岈山景区位于河南省哪个地级市境内？","options":["周口市","驻马店市","信阳市","南阳市"],"answer":"B","explain":"嵖岈山在驻马店遂平县境内；周口有太昊陵、信阳有鸡公山，同省地名易混。","spot":"嵖岈山","cat":"景点知识"},{"type":"多选","stem":"嵖岈山主景区由下列哪些部分构成？（多选）","options":["蜜蜡山","南山","六峰山","鸡公山"],"answer":"ABC","explain":"主景区含蜜蜡山、南山、北山、六峰山、天磨峰及秀蜜湖等四湖；鸡公山属信阳。","spot":"嵖岈山","cat":"景点知识"},{"type":"多选","stem":"下列属于驻马店风物特产的有哪些？（多选）","options":["汝瓷","泌阳花菇","小磨香油","棠溪宝剑"],"answer":"BCD","explain":"驻马店三绝为泌阳花菇、小磨香油、棠溪宝剑；汝瓷产于汝州，不属驻马店。","spot":"嵖岈山","cat":"景点知识"},{"type":"判断","stem":"嵖岈山南北山的分界线是蜜蜡峰下的秀蜜湖水系。","options":["正确","错误"],"answer":"B","explain":"南北山分界是石猴院北侧的深峡谷，即石猴院断裂带，不是秀蜜湖水系。","spot":"嵖岈山","cat":"景点知识"},{"type":"单选","stem":"嵖岈山的山体属于哪种岩石类型？","options":["石灰岩","砂岩","花岗岩","玄武岩"],"answer":"C","explain":"嵖岈山属花岗岩山体，球状风化造型奇特，不要与石灰岩喀斯特地貌相混。","spot":"嵖岈山","cat":"景点知识"},{"type":"判断","stem":"嵖岈山是《西游记》续集电视剧的外景拍摄地之一。","options":["正确","错误"],"answer":"A","explain":"嵖岈山因《西游记》续集电视剧在此取景而神话色彩浓郁，并非作者故里。","spot":"嵖岈山","cat":"景点知识"},{"type":"单选","stem":"驻马店哪个地方享有“小延安”之称？","options":["确山县竹沟镇","遂平县嵖岈山镇","泌阳县铜山乡","汝南县汝宁镇"],"answer":"A","explain":"“小延安”指确山县竹沟镇，抗战时期中原局所在地，勿与遂平嵖岈山镇混淆。","spot":"嵖岈山","cat":"景点知识"},{"type":"判断","stem":"蜜蜡峰因圆柱形山峰常有线状风化裂隙、形似蜂蜜涂壁而得名。","options":["正确","错误"],"answer":"A","explain":"名称源于线状风化裂隙如蜂蜜涂壁的形态，并非因山中出产蜜蜡。","spot":"嵖岈山","cat":"景点知识"},{"type":"单选","stem":"我国历史上第一个人民公社成立在哪里？","options":["新乡七里营人民公社","遂平县嵖岈山卫星人民公社","信阳新县千斤人民公社","安阳红旗人民公社"],"answer":"B","explain":"1958年遂平县嵖岈山卫星人民公社是我国第一个人民公社，注意“卫星”二字。","spot":"嵖岈山","cat":"景点知识"},{"type":"单选","stem":"万人洞曾是明末哪位农民起义军首领的藏兵洞？","options":["张献忠","高迎祥","李自成","罗汝才"],"answer":"C","explain":"万人洞为李自成藏兵洞；张献忠、高迎祥、罗汝才同为明末起义首领，极易混。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊伏羲氏出生于哪里？","options":["河南淮阳","河南新郑","甘肃天水","山东曲阜"],"answer":"C","explain":"伏羲生于甘肃天水、葬于河南淮阳，“生在天水、葬在淮阳”要成对记忆。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"多选","stem":"太昊伏羲陵中轴线上由南向北的建筑包括下列哪些？（多选）","options":["午朝门","道仪门","统天殿","大成殿"],"answer":"ABC","explain":"中轴线依次为午朝门、玉带桥、道仪门、先天门、太极门、统天殿、显仁殿、太始门；大成殿属文庙。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"八卦中的“三才”指天、地、人，“五行”指金、木、水、火、土。","options":["正确","错误"],"answer":"A","explain":"三才为天、地、人，五行为金、木、水、火、土，两套概念不可互换。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"朱镕基总理1997年参观太昊陵时亲笔题写了哪四个字？","options":["人文始祖","羲皇故都","华夏先驱","九州圣迹"],"answer":"B","explain":"1997年题写“羲皇故都”；“华夏先驱、九州圣迹”是周口美誉，并非题词。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"多选","stem":"下列属于伏羲氏功绩的有哪些？（多选）","options":["结网罟","养牺牲","制嫁娶","造指南车"],"answer":"ABC","explain":"结网罟、养牺牲、定姓氏、制嫁娶均为伏羲功绩；造指南车是黄帝的功绩。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊陵内保存最古老的建筑是哪一座？","options":["统天殿","显仁殿","太始门","午朝门"],"answer":"C","explain":"太始门是陵内现存最古老建筑；统天殿虽体量最大，却建于明代。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊陵庙会每年举办的时间是？","options":["农历正月初一至正月十五","农历二月初二至三月初三","农历三月初三至四月初三","农历六月初一至六月初十"],"answer":"B","explain":"庙会为农历二月初二至三月初三，以二月初二最为隆重，起止月份不要颠倒。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"淮阳的旅游资源特征可概括为“一山一水一古陵”。","options":["正确","错误"],"answer":"B","explain":"应为“一城一湖一古陵”，即陈州城、龙湖与太昊陵，“山、水”是错误替换。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"被尊为中国第一个姓氏的是？","options":["姜姓","姬姓","风姓","妫姓"],"answer":"C","explain":"伏羲风姓为中国第一个姓氏；姜、姬为炎黄之姓，妫姓与舜及陈姓相关。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"周口有“华夏先驱、九州圣迹”的美誉。","options":["正确","错误"],"answer":"A","explain":"周口为伏羲故都、老子故里，享有“华夏先驱、九州圣迹”美誉。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊陵内体积最大、等级最高的重点建筑是哪一座？","options":["显仁殿","统天殿","先天门","太始门"],"answer":"B","explain":"统天殿又称大殿，建于明代，是陵庙内体积最大、等级最高的建筑。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"太昊陵的第一道大门是太极门，俗称“午门”。","options":["正确","错误"],"answer":"B","explain":"第一道大门是午朝门，俗称午门；太极门在先天门之后，位置靠里。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"伏羲画八卦、定姓氏、制礼仪、定嫁娶，实现了中华民族的什么？","options":["第一次大融合","第一次大一统","第一次大分封","第一次大迁徙"],"answer":"A","explain":"伏羲诸般创制促成中华民族第一次大融合，“大一统”是后世概念。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"太昊伏羲陵位于周口淮阳县城北关、古蔡河的北岸。","options":["正确","错误"],"answer":"A","explain":"陵址在淮阳县城北关、古蔡河北岸，“北关”“北岸”两个方位要点一起记。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"伏羲氏生活的时期是由父系氏族向母系氏族过渡的时期。","options":["正确","错误"],"answer":"B","explain":"伏羲氏处于母系氏族向父系氏族过渡时期，方向颠倒即成错项。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊伏羲陵周围最有特色的泥塑小玩具叫什么名字？","options":["泥咕咕","惠山泥人","泥泥狗","凤翔泥塑"],"answer":"C","explain":"太昊陵周边泥塑玩具称泥泥狗；泥咕咕为浚县特产，两者极易混淆。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"百家姓中陈姓的始祖是谁？","options":["陈完","妫满","虞舜","陈霸先"],"answer":"B","explain":"陈姓始祖为妫满，即陈胡公，受封于陈；陈完为其后裔，不是始祖。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"太昊伏羲氏安葬于什么地方？","options":["甘肃天水","河南新郑","山东曲阜","河南淮阳"],"answer":"D","explain":"伏羲葬于河南淮阳，出生地则是甘肃天水，生死两地要对号入座。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"百家姓中陈姓的发源地在哪儿？","options":["郑州新郑","商丘睢阳","周口淮阳","周口鹿邑"],"answer":"C","explain":"陈姓发源于周口淮阳，始祖妫满；鹿邑是老子故里，不要张冠李戴。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"判断","stem":"太昊伏羲陵整个陵庙分为内城、外城、紫禁城三道皇城，总占地面积875亩。","options":["正确","错误"],"answer":"A","explain":"陵庙分三道皇城，占地875亩，“785亩”一类相邻数字是常见干扰。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"淮阳被称为中华姓氏起源地，主要是因为伏羲在这里做了什么？","options":["画八卦、造书契","正姓氏、制嫁娶","结网罟、养牺牲","作甲历、兴礼乐"],"answer":"B","explain":"伏羲“正姓氏、制嫁娶”，开创中华姓氏6000多年历史；其余三组亦属其功绩。","spot":"太昊伏羲陵","cat":"景点知识"},{"type":"单选","stem":"河南博物院创建于哪一年？","options":["1919年","1927年","1937年","1949年"],"answer":"B","explain":"1927年创建，前身为河南省博物馆，由冯玉祥主导建立。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"河南博物院最初建馆时的馆址在哪个城市？","options":["郑州","洛阳","开封","安阳"],"answer":"C","explain":"最初馆址在开封，1998年5月1日新馆在郑州农业路落成并更名。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"河南博物院是哪一年从开封迁至郑州的？","options":["1954年","1961年","1968年","1974年"],"answer":"B","explain":"1961年由开封迁郑；1997年合并、1998年新馆开放，三个时间要分清。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"1997年7月与河南省博物馆合并、组建河南博物院的是哪一机构？","options":["河南古代艺术馆","中原石刻艺术馆","河南省文物研究所","郑州博物馆"],"answer":"B","explain":"1997年7月中原石刻艺术馆与河南省博物馆合并，成立河南博物院。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"河南博物院馆藏文物约有多少件（套）？","options":["7万余件","17万余件","27万余件","37万余件"],"answer":"B","explain":"馆藏17万余件（套），其中珍贵文物5万余件，两个数字别记反。","spot":"河南博物院","cat":"景点知识"},{"type":"多选","stem":"河南博物院藏品中下列哪些类别最具特色？（多选）","options":["史前文物","商周青铜器","历代陶瓷器","明清书画"],"answer":"ABC","explain":"特色藏品为史前文物、商周青铜器、历代陶瓷器、玉器及石刻，不含明清书画。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"河南博物院的基本陈列叫什么？","options":["《华夏古乐》","《大象中原》","《泱泱华夏 择中建都》","《中原文明之光》"],"answer":"C","explain":"基本陈列《泱泱华夏 择中建都》，取“择天下之中而立国”之意。","spot":"河南博物院","cat":"景点知识"},{"type":"多选","stem":"下列属于河南博物院“九大镇院之宝”的有哪些？（多选）","options":["贾湖骨笛","妇好鸮尊","玉柄铁剑","后母戊鼎"],"answer":"ABC","explain":"后母戊鼎藏中国国家博物馆；九大之宝还有云纹铜禁、莲鹤方壶、杜岭方鼎等。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"“九大镇院之宝”中，属于唐代的文物是哪一件？","options":["云纹铜禁","杜岭方鼎","莲鹤方壶","武则天金简"],"answer":"D","explain":"武则天金简为唐代；莲鹤方壶属春秋，杜岭方鼎属商代早期，云纹铜禁属西周。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"贾湖骨笛出土于河南哪一处遗址？","options":["渑池仰韶遗址","偃师二里头遗址","舞阳贾湖遗址","安阳殷墟"],"answer":"C","explain":"贾湖骨笛出土于舞阳贾湖遗址，仰韶、二里头、殷墟是另外三处著名遗址。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"贾湖骨笛用什么材料钻孔制成？","options":["羊骨","鹤类尺骨","象牙","陶土"],"answer":"B","explain":"以鹤类尺骨钻孔制成，多为七孔，可吹奏完整音阶，距今约八九千年。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"莲鹤方壶于何时、何地出土？","options":["1938年安阳侯家庄","1974年郑州商城遗址","1923年新郑李家楼郑公大墓","1982年登封峻极峰"],"answer":"C","explain":"1923年出土于新郑李家楼郑公大墓，共一对，分藏河南博物院与故宫博物院。","spot":"河南博物院","cat":"景点知识"},{"type":"判断","stem":"莲鹤方壶壶顶双层莲瓣中立一只展翅欲飞的鹤，被誉为“青铜时代的绝唱”。","options":["正确","错误"],"answer":"A","explain":"壶身饰蟠螭纹，莲瓣立鹤造型灵动，故有“青铜时代绝唱”之誉。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"武则天金简是何时、在何处被发现的？","options":["1974年郑州商城遗址","1982年登封嵩山峻极峰","1923年新郑李家楼","1938年安阳殷墟"],"answer":"B","explain":"1982年发现于登封嵩山峻极峰，是现存唯一与武则天直接相关的可移动文物。","spot":"河南博物院","cat":"景点知识"},{"type":"判断","stem":"武则天金简是武则天晚年投于嵩山的“除罪金简”，上刻文字祈求三官九府免罪。","options":["正确","错误"],"answer":"A","explain":"金简为投龙除罪之用，祈求对象是三官九府，注意“除罪”而非祈福延寿。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"被称为北宋五大名窑之首的汝窑，烧造时间约为多少年？","options":["约20年","约40年","约60年","约80年"],"answer":"A","explain":"汝窑居北宋五大名窑之首，烧造仅约20年，故传世品极为稀少。","spot":"河南博物院","cat":"景点知识"},{"type":"多选","stem":"关于汝窑天蓝釉刻花鹅颈瓶，下列说法正确的有（多选）","options":["釉色天蓝","带刻花装饰","是汝窑传世品中唯一一件刻花作品","属国宝级文物"],"answer":"ABCD","explain":"该瓶釉色天蓝并带刻花，为汝窑传世品中唯一刻花之作，属国宝级文物。","spot":"河南博物院","cat":"景点知识"},{"type":"单选","stem":"杜岭方鼎是哪一年出土的？","options":["1954年","1974年","1984年","1994年"],"answer":"B","explain":"1974年出土于郑州商城遗址，属商代早期大型青铜方鼎。","spot":"河南博物院","cat":"景点知识"},{"type":"判断","stem":"杜岭方鼎的发现为确认郑州商城是商代早期都城提供了重要实物证据，也证明郑州有3600年建城史。","options":["正确","错误"],"answer":"A","explain":"杜岭方鼎是郑州商城为商代早期都城的实证，据此确认郑州3600年建城史。","spot":"河南博物院","cat":"景点知识"}];
</script>
<script>
var QA=[{"q":"导游人员应具备较强的独立工作能力，主要表现在哪几个方面？","a":"（1）独立执行政策和独立进行宣传讲解的能力；\n（2） 较强的独立组织协调能力；\n（3） 善于和各种人打交道的能力；\n（4） 独立处理问题和事故的能力。","spot":"","cat":"服务规范"},{"q":"地陪接团前要做哪些准备工作？","a":"地陪在接团前必须要做好熟悉接待计划、落实接待事宜、语言和知识准备、物质准备、形象准备、心理准备六个方面的工作，避免发生服务质量事故。","spot":"","cat":"服务规范"},{"q":"地陪在前往旅游景区（点）途中的服务中，应介绍哪些内容？","a":"（1）重申当日活动安排；\n（2） 沿途风光导游；\n（3） 介绍旅游景点；\n（4） 活跃气氛。","spot":"","cat":"服务规范"},{"q":"抵达景区（点）时，地陪应给游客交代哪些游览注意事项？","a":"（1）抵达景区（点）时，下车前地陪要讲清并提醒游客记住旅游车的标志、车号、停车地点以及开车时间；\n（2） 在景区（点）示意图前，地陪应讲明游览线路、所需时间以＆集合时间和地点等；\n（3） 地陪还应向旅游者讲明游览参观中的有关注意事项。","spot":"","cat":"服务规范"},{"q":"结束当地的参观游览活动后，旅游团离店前，全陪、领队和地陪应确认的事项有哪些？","a":"（1）确认人数；\n（2） 确认行李件数，办妥交接手续；\n（3） 确认游客在饭店内的个人消费是否结清；\n（4） 提醒游客确认旅行证件和钱物是否带齐。","spot":"","cat":"服务规范"},{"q":"地陪在旅游大巴车内导游时应站在什么位置，为什么？","a":"地陪应站在旅游大巴车的前部、司机的附近，面对游客。这样地陪既能看到游客的表情和反应，游客也能看到地陪．可达到直接交流情感的目的。同时，便于随时与司机联系，以处理临时发生的事情。\n16. 《全陪H志》的内容有哪些？\n169\n（2） 旅游日程安排及旅程中的飞机、火车、航运等交通运输情况；\n（3） 各地接待服务质量；\n（4） 旅游者对旅游服务的满意程度；\n（5） 发生的问题及事故的处理经过；\n（6） 旅游者的反映及改进意见。","spot":"","cat":"服务规范"},{"q":"领队带团出境前，要召集本团旅游者开“出国旅游说明会”，其内容有哪些？","a":"（1）代表旅行社致欢迎词；\n（2） 进行旅游行程说明；\n（3） 介绍旅游目的地国家或地区基本情况及风俗习惯；\n（4） 提出要求，讲清注意事项；\n（5） 落实有关分房、交款、特殊要求等事项。","spot":"","cat":"服务规范"},{"q":"地陪致欢送词应包括哪些内容？","a":"（1） 回顾语：回顾旅游活动，加深游客对此次旅游经历的体验；\n（2） 感谢语：对游客及领队、全陪、司机的合作表示感谢；若旅游活动中有不尽如人意之处，可借此机会表示真诚的歉意；\n（3） 征求意见语：诚恳征询旅游者对接待工作的意见和建议；\n（4） 惜别语：表达友谊和惜别之情；\n（5） 祝愿语：表达美好的祝愿，期待再次相逢。","spot":"","cat":"服务规范"},{"q":"地接送团到达机场、火车站必须留出充裕的时间，具体要求是什么？","a":"乘出境航班提前3 小时或按航空公司规定的时间到达机场；乘国内航班提前2 小时到达机场；乘火车提前1小时到达火车站。","spot":"","cat":"服务规范"},{"q":"导游人员树立良好形象的途径有哪些？","a":"（1）重视第一印象；\n（2） 保持行中形象；\n（3） 强化最终印象；\n（4） 多提供个性化服务；\n（5） 多同游客进行沟通。","spot":"","cat":"服务规范"},{"q":"导游人员在处理旅游者个别要求时，应遵循哪些原则？","a":"（1） 符合法律法规的原则；","spot":"","cat":"服务规范"},{"q":"0=====PDF_PAGE176=====第四章河南导游现场考试问答示范．．（2）“合理而可能”的原则；（3）尊重旅游者的原则；（4）公平对待的原则；（5）维护尊严的原则。22旅游者在旅游活动的各个阶段，其心理变化有哪些？","a":"（1）旅游初期阶段：主要表现为求安全、求新、求异心理。\n（2） 旅游中期阶段：主要表现为懒散心理、求全心理。\n（3） 旅游后期阶段：旅游者主要忙于个人事务。","spot":"","cat":"服务规范"},{"q":"导游人员对儿童的接待服务应注意哪几个方面？","a":"（1）关注儿童的安全；\n（2） 对儿童多给予关照。\n（3） 掌握儿童 “四不宜”原则：不宜突出儿童而冷落了成年旅游者；不宜给儿童买食物、玩具；不宜单独带旅游者的孩子外出活动；儿童生病时，不宜建议家长给儿童服药，更不准将自己的药品给儿童服用，应建议家长带孩子去医院治疗。\n（4） 注意儿童的收费标准。","spot":"","cat":"服务规范"},{"q":"从性格上看，旅游者一般划分为哪几类？","a":"（1）活泼型旅游者；\n（2） 急躁型旅游者；\n（3） 稳重型旅游者；\n（4） 忧郁型旅游者。","spot":"","cat":"服务规范"},{"q":"导游人员调整旅游者情绪的方法有哪些？","a":"（1）补偿法；\n（2） 转移注意法；\n（3） 暗示法。","spot":"","cat":"服务规范"},{"q":"导游人员对高龄旅游者的接待应注意哪几个方面？","a":"（1）妥善安排行程；\n（2） 做好提醒工作；\n（3） 注意放慢速度；\n（4） 耐心解答问题；\n（5） 预防游客走失；","spot":"","cat":"服务规范"},{"q":"1=====PDF_PAGE177=====；七勹导游服务能力一河南导游现场考试指南（第三版）沁（6）尊重西方传统。27.出境领队的主要职责包括哪些？","a":"（1） 落实旅游合同；\n（2） 做好组织和团结工作；\n（3） 全程服务，旅途向导；\n（4） 协调联络，维护权益，解决难题。","spot":"","cat":"服务规范"},{"q":"什么是画龙点睛法？","a":"即用精辟的词语概括旅游目的地或游览景点突出特征的讲解方法，有助于游客了解和认识其主要特征和精华所在。或者说是导游用凝练的词句概括所游览景点的独特之处，给游客留下突出印象的导游方法。","spot":"","cat":"服务规范"},{"q":"导游语言的基本要求是什么？","a":"（1）清楚；\n（2） 准确；\n（3） 生动：\n（4） 灵活。","spot":"","cat":"服务规范"},{"q":"《中华人民共和国旅游法》第四十一条对导游和领队从事业务活动作出了哪些要求？","a":"导游和领队从事业务活动，应当佩戴导游证、领队证，遵守职业道德，尊重旅游者的风俗习惯和宗教信仰，应当向旅游者告知和解释旅游文明行为规范，引导旅游者健康、文明旅游，劝阻旅游者违反社会公德的行为。导游和领队应当严格执行旅游行程安排，不得擅自变更旅游行程或者中止服务活动，不得向旅游者索取小费，不得诱导、欺骗、强迫或者变相强迫旅游者购物或者参加另行付费旅游项目。","spot":"","cat":"服务规范"},{"q":"导游人员对女性旅游者的接待应注意哪几个方面？","a":"（1）女士优先；\n（2） 适当购物；\n（3） 讲解生动；\n（4） 关注健康。","spot":"","cat":"服务规范"},{"q":"什么是突出祖点法？一般要突出的内容有哪些？","a":"突出重点法是导游人员在导游讲解中不面面俱到，而是突出某一方面的导游讲解方法。或者说是避免事无巨细，面面俱到，而是有主有次，有","spot":"","cat":"服务规范"},{"q":"2=====PDF_PAGE178=====第四章河南导游现场考试问答示范轻有重，以重点为主的讲解方法。应突出的内容包括以下四个方面：（1）突出景点的独特之处；（2）突出具有代表性的景观；（3）突出旅游者感兴趣的内容；（4）突出“……之最”。33．体态语言主要包括哪些？","a":"（1） 表情语；\n（2） 姿态语；\n（3） 手势语；\n（4） 服饰语；\n（5） 界域语。","spot":"","cat":"服务规范"},{"q":"出境领队接待前的准备工作有哪些？","a":"（1）听取出境旅游团队计涸人员关于该团情况介绍和移交有关资料；\n（2） 熟悉旅游接待计划；\n（3） 做好有关准备工作；\n（4） 开好出境前的说明会。","spot":"","cat":"服务规范"},{"q":"《中华人民共和国旅游法》是何时颁布的，何时起开始实施？","a":"《中华人民共和国旅游法》是2013年4 月25 日颁布的，2 013年10月1 日起实施。","spot":"","cat":"服务规范"},{"q":"导游常用的讲解方法有哪些？","a":"（1）概述法；\n（2） 分段讲解法；\n（3） 突出重点法；\n（4） 间答法；\n（5） 虚实结合法；\n（6） 触景生情法；\n（7） 制造悬念法；\n（8） 类比法；\n（9） 妙用数字法；\n(10) 画龙点睛法。","spot":"","cat":"服务规范"},{"q":"3=====PDF_PAGE179=====门导游服务能力—河南鳍现场响肆南（第三版）沁37.日常工作中的礼仪要求，导游应注意什么？","a":"（1） 遵守时间。守时是日常工作中最重要的礼节。导游必须及时把每天的活动时间安排清楚地告诉每个游客，并随时提醒。按照规定时间提前到达出发地点，如有特殊情况，必须耐心向客人解释以获得谅解。\n（2） 尊重游客。注意服务严谨，态度和蔼，尊重游客的宗教信仰和风俗习惯。\n（3） 注意细节。例如：导游不得用导游旗或手指清点旅游者人数，而应采取默数的方法；旅游车发动时，要提示客人坐稳扶好；导游不得随意进入旅游者房间；游客邀请品尝风味小吃时，切忌主宾颠倒，要注意进餐时的礼仪；等等。","spot":"","cat":"服务规范"},{"q":"全陪（地陪）与领队的协作，需要注意什么？","a":"（1）尊重领队，遇事与领队多磋商；\n（2） 关心领队生活，支持领队工作；\n（3） 多给领队荣誉，调动其积极性；\n（4） 灵活应变，掌握工作的主动权；\n（5） 争取游客支持，避免正面冲突。","spot":"","cat":"服务规范"},{"q":"全程陪同导游的主要职责是什么？","a":"（1）实施旅游接待计划；\n（2） 做好联络工作；\n（3）做好组织协调工作；\n（4） 维护安全、处理问题；\n（5） 宣传、调研工作。","spot":"","cat":"服务规范"},{"q":"导游应该怎样与司机合作？","a":"导游在旅游接待中居于主导地位，因此，导游应主动加强与司机的合作。\n（1） 及时向司机通报相关信息；\n（2） 协助司机做好安全行车工作；\n（3） 征求司机对日程安排的意见。","spot":"","cat":"服务规范"},{"q":"景区导游的主要职责是什么？","a":"（1）提供导游讲解；","spot":"","cat":"服务规范"},{"q":"4=====PDF_PAGE180=====第四章河南导游现场考试问答示范（2）做好安全提示；（3）宣传相关知识。42．全陪在离站服务阶段的工作内容主要有哪些？","a":"（1） 与地陪当面核对交通票、离港时间及地点；\n（2） 通告旅游者关于行李的规定，与地陪交接交通票及行李托运单；\n（3） 带领团队办理登机（火车、轮船）等手续；\n（4） 处理航班延误或取消等问题。","spot":"","cat":"服务规范"},{"q":"地陪导游在旅游团队入住饭店时需要做哪些服务工作？","a":"（1） 协助办理入住手续；\n（2） 介绍饭店设施及注意事项；\n（3） 带领旅游者用好第一餐；\n（4） 处理游客人住后的有关问题；\n（5） 照顾行李进房；\n（6） 确定叫早时间。","spot":"","cat":"服务规范"},{"q":"旅游者的情绪为什么会发生变化？","a":"旅游者开始时情绪高涨，心情愉快，游兴较高。随着时间推移，旅游者情绪可能变得消极、烦恼甚至愤想。出现这种变化的原因主要有：\n（1） 旅游者的需求未得到满足；\n（2） 旅游团中出现了矛盾；\n（3） 旅游者本人或其家庭方面原因。","spot":"","cat":"服务规范"},{"q":"关于握手礼仪，导游应注意哪些禁忌？","a":"导游应注意以下八大握手礼仪禁忌：\n（1） 不要用左手相握。阿拉伯人、印度人、泰国人视左手为不洁。\n（2） 同基督教信徒握手时不要与另外两人相握的手形成交叉状，他们视这种十字架形状为不吉。\n（3） 不要在握手时戴手套或墨镜，但允许女士在社交场合戴薄纱手套握手。\n（4） 不要在握手时把另一只手插在口袋里。\n（5） 不要在握手时面无表情、不置一词或长篇大论、点头哈腰，过分客套。\n（6） 不要在握手时仅握住对方手指尖，犹如保持距离，要握住整个\n175\n（7） 不要在握手时把对方的手拉过来、推过去，或上下左右多次抖动。\n（8） 不要拒绝和别人握手，手上有污渍也要和对方说清楚，以免造成误会。","spot":"","cat":"服务规范"},{"q":"某一旅游团中的一位客人，在入住酒店后的第二天早上就找到导游，提出要求说：”和我同住一个房间的李先生，夜间打鼾太厉害，闹得我根本无法入睡，请给我换一个房间吧。”作为地陪导游，怎样处理这件事？","a":"（1） 如酒店有空房间，可联系并予以满足，但房费由提出换房要求的客人自理。\n（2） 若因闹矛盾或生活习惯不同而要求调房的，应请领队在内部调整；若调不成，可根据饭店住房情况予以满足，但房费自理。","spot":"","cat":"应变能力"},{"q":"一个旅游团共有游客18人，因为出现了一个自然单间，所以共需住房10间。有一位游客提出自己愿意付费住一单间，于是便取消了房间安排中的自然单间。第二天，领队找到导游，要求将自然单间中的房费退还给他，地陪导游应如何处理？","a":"（1）耐心向领队解释，说明以下情况：A. 自然单间原是接待旅行社的经济损失，现在消除了自然单间，只不过减少了损失，并没有因此而增加收益；B. 自然单间优惠原是接待社对游客的一种优惠，一旦取消了自然单间，也就取消了这种优惠。\n（2） 若自然单间的费用是由领队所属的旅行社负责，导游应与本社有关部门联系之后，根据合同规定解决。","spot":"","cat":"应变能力"},{"q":"有一对夫妇被安排到362房间居住，第二天他们找到导游，提出要求换房，原因是房间靠近电梯，噪声太大。地陪导游应该如何处理？","a":"（1） 如果酒店有空房的话，可满足其要求，与饭店协商给予调换；\n（2） 可请领队在内部调配；\n（3） 若无法满足，应耐心做解释，并向游客致歉。","spot":"","cat":"应变能力"},{"q":"6=====PDF_PAGE182=====第四章河南导游现场考试问答示范4有一个境外旅游团被安排在花园餐厅十二点用中餐，十一点半时，客人却突然向导游提出要换西餐，导游这时应该怎么处理？","a":"（1）导游首先应做好解释工作，按常规，用餐者必须在餐前3 小时以上提出退餐、换餐，餐厅方有接受的可能，否则不予接受；\n（2） 若游客坚持换餐，导游可建议他们自己点菜，费用自理。","spot":"","cat":"应变能力"},{"q":"有一个旅游团，因为团员之间出现了矛盾，于是在用餐时向导游提出分餐要求，使得原本安排很合适的两桌不得不分为三桌或四桌。导游应该如何处理？","a":"（1）耐心解释，说明我方难以照办的理由；\n（2） 请领队协调，让他们自行调整席位，解决矛盾；\n（3） 如仍有游客坚持分餐，可协助其与餐厅联系，但餐费自理，并告知综合服务费不退。","spot":"","cat":"应变能力"},{"q":"旅游团中有五个年轻人，自费到一个地方小餐馆品尝风味之后，找到导游要求退还他们没有用的那顿午餐费用，导游应该如何处理？","a":"（1）根据旅游合同的规定，正常情况下单项服务费不退；\n（2） 团队用餐统一安排，一般情况下，不可能分餐服务，更不可能单独退还一部分分餐费。","spot":"","cat":"应变能力"},{"q":"有一团队在居民区附近自由活动时，有游客想进入居民家中看一看，他们向导游提出这一要求时，导游应该如何处理？","a":"（1） 向游客说明：A．陌生人贸然进入居民家中属于不礼貌行为；B 突然造访容易引起不必要的麻烦和误解；C可在之后的旅游活动中安排家访。\n（2） 提醒游客尊重当地有关风俗及规定。\n（3） 如若执意要家访，应先和居民联系，说明情况，征得同意．方可进入。","spot":"","cat":"应变能力"},{"q":"旅游团中有一位游客与其失散多年的亲友取得了联系，并高兴地找到导游，要求让其亲友随团活动，导游应该如何处理？","a":"（1）导游应予以协助，尽量满足其要求。\n（2） 先了解双方关系及亲友的情况，再征得领队和旅游团其他成员的同意；","spot":"","cat":"应变能力"},{"q":"7=====PDF_PAGE183=====导游服务能力一—河南导游现场考试指南（第三版）”（3）然后到旅行社办理入团手续：出示有效证件，填写有关表格，缴纳费用。9．有一位游客向导游提出口头投诉，对其接待中的诸多方面提出了意见，导游应该如何处理？","a":"（1） 认真倾听：不管投诉者是否有正当理由，导游员切不可立即辩解，更不应马上否定，要让游客把话说完。\n（2） 调查核实：导游应立即向旅行社及有关部门汇报，认真调查，客观分析，力求做出正确判断。\n（3） 正确处理：原因核实后，应向投诉者做出实事求是的解释或诚恳的赔礼道歉，迅速采取措施予以纠正或赔偿。\n（4） 妥善处理后，应向游客表示感谢，并继续为其提供热情周到的服务。","spot":"","cat":"应变能力"},{"q":"在游览活动中，团中有许多年轻人要求导游组织他们到附近的海滨去游泳，即使到小湖中也可以，导游应该如何处理？","a":"（1）耐心劝阻游客不可到海滨或江湖中游泳；\n（2） 若想游泳可组织他们到游泳池游泳；\n（3） 导游绝不可置全团于不顾，陪少数人游泳；\n（4） 提醒游泳者注意安全，以免发生溺水事故。","spot":"","cat":"应变能力"},{"q":"旅游团中的一位老太太想购买一套瓷器茶具，挑来挑去也决定不了购买哪一种，只好找到导游帮助定夺，导游应该如何处理？","a":"（1）应向客入如实介绍中国瓷器的品种；\n（2） 协助客人进行选择，实事求是地介绍情况；\n（3） 帮助客人对瓷器的质地和品牌进行鉴别；\n（4） 最终要由客人自己拿主意，做决定。","spot":"","cat":"应变能力"},{"q":"旅游团参观完龙门石窟准备返回时，一位游客要求留在龙门石窟继续参观，第二天自己返回与团队会合，导游应该如何处理？","a":"（1）要说明情况，劝其随团活动；\n（2） 从安全方面以及从团队整体计划方面耐心解释不能让其留下的原因，以免使客人产生误会。\n13．参观活动结束后，一位外国游客邀请导游一起去参与不健康的娱乐活动。作为一名导游应该如何处理？","spot":"","cat":"应变能力"},{"q":"8=====PDF_PAGE184=====第四章河南导游现场考试问答示范答（1）导游员应该拒绝，并介绍中国的传统和道德观念；（2）还应该告诫客人这种活动在中国是禁止的，参与这种活动是违法的行为。14有一位游客是个古玩爱好者，希望购买一些古玩，导游应该如何帮助他？","a":"（1） 建议他去正规的文物商店购买；\n（2） 买妥后要提醒游客保存好发票；\n（3） 注意保管好物品上的火漆印，以便海关查验；\n（4） 劝阻游客不要在地摊上购买古玩。","spot":"","cat":"应变能力"},{"q":"游览活动中，旅游团（者）提出变更计划或活动日程的要求时，导游应该怎么办？","a":"（1）严守合同，落实计划；\n（2） 对于游客的要求要视客观条件决定是否满足，并说明理由；\n（3） 遇到特殊情况上报旅行社做特殊处理。","spot":"","cat":"应变能力"},{"q":"因受暴风雪袭击，机场当天临时关闭停航，当地接待社建议原定当日乘坐CZ5328航班14时10分离站的某旅游团，改乘当日T468次火车，19时45分赴下一站，遇此情况，地接导游应该俇么处理？","a":"（1） （迫不得已变更离站时间或者交通工具）要征得领队和全陪导游的同意；\n（2） 及时与本社内勤沟通情况，做好变更后的各项安排，并通知下一站；\n（3） 确认车票、行李托运票；\n（4） 与游客协商，适当调整或增加活动项目，丰富旅行生活。","spot":"","cat":"应变能力"},{"q":"有一位游客在某景点的商店买到一件贵重工艺品，到达宾馆后，经其他人指点，才知道这件工艺品实际上是一件毫无价值的腮品，她找到导游要求协助退货，导游应该怎么处理？","a":"（1）首先，导游员不得敷衍捆塞，更不能以 “商品出售，概不退还”之类的话来推脱；\n（2） 积极协助，必要时陪同前往退换。\n18 旅游团（者）因遭遇不可抗拒的天灾人祸，需要中止或变更活动日程时，导游应该怎么处理？\n179\n（2） 立即报告组团社与地接社，遵照上级批示执行；\n（3） 全陪与地陪通力配合做好后续工作；\n（4） 稳定游客情绪，保持行动统一。","spot":"","cat":"应变能力"},{"q":"导游按计划赶到车站接团时，不料该团的游客早已在站外张望等候了20多分钟。这种意外的失误，到底这是什么原因造成的？导游应该如何处理？","a":"（1）涌接原因：A导 游疏忽未确认车次、抵达时间；B．上站未将变更情况通知本社或导游本人；C 本社内勤未将变更信息通知导游。\n（2） 处理方法：A 向游客赔礼道歉，诚恳接受批评；B 实事求是说明情况，不推卸责任；c．以热情周到的服务，嬴取信任，纠错补损；D．汲取教训，养成认真仔细的工作作风。","spot":"","cat":"应变能力"},{"q":"有位外国游客想利用午休时间到商业街购物，并请导游陪同前往，导游应该如何处理？","a":"（1） 如时间允许又不影响导游对其他旅游者的照顾，可陪同前往；\n（2） 若不能陪同前往，可写个中文便条，注明商店的位置和拟购物品名称；\n（3） 如果商店较远，还应该帮忙叫出租车，并向司机交代清楚；\n（4） 提醒客人注意安全，注意下午出发的时间。","spot":"","cat":"应变能力"},{"q":"一位游客想购买一套当地旅游方面的图书，但在旅游期间却没有买到，离开本地前提出请导游代办购买并托运，导游应该如何处理？","a":"（1） 一般情况下应婉拒；\n（2） 推脱不掉时，导游应请示领导，不可自作主张，贸然接受委托；\n（3） 一旦接受了委托，应收取足够的钱款，认真办理委托事宜；\n（4） 发票、托运单及托运费等票据寄给委托人，旅行社保存复印件，以备查验。","spot":"","cat":"应变能力"},{"q":"有位游客对导游说，宾馆房间里的小巧电贵斗很别致，他特别喜欢，180=====PDF_PAGE186=====第四章河南导游现场考试问答示范能否麻烦导游帮他买一个？导游知道这种小巧电褽斗在市场上是买不到的，那么，导游该如何满足客人的这项要求呢？","a":"（1） 向游客说明情况；\n（2） 协助游客与宾馆有关方面联系；\n（3） 由游客直接与有关人员交涉完成购买事项。","spot":"","cat":"应变能力"},{"q":"一位外国游客在旅游期间丢失了护照，请导游告诉他如何申请补办新的护照，那么导游应该怎么处理？","a":"（1） 由当地旅行社出具遗失证明；\n（2） 请失主准备本人照片；\n（3） 失主本人持当地旅行社开具的遗失证明到当地公安局（外国人出入境管理部门）报失，由公安局出具遗失证明；\n（4） 失主本人持公安局开具的遗失证明前往所在国驻华使领馆申请补办新护照；\n（5） 领到新护照后，再去当地公安局重新办理签证手续。","spot":"","cat":"应变能力"},{"q":"一日，地陪导游接到某旅游团全陪导游的电话通知，说原定当日14时前乘汽车抵达本市的该团，因途遇道路抢修，车辆限时限速通行，抵达时间预计推迟至19时左右，并且该团第二天仍按原计划乘预订航班12时15分飞往下一站，接此通知，地接导游应该怎么办？","a":"（1）最大限度落实活动日程内容；\n（2） 及早办理退房、退车、退餐事宜；\n（3） 及时通知下一站。","spot":"","cat":"应变能力"},{"q":"导游在人流如织、熙熙攘攘的机场（车站、码头）接团时，怎样做才不会错接？一旦错接又该如何处理？","a":"（1）错接的预防：A．准时、准地举牌接站；B．对照确认组团社名称、团号、游客姓名、入住店名、客人乘坐的交通工具和客人的行程；C．与全陪（领队）相互确认接待社；D．提高警惕，严防歹人骗接。\n（2） 错接的处理：A．同社接错，应速告本社，陪同对换与否由社里决定；","spot":"","cat":"应变能力"},{"q":"1=====PDF_PAGE187=====[J导游服务能力—河南骠现场考i葫南（第三版）”B．外社接错，要尽快找回本社团；C错接外社团要尽快交还并赔礼道歉。26.导游带领客人在某市一家餐厅用过晚餐回到停车场后，发现车辆被撬，团内30名游客放在车内的旅行包被盗，遇到此事应该怎么处理？","a":"（1）立即向当地警方报案，并保护好现场；\n（2） 报告旅行社领导，听取指示；\n（3） 按警方的要求协助做好取证调查；\n（4） 列出失窃物品清单，请警方开具失窃证明，由游客凭失窃证明和失窃物品清单向投保的保险公司理赔；\n（5） 安抚失主情绪，为失主提供应急生活必需品。","spot":"","cat":"应变能力"},{"q":"作为导游，送团之日最重要的工作有哪些？","a":"（1）确认交通票据、出发时间、出发地点、人数、行李和前往的目的地；\n（2） 按规定时间送达出发地点；\n（3） 协助办理乘机 （车、船）手续，并交接好各种票据；\n（4） 等启程时间确定后再离去。","spot":"","cat":"应变能力"},{"q":"导游员带团，领到车票一看是次日6月6H0时06分始发的T888次列车，可手中的计划明明白白地写的是送6月5日晚12时06分的T888次列车，这事使他疑惑不解，那么又怎样化解他心中的疑团呢？","a":"接送客人要按24小时标准计时法，次日0 时06分即当晚12时06分。","spot":"","cat":"应变能力"},{"q":"导游接受某入境团《北京、西安、洛阳三大古都览胜9日游》X2501团的全程陪同任务后，一路畅行，平安无事，不料出境当日，民航以座席预订满员为由，不予办理登机手续，拒绝游客登机，使该导游不知所措，这是怎么回事呢？又该如何处理？","a":"（1） 原因是未遵守中国民航有关出境航班需在飞机离站72 小时前重新确认机位的规定。\n（2） 处理方法。A．尽快申请补订机位，让游客改乘最早的下一班次出境；B．立即向旅行社报告，全陪导游和所属社要承担相关责任和由此造成的经济损失。","spot":"","cat":"应变能力"},{"q":"2=====PDF_PAGE188=====第四章河南导游现场考试问答示范30遇到游客有晕车（机、船）症状时，导游应该怎么做？","a":"叮嘱客人以下内容：\n（1） 告诉游客上车后束紧腰带，双目微垂，不要四处环视或远眺，双手裹腹、全身放松或减少内脏振动；\n（2） 告诉游客事先适量服用止晕药品，往太阳穴擦少许清凉油或风油精，也可用手指按压此穴；\n（3） 告诉游客乘车前不要多食多饮，备好清洁袋，以防万一；\n（4） 安排前、中排就座，并叮嘱驾驶员尽量减少急刹车，注意平稳行驶。","spot":"","cat":"应变能力"},{"q":"在人多拥挤的景点，地接导游应该怎样组织进行游览和防止游客走失？","a":"（1）告诉游客停车地点 车号和所乘车辆的醒目标志；\n（2） 设定集合地点和集合时间；\n（3） 介绍游览路线和大致所用时间、万一走散后的对策以及与导游联系的方法；\n（4） 举旗引路，把握好行进节奏，强调统一活动；\n（5） 与全陪导游、领队配合，注意清点人数，提倡互相帮助，关心老幼伤残；\n（6） 讲解生动有趣，吸引旅客的注意力。","spot":"","cat":"应变能力"},{"q":"旅行途中，游客患痢疾或症疾，导游应该怎么办？","a":"（1）按防疫规定对患者实行隔离治疗；\n（2） 患者入院、中止旅行后，要通知下站人数变更；\n（3） 对患者用过的浴盆、马桶、被褥等要进行消毒；\n（4） 如条件允许，请防疫部门为同团游客注射防疫疫苗；\n（5） 提醒游客不吃蝇虫污染的食品，防止病从口人，注意防止蚊叮虫咬，防止血液传染。","spot":"","cat":"应变能力"},{"q":"由N市乘汽车抵S市后，一位游客发现自己的戒指遗忘在N市所住酒店的客房内，请全陪导游设法帮助找回，这事应该怎样处理？","a":"（1） 问清款式、放置地点；\n（2） 通知N 市饭店总台和N 市接待社地接导游协助查找；\n（3） 根据行程长短，派人送还，或请地接社设法转送至能使失主收","spot":"","cat":"应变能力"},{"q":"3=====PDF_PAGE189=====勹导游服务能力一鹉导游现场铀式指南（第望）呤到遗失物品的下站。34．李先生一家在自由活动期间在一家商店购物时，钱包被偷走，内有现金、信用卡等物品，导游闻知后应如何处理？","a":"（1）详细了解并记录失窃的时间、地点和经过，失物的特征和价值；\n（2） 立即向当地公安部门报案；\n（3） 如侦破未果，由当地旅行社开具证明，并带失主到当地公安部门备案，开具失窃证明，以便失主向投保的保险公司理赔；\n（4） 对失主遭窃造成的生活不便提供必要的帮助。","spot":"","cat":"应变能力"},{"q":"我国公民出境旅游时，遗失护照或港澳通行证，作为领队，你应该怎样告诉失主申办新的证照？","a":"（1） 由当地旅行社出具证明；\n（2） 向当地公安局 （厅）报案，并索取遗失证明；\n（3） 去我国驻外使领馆或驻港澳办事处申请补发新的证照；\n（4） 持护照者还需到所在国移民局办理签证。","spot":"","cat":"应变能力"},{"q":"游客在旅游途中死亡，导游应该怎么处理？","a":"（1）立即向组团社和地接社领导报告，并设法通知死亡者亲属，由地接社按照国家有关规定协助组团社和死亡者亲属做好善后工作；\n（2） 导游应稳定其他游客的情绪，并继续带团活动，做好导游服务工作；\n（3） 如果是非正常死亡，应注意保护好现场，并及时报告当地有关部门和旅行社领导。\n（4） 如果是外国游客，要通知其所在国驻华大使馆。","spot":"","cat":"应变能力"},{"q":"某旅游团一行25人入住饭店后，有一位游客找到全陪导游抱怨说，其他客人的行李都巳送到房间，唯独他还未见到行李，那么全陪导游应该怎样帮助他？","a":"（1）先与饭店行李部核实签收件数；\n（2） 如果件数无误，再核实是否尚有行李未送，或是否送错房间；\n（3） 向本团客人查询是否错领了行李；\n（4） 如果饭店签收件数不符，应立即向行李运送部门查询。","spot":"","cat":"应变能力"},{"q":"一名游客在参观少林寺的时候走失，导游应该如何处理？","a":"（1） 向团内其他游客了解情况，并请全陪、领队迅速分头寻找，地接\n184\n（2） 如果没有找到，地接导游员应立即与游览地的派出所和景区管理部门联系，寻求帮助，同时与该团下榻的饭店联系，询问客人是否巳自行返回饭店；\n（3） 采取以上措施仍未找到，应迅速报告当地接待社，必要时向当地公安部门报案；\n（4） 找到走失者后，应间清情况、分析原因，如是导游的原因应向走失者道歉，如责任在走失者，应向其说明利害，提醒其以后注意；\n（5） 事后，导游应将游客走失的原因、经过、寻找过程、最终结果当面上报旅行社。","spot":"","cat":"应变能力"},{"q":"在参观河南博物院时，一位有患心脏病史的游客发病瘫倒在地，导游见到这种情况应该怎么处理？","a":"（1）不要随意移动患者，但最好让其平躺；\n（2） 急寻患者自备或他人携带的急救药品，如硝酸甘油片剂、救心丸等，按规定剂量放入患者舌下让其含服；\n（3） 迅速打电话给急救中心或附近医院，请求速派医生前来救治；\n（4） 保持周围环境的安静，不要惊扰患者，并根据天气情况为患者遮阳挡寒；\n（5） 通知当地社派人跟随前往医院协助照顾患者。","spot":"","cat":"应变能力"},{"q":"导游小王带团游览清明上河园时，一位游客突然中暑晕倒，遇到这种情况导游员应该怎么处理？","a":"（1）赶紧将患者移至阴凉通风处，让其平躺，为其解开衣扣，松开腰带，使其全身放松；\n（2） 用湿凉毛巾帮他擦汗，用扇子为他扇风解热，让他多喝些含盐的凉开水或矿泉水补充体内消耗的水分；\n（3） 找些常用解暑药，按照用药说明让其服用，或在他的太阳穴、前额等处涂些清凉油、风油精等外用药；\n（4） 对昏迷不醒的重症者要按人中穴、合谷穴进行急救，并迅速就近送往医院救治。","spot":"","cat":"应变能力"},{"q":"有一位游客在登嵩山时，不慎摔下来造成小腿骨折，导游应该怎样185=====PDF_PAGE191=====导游服务能力一—河南导游现场考试指南（第三版）坅处理？","a":"（1）就地取材，用直木棍或竹片等代替夹板，临时捆绑固定受伤部位；\n（2） 如伴有外伤出血，要用纯净水清洁伤口周围附着的砂土和血垢等，并用干净的手帕、长巾等做止血包扎；\n（3）在转送伤者去医院途中，注意间断疏松止血包扎物，以免血管梗阻，肢体坏死；\n（4） 尽快送往医院，不要耽误治疗。","spot":"","cat":"应变能力"},{"q":"日本战亡者遗属来华旅行期间，提出要祭奠在战争中命丧他乡的亲人，并准备在其阵亡旧地竖国旗、唱国歌、种植樱花树苗，导游闻知后应该怎么处理？","a":"（1）应当劝阻，不允许在公共场合举行这类祭奠活动，以免伤害为抗日战争付出重大牺牲的中国人民的感情。\n（2） 对不听劝阻者要报告有关部门严肃处理。\n（3） 说明道理，当年遗属的亲人毙命他国是日本反动派一手制造的暴虐他人、致残同胞的严重罪行；也是昔日日本军国主义战争罪犯头目带给自己国家的耻辱记录。如果有人执迷不悟，以耻为荣，胆敢为昔日的侵略罪行涂脂抹粉，必然要受到世界人民，尤其是战争受害国人民的强烈反对。\n（4） 私自携带樱花树苗入境，本身已违反出入境管理法和动植物检疫法，应当没收并由有关部门处理。","spot":"","cat":"应变能力"},{"q":"在处理游客不当言行时，导游要特别注意”四个分清”是什么？","a":"（1） 无故和有因；\n（2） 言论和行为；\n（3） 不当行为和违法行为；\n（4） 有意和无意。","spot":"","cat":"应变能力"},{"q":"导游带团乘车由A市赴B市途中，发生了两车迎面相撞的交通事故，团内半数以上游客受伤。导游在处理这起事故时应该做好哪些工作？","a":"（1） 立即组织抢救伤员，尽快送往就近医院治疗。\n（2） 保护现场，尽快通知交通管理部门派人来现场调查处理。\n（3） 及时报告有关旅行社，按照下达的应急方案，全力做好各项善\n186\n（4） 安抚伤员，关心游客，稳定全团情绪，着眼大局，从实际出发做好继续原有旅程或调整日程的工作，精心安排组织好参观游览活动。\n（5） 写出书面报告，内容力求详细、准确、清楚，主要包括：事故的原因、发生的时间、地点和全过程，抢救措施、治疗悄况；事故的责任以及对责任者的处理；游客的反映以及对事故的评论。","spot":"","cat":"应变能力"},{"q":"一天，意大利一个天主教会旅行团在开封一个教堂做礼拜时，团长托尼神父对导游说，他想在教堂为中国教友传经布道，导游如何对待他的这一要求？","a":"（1）对于常规礼拜活动，经上报宗教主管部门同意后，可在指定的场所举行；\n（2） 宣传我国自治、自养、自传的办教政策，指出中国不于涉宗教人士的国际友好交往，但是未经我国宗教团体邀请和允许，不得擅自在我国境内传经布道和散发宗教宣传品；\n（3） 对不听劝阻或有意违规行事者，要立即报告宗教主管部门和公安部门予以处理。","spot":"","cat":"应变能力"},{"q":"游客下榻的饭店夜间发生火灾时怎么办？","a":"（1）立即拨打119报警。\n（2） 火速通知全团客人。\n（3） 组织指挥客人通过安全通道疏散避灾。\n（4） 指导帮助客人自救：A 告诫客人不要乘电梯或随意跳楼；B就 地打滚或用厚重衣物等熄灭身上的火苗；C 遇到浓烟时，用浸湿的衣物披裹身体，掩捂口鼻，顺墙弯腰低姿转移；D．大火封门时，要用浸湿的衣物、被褥等堵塞门缝或泼水局部灭火，等候救援；E．打开朝外的窗户，挥动色彩鲜艳的衣物呼唤救援人员。\n（5） 协助处理好善后事宜。","spot":"","cat":"应变能力"},{"q":"7=====PDF_PAGE193=====导游服务能力一—河南导游现场考试指南（第三版）冷47．餐后许多游客头晕恶心、上吐下泻、腹痛不止、四肢无力，大家都怀疑是食物中毒，导游闻讯后该怎么处理？","a":"（1）立即采取排毒措施，设法为患者催吐，并让其多喝水加速排泄以缓解毒性；\n（2） 立即将患者送往医院救治，请医生开具诊断证明；\n（3） 报告旅行社，请旅游主管部门和卫生主管部门对问题进行调查，若属供餐单位的原因，要追究其责任。","spot":"","cat":"应变能力"},{"q":"两位游客在饭店就餐时喝得酪酐大醉，并摔碎了酒杯，喧闹不休，导游闻讯赶来如何处理这件事？","a":"（1）好言规劝，尽力制止扰乱公共秩序和毁坏物品的行为；\n（2） 对于深度醉酒导致神志不清、无法自制的闹事者，要请有关人员协助临时隔离看管，并请医务人员设法为其醒酒；\n（3） 待醉酒者神志清醒后，要向其说明饮酒过量的危害，并要求他对由此引发的扰乱公共秩序、伤害他人身体和毁坏物品等过失行为承担相应的法律责任。","spot":"","cat":"应变能力"},{"q":"在旅途中，如果游客因长时间颠簸而晕车呕吐，污染车内设施，与司机发生矛盾该如何处理？","a":"（1） 安排司机把车停靠到最近的服务区（特别注意：不可停在应急车道处理问题）；\n（2） 请游客下车暂时休息，呼吸新鲜空气，调节自己；\n（3） 安抚司机，并及时同司机一起处理车内被污染的地方；\n（4） 处理完毕后，调节游客的心情并采取适当措施尽量化解双方矛盾；\n（5） 让游客上车，继续行程，注意调节车内气氛。","spot":"","cat":"应变能力"},{"q":"游客因团队餐质量不好，要求加菜但又不出任何费用时该如何处理？","a":"（1） 向客人说明原因；\n（2） 与餐厅负责人联系，尽量满足客人的要求；\n（3） 如无法满足，应向旅行社说明情况，并申请调换团队餐厅。\n51．行车途中，有几位游客闹哄着让导游讲几个萦段子活跃气氛，其中还有人提出晚上出钱请导游带他们找地方去寻美色、品 “野味”，那么导游如何应对这样的要求？\n188\n（2） 拒绝违规违法的无理要求和不义之财，不给黄、赌、毒等社会丑恶现象开绿灯；\n（3） 有责任预防和检举各类犯罪活动，以净化旅游环境。","spot":"","cat":"应变能力"},{"q":"如果游客对导游的讲解提出异议，导游应该如何处理？","a":"（1）耐心听取游客的意见和要求；\n（2） 不要与游客争论、辩解，从中吸取合理成分；\n（3） 以游客的观点为中心进行讲解，满足合理需求；\n（4） 假如是游客的观点错误，确认后可私下交流。","spot":"","cat":"应变能力"},{"q":"发现有游客溺水时，采取的救护方法有哪些？","a":"（1）抛送救生圈等物品给溺水者；\n（2） 大声呼救，寻求帮助；\n（3） 溺水者上岸后，将其平放在地面上，迅速撬开其嘴，清理溺水者口鼻脏东西，保证呼吸道畅通。","spot":"","cat":"应变能力"},{"q":"前往餐厅途中，旅游者突然提出换餐怎么办？","a":"（1）接近用餐时间或到达餐厅后提出换餐，如该餐厅有这项服务，地陪应协助解决；\n（2） 若无此项服务，可不接受其要求，但应做好解释工作；\n（3） 若旅游者仍坚持换餐，可建议其到零点餐厅点菜，费用自理，原餐费不退。述 团队入住酒店后，旅游者告诉导游，今晚有客户来拜访，请导游帮忙调换到商务套房。导游应该怎么办","spot":"","cat":"应变能力"},{"q":"旅游者要求导游帮忙，带他乘坐一次地铁，导游应该笘么办？","a":"（1）旅游者要求乘坐地铁，如时间允许、又不是上下班的高峰期，导游可以满足旅游者的要求；\n（2） 一定要提醒旅游者注意人身安全和注意保护财物安全。\n57旅游者告诉导游其准备参加亲友的婚礼，全天不随团活动。导游应该怎么办？\n189\n（1） 帮助叫出租车，提醒其带上酒店的卡片或为旅游者写一张便条，注明客人要去的地点名称，必要时将自己的电话号码告诉司机；\n（2） 向其说明离团期间的所有费用不退，需增加的费用自理；\n（3） 对回团用餐的旅游者，导游要告知用餐时间和地点。","spot":"","cat":"应变能力"},{"q":"旅游者因生活习惯不愿与其他人一起用餐，要求单独用餐，怎么办？","a":"（1） 由于旅游团内部出现矛盾或由于生活习惯、性格等原因，旅游者提出要求单独用餐，对此，地陪要耐心劝解，并请领队进行协调。\n（2） 劝说及协调无效，旅游者仍然坚持要单独用餐，地陪协助与餐厅联系，并告知旅游者餐费自理，且原餐费不退。","spot":"","cat":"应变能力"},{"q":"晚餐回到酒店后，旅游者告诉导游想去酒吧街或其他繁华区域自由活动，导游应该怎么办？","a":"天气好又不太晚，导游可满足其要求，但应提醒旅游者带上酒店卡片，不要离开太远，不要携带贵重物品，不要到秩序混乱的场所，不要太晚回酒店。","spot":"","cat":"应变能力"},{"q":"旅游者告诉导游，今天上午随团队购物时，所买的一只鼻烟壶有质量问题，请求导游帮忙办理退货或更换。导游应该怎么办？","a":"导游应积极协助，必要时陪同前往购物商店，设法帮助解决。","spot":"","cat":"应变能力"},{"q":"境外旅游者要求导游帮忙买4套优质丝绸睡衣和4套蚕丝被帮忙寄到旅游者所在的国家。导游应该怎么办？","a":"（1）导游可告知定点商店基本都有托运服务，或积极、热情地帮助解决。\n（2） 旅游者想购买的商品暂时无货，请求地陪帮助购买并托运时，地陪须请示接待社领导，被批准后接受此项委托。\n（3） 请旅游者写出委托书，收取必要的钱款 （包括购货款、托运费、保险费、手续费等）。\n（4） 旅游团离开后，如商店通知货物已到，地陪应及时购买并办理托运，并将购货发票、托运单、托运费和相关费用的收据复印后，通过旅行社将原件寄送旅游者，复印件交旅行社保存，以","spot":"","cat":"应变能力"},{"q":"0=====PDF_PAGE196=====第四汽河南导游现场考试问答示范备查验。62．旅游团（者）提出变更计划或活动El程的要求时，全程导游应该怎么办？","a":"（1）严守合同，落实计划；\n（2） 对于游客的要求要视客观条件允许与否决定是否满足，并说明理由；\n（3） 遇到特殊情况上报旅行社做特殊处理。","spot":"","cat":"应变能力"},{"q":"一日，接到某团全程陪同导游的电话通知，因特殊原因旅游团需要提前一天离开本地，接此通知，地接导游应该怨么办？","a":"（1）最大限度地落实活动日程内容；\n（2） 及早办理退房、退车、退餐事宜；\n（3） 及时通知下一站。\n64．游客在中目境内旅游期间行李丢失，导游小王应该如何处理｀I答：（1）仔细分析，找出差错的环节或线索。\n（2） 做好善后工作。主动关心失主，对因行李丢失给失主带来的诸多不便，表示歉意，并积极帮助其解决因行李丢失而带来的生活方面的困难。\n（3） 随时与有关方面联系，询问查找进展情况。\n（4） 若行李找回，及时将找回的行李归还失主。若确定行李丢失．由责任方负责人出面向失主说明情况并表示歉意。\n（5） 帮助失主根据有关规定和惯例，向有关部门索赔3\n（6） 事后写出书面报告（事故的全过程：行李丢失的原因．经过、查找过程、赔偿情况及失主和其他团员的反映）C","spot":"","cat":"应变能力"},{"q":"中国公民出境旅游时丢失护照、签证，应该如何处理？","a":"（1） 由当地接待社出具证明；\n（2） 持证明到当地警察机构报案，并取得遗失证明；\n（3） 持报案证明和有关材料到我国驻该国使、领馆领取中华人民共和国旅行证；\n（4） 回国后可凭中华人民共和国旅行证和境外警方的报失证明．申请补发新护照。\n66．旅游者在游览景点时突然患病，导游该如何处理1\n191\n（2） 立即拨打电话呼叫救护车，或请求景点工作人员帮助。\n（3） 同时向旅行社报告，请求支援。","spot":"","cat":"应变能力"},{"q":"嵩山地区的汉三阙是哪三阙？","a":"太室阙、少室阙、启母阙。厂一一一····一～－—一§洛阳龙门石窟景区","spot":"龙门石窟","cat":"景点知识"},{"q":"龙门石窟的“龙门”因何得名？","a":"龙门，在春秋战国时期称 “伊阙＂，香山（东山）与龙门山（西山）东西对峙，伊水从中流过，形成一座壮丽的门阙。后因处于隋唐帝国之南，又称龙门。","spot":"龙门石窟","cat":"景点知识"},{"q":"龙门石窟是什么时候开凿的？","a":"始建于北魏太和年间，以后经历东魏、西魏、北齐、隋、唐延至宋代，前后400多年。","spot":"龙门石窟","cat":"景点知识"},{"q":"龙门石窟最大的造像是什么？193=====PDF_PAGE199=====勹导游服务能力—河南骠现场考i颉南（第三版）,..答：奉先寺的卢舍那大佛。4．宾阳中洞的特点是什么？","a":"宾阳中洞是一座三世佛龛。北魏由于受《法华经》影响较大，除信仰释迦、多宝外，还信仰三世佛。在龙门石窟仅此一例。\n5．请简要介绍奉先寺。答：奉先寺是龙门石窟规模最大、艺术最为精湛的一组摩崖群雕。奉先寺南北宽约34米，东西深约36米，龛雕一佛、二弟子、二胁侍菩萨、二天王及力士等大像。寺内供奉卢舍那大佛，通高17.14米，头高4 米，耳长 1.9米，是龙门石窟所有窟龛之中规模最大的造像。","spot":"龙门石窟","cat":"景点知识"},{"q":"中华民族最早的历史文献出自洛阳的是什么？被奉为“人文之祖”的伏羲氏，根据此画成了什么？","a":"“河图洛书＇。八卦和九畴。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"龙门石窟群大部分集中在哪里？","a":"伊水西岸的崖壁上。","spot":"龙门石窟","cat":"景点知识"},{"q":"除洛阳龙门石窟外，中国三大佛教石窟艺术宝库还有哪两处？","a":"敦煌莫高窟、大同云冈石窟。","spot":"龙门石窟","cat":"景点知识"},{"q":"万佛洞因何而得名？","a":"因在洞内窟壁上雕刻有15000尊4 厘米的小佛像而得名。","spot":"龙门石窟","cat":"景点知识"},{"q":"河南的什么文化和文明是中华民族文化的核心和源头？","a":"以洛阳为中心的河洛文化和河洛文明。","spot":"龙门石窟","cat":"景点知识"},{"q":"龙门石窟开凿最早的洞窟是哪个洞窟？","a":"龙门石窟开凿最早的洞窟是古阳洞。","spot":"龙门石窟","cat":"景点知识"},{"q":"请分别列举北魏时期、唐代的代表性洞窟。答：北魏时期的洞窟具有代表性的是古阳洞、宾阳中洞、莲花洞等。唐代具有代表性的洞窟有潜溪寺、宾阳北洞、万佛洞、奉先寺等。13．什么是“龙门二十品”?","a":"《龙门二十品》代表了魏碑体，字形端正大方，气势刚健有力，结体用笔在隶、楷之间，是隶书向楷书过渡中一种比较成熟的独特字体。有十九品在古阳洞内。\n14 请简要介绍潜溪寺。答：潜溪寺洞高、宽均为9米多，进深近7米，建于唐代初期，距今有","spot":"龙门石窟","cat":"景点知识"},{"q":"00多年的历史，因在凿洞时地下有源源不断流出的溪流而得名。洞内所供主像为阿弥陀佛。15简要介绍龙门石窟中万佛洞的由来及开凿时间。答：万佛洞顾名思义，因在洞内窟壁上雕刻有15000尊4厘米的小佛像而得名。开凿于大唐永隆元年，680年。焦作云台山风景名胜区＼l．云台山景区主要包括哪些景点？","a":"景区面积190平方千米，包含红石峡、泉瀑峡、潭瀑峡、子房湖、万善寺、百家岩、茱萸峰、叠彩洞、猕猴谷、青龙峡、峰林峡等景点。","spot":"云台山","cat":"景点知识"},{"q":"云台山有中国山水园林文化鼻祖“竹林七贤＂的隐居地，“竹林七贤”指的是谁？","a":"指的是嵇康、刘伶、向秀、山涛、王戎、阮籍、阮咸。","spot":"云台山","cat":"景点知识"},{"q":"唐代哪位诗人曾登临云台山主峰，并写下了一首诗《九月九日忆山东兄弟》，诗的内容是什么？","a":"王维。独在异乡为异客，每逢佳节倍思亲。遥知兄弟登高处，遍插茱萸少一人。","spot":"云台山","cat":"景点知识"},{"q":"云台天瀑被誉为亚洲最大落差瀑布，落差是多少？该瀑布是如何形成的？","a":"3 14米。在泉瀑峡尽头，由于地质运动，历史上这里曾发生剧烈的断裂构造，形成了东西向的“ U\" 形断崖，高度在数百米以上，高大陡峭，雄伟壮观。由于流水和地形的巧妙结合，形成了云台天瀑。","spot":"云台山","cat":"景点知识"},{"q":"叠彩洞连接了哪两个省？有几个洞组成？","a":"河南省、山西省。19个。","spot":"云台山","cat":"景点知识"},{"q":"河南省17个国家5A级旅游景区中，焦作有哪几个？","a":"云台山、神农山、青天河。","spot":"云台山","cat":"景点知识"},{"q":"海蟾宫水质极好，这里生产的什么特产古时候曾是贡品？","a":"松花蛋。","spot":"云台山","cat":"景点知识"},{"q":"被称为唐代药王的是谁？","a":"孙思邈。","spot":"云台山","cat":"景点知识"},{"q":"白龙瀑日夜奔流不息地流入白龙漳，可是这潭水却既不增长，也不外195=====PDF_PAGE201=====门导游服务能力一河南导游现场咑辐南（第三版）呤流，那么水究竞到哪里去了呢？","a":"原来白龙潭下有一巨大的暗河，大量的水潜流而去，奔流至修武县五里源乡的海蟾宫。","spot":"云台山","cat":"景点知识"},{"q":"云台山中的迎宾第一瀑指的是景区的哪个瀑布？","a":"云台山的白龙瀑因毗邻云台山西南大门，故又称 “迎宾第一瀑”。","spot":"云台山","cat":"景点知识"},{"q":"红石峡的崖壁为什么是红色？","a":"由于岩石中铁质矿物的氧化，加之当时气候条件的变化，经年累月，崖壁便形成了深浅不一的红色。","spot":"云台山","cat":"景点知识"},{"q":"有“三步一泉、五步一瀑、十步一潭”之称的是云台山哪个景区？","a":"潭瀑峡景区，又名小寨沟。五归－明亘一口~• -l. 《清明上河图》是我国宋代哪位著名画家的传世名作？同时请简述其生平。答：张择端。张择端，字正道，号文友，山东诸城人，生于北宋后期\n(1085年），卒千南宋初年（1145年）。年轻时游学京师，擅长绘画，曾任翰林图画院待诏。他的长卷风俗画《清明上河图》，真实地描绘了北宋首都繁华的风貌，原作现存北京故宫博物院。","spot":"清明上河园","cat":"景点知识"},{"q":"虹桥是一座什么桥？始建于哪一年？重建于哪一年？","a":"虹桥是一座木质拱桥，始建于1050年，重建于1998年。","spot":"清明上河园","cat":"景点知识"},{"q":"清明上河园每天晚上演的大型水上实景剧叫什么？","a":"《这 ·东京梦华》。","spot":"清明上河园","cat":"景点知识"},{"q":"世界上唯一一座城市中轴线从未变动的都城是哪座？至今已有多少年的建城史？","a":"开封，至今已有4100多年的建城史。","spot":"清明上河园","cat":"景点知识"},{"q":"东京“生命之河＇是指什么河？其最早的历史可以追溯到什么时期？","a":"汴河。汴河是我国最早开发的古运河之一，它的历史一直可以追溯到春秋战国时期。公元前360年，“战国七雄”之一的魏国魏惠王为了称霸中原，在这里开挖了鸿沟。","spot":"清明上河园","cat":"景点知识"},{"q":"清明上河园大体分为哪两大景区，分别重在表现哪些内容？","a":"整个园区大体分为南苑和北苑两大景区，南苑重在表现市井生活、","spot":"清明上河园","cat":"景点知识"},{"q":"6=====PDF_PAGE202=====第四章河南导游现场考试问答示范民俗风情，北苑重在表现皇家园林、宫廷娱乐。7．清明上河园仿照《清明上河图》是按什么比例建造而成的？","a":"1 : 1。","spot":"清明上河园","cat":"景点知识"},{"q":"清明上河园的主要特点有哪些？","a":"清明上河园坐落于开封城西北隅，是以《清明上河图》为蓝本，按照图中布局，采用宋代营造法式，结合现代建筑手法，集中再现原图中的风物景观和民俗风情的大型民俗主题公园。","spot":"清明上河园","cat":"景点知识"},{"q":"北宋时，商人多在汴河边买卖交易，尤其桥的两端更是商铺林立，当时的人称之为什么？","a":"当时的人称之为 “河市”。","spot":"清明上河园","cat":"景点知识"},{"q":"在《清明上河图》中描绘的哪座城门，恰好把城内繁华区和城外沿河闹市一分为二？","a":"上善门。","spot":"清明上河园","cat":"景点知识"},{"q":"请简述《清明上河图》的艺术价值。答：《清明上河图》所画的生活景物几乎无所不包，真实地描绘了北宋东京开封城的繁华景象。在这幅长528.7厘米、宽24.8厘米的画卷上，有各种人物814个、牲畜73头、房屋122座、舟船29艘。12．清明上河园的宣传口号是什么？","a":"一朝步入画卷，一日梦回千年。［如亟社一心忙","spot":"清明上河园","cat":"景点知识"},{"q":"白云山景区现已开发的五大观光区、五大休闲区有哪些？","a":"九龙瀑布、玉皇顶、小黄山、原始森林、白云峰五大观光区和高山森林氧吧、高山牡丹园、留侯祠、白云湖、芦花谷五大休闲区。","spot":"清明上河园","cat":"景点知识"},{"q":"嵩县古称为伊国，曾生活于该地的代表性历史名人有哪些？","a":"中国第一宰相伊尹，宋代理学家程颍、程颐。","spot":"芒砀山","cat":"景点知识"},{"q":"玉皇顶景区的名称由来。答：因主峰直插天宫、顶如皇冠而得名，是中原地区观赏云海、日出的最佳之地。12．白云山水域风光最精彩的部分是哪个观光区？","a":"九龙瀑布观光区。｀威合和西面又＿","spot":"芒砀山","cat":"景点知识"},{"q":"芒杨山古文化旅游区的位置在哪里？","a":"商丘永城。","spot":"芒砀山","cat":"景点知识"},{"q":"保安山王陵景区主要是哪些人的陵墓所在地？","a":"即梁孝王王后陵、梁孝王刘武陵、梁共王陵。其中规模最大的是梁孝王王后陵，其规模是北京十三陵定陵的两倍之多。","spot":"芒砀山","cat":"景点知识"},{"q":"梁共王是谁？","a":"梁孝王刘武的长子刘买。","spot":"芒砀山","cat":"景点知识"},{"q":"在西汉时期的梁国陵墓群中，梁孝王墓和他的王后墓与普通的汉朝贵198=====PDF_PAGE204=====第四章河南导游现场考试问答示范族墓葬不同的地方有哪些？","a":"梁孝王墓和他的王后墓与普通的汉朝贵族墓葬不同，不是用石块砌成，而是以山为陵，是凿石穿山而成的地下宫殿群。属于大型 ”凿山为室”的石扭墓。","spot":"芒砀山","cat":"景点知识"},{"q":"目前中国所发现的年代最早、规模最大的汉墓群是哪座陵墓群？","a":"永城芒杨山的西汉梁王陵墓群。","spot":"芒砀山","cat":"景点知识"},{"q":"迄今国内发现的最大石室陵墓是什么？","a":"梁孝王王后墓。","spot":"芒砀山","cat":"景点知识"},{"q":"\"敦煌壁画前之壁画，敦煌壁画外之壁画＇是指哪幅壁画，它是在哪个陵墓出土的？","a":"《四神云气图》彩绘壁画，是在梁共王陵墓地宫出土的。壁画以青龙、白虎、朱雀为主题图案，配以缭绕的云气和绶带穿璧加以装饰，历经","spot":"芒砀山","cat":"景点知识"},{"q":"00多年仍色彩艳丽，被专家学者评价为＂敦煌壁画前之壁画＇＂敦煌壁画外之壁画”。8.目前中国发现的最大崖洞墓指的是谁的陵墓？被称为什么？","a":"梁孝王刘武之妻李王后陵。“天下石室第一陵”。","spot":"芒砀山","cat":"景点知识"},{"q":"《四神云气图》被誉为“四最壁画”，是哪“四最”?","a":"篇幅最大、年代最久远、保存最完整、考古艺术价值最高。","spot":"芒砀山","cat":"景点知识"},{"q":"芒杨山汉文化景区对外开放的景区有哪些？","a":"共四大景区：保安山王陵景区、汉兴园景区、夫子山景区、陈胜王陵景区。","spot":"芒砀山","cat":"景点知识"},{"q":"《四神云气图》壁画有什么样的寓意？","a":"整幅壁画寓意着墓主人乘龙升仙的愿望。＇安阳殷墟景区 1","spot":"安阳殷墟","cat":"景点知识"},{"q":"殷墟的名字是怎么来的？","a":"公元前1300年，商朝的第20代国王盘庚把都城由奄（今山东省曲阜旧城东）迁到了殷 （今河南安阳市西的小屯村一带），在此建都255年，历经8 代12王。公元前1046年，周武王伐纣灭商，这里逐渐荒芜，变成了一片废墟，史称 ＂殷墟＂。\n2．什么是甲骨文？","spot":"安阳殷墟","cat":"景点知识"},{"q":"殷墟宫殿宗庙遗址的大门有什么特色？","a":"是根据甲骨文的 “门”字设计建造的，整扇大门由3个甲骨文中的“门”字组成。门两侧的浮雕是根据1976年妇好墓中出土的龙形玉块放大仿制而成的。","spot":"安阳殷墟","cat":"景点知识"},{"q":"迄今世界上出土最大、最重的青铜礼器叫什么名字？真品现存于哪里？","a":"后母戊鼎 （也称司母戊鼎）。真品现存于中国国家博物馆。","spot":"安阳殷墟","cat":"景点知识"},{"q":"简要介绍殷墟考古至今出土甲骨最多的一坑。答：甲骨窖穴展厅，1936年在这里出土了一坑甲骨，编号为YH127,共17096片。6．殷墟科学发掘以来发现的唯一保存完整的商代王室成员墓葬叫什么？","a":"妇好墓。","spot":"安阳殷墟","cat":"景点知识"},{"q":"古老的安阳有“三根＂，是指什么？","a":"一是 “文字之根”，二是 “文化之根”，三是 “民族之根”。","spot":"安阳殷墟","cat":"景点知识"},{"q":"被列为＂中国20世纪100项考古重大发现”之首的是指哪里？它是什么时候被列入《世界遗产名录》的？","a":"殷墟。2006年7月13 日。","spot":"安阳殷墟","cat":"景点知识"},{"q":"殷墟闻名于世的第一个原因是什么？","a":"青铜器。当世界多数人们还停留在石器时代时，生活在这里的人们已经步入了青铜器时代。","spot":"安阳殷墟","cat":"景点知识"},{"q":"从平面上看，殷墟博物院老馆酷似甲骨文的＂洹”字，这是为什么？","a":"这是取殷墟依附洹河之意，象征洹水在商文明发展过程中的重要作用。","spot":"安阳殷墟","cat":"景点知识"},{"q":"鼎的作用是什么？","a":"最初的作用是用来烹煮食物的，到夏商周时已经成为权力的象征。","spot":"安阳殷墟","cat":"景点知识"},{"q":"殷墟景区由哪几部分组成？","a":"殷墟博物馆、宫殿宗庙遗址、王陵遗址。","spot":"安阳殷墟","cat":"景点知识"},{"q":"0=====PDF_PAGE206=====第四章河南导游现场考试问答示范II-＇，一，子门峡函谷关景区］l．历史上函谷关有哪三处，哪个最著名？","a":"秦关、汉关、魏关。最著名的是春秋战国时期建关的秦关，秦关位于三门峡灵宝市北15千米处的王躲村，距三门峡市约75千米，地处长安古道，紧靠黄河岸边。","spot":"三门峡函谷关","cat":"景点知识"},{"q":"函谷关以什么闻名于世？","a":"名人老子、名著《道德经》、名关函谷关。\n3．介绍一下老子广场西侧的道德天书。答：位于老子广场西侧的道德天书，是老子文化园中的标志性建筑之一。它总长365米，高12.3米，寓意一年365天，每天都在感悟、学习老子文化。每个字约1立方米，呈一字排开，宛若长龙，气势恢宏。文字采用的是篆体，为便于人们认识阅读，下方镌刻了元代书法家赵孟覜的楷书《道德经》以作对照。这是目前为止全世界最大的一部 《道德经》。\n4．介绍一下战国井式箭库。答：战国井式箭库位于函谷关东城门右侧城墙下端，为一直径0.9米的竖井窖穴式兵器仓库，于1986年7月发现，是战国时守关官吏储藏兵器的箭库。箭库像一口旱井，里面放着一捆捆箭嵌，约1立方米，箭头是铜质的，箭杆是铁质的，很轻，已经绣在一起，不能分开。此箭库为研究战国时代的兵器提供了重要依据。\n5．讲讲成语 “紫气东来”的来历。答：据 《史记》记载，春秋末期，柱下史老子李呥看到周室将衰，西去隐居。公元前491年，函谷关令依尹喜，清早从家里出门，站在一个土台上\n（现瞻紫楼）看见东方紫气腾腾，霞光万道，观天象奇景，欣喜若狂，大呼“紫气东来，必有异人通过“。忙令官吏清扫街道，恭候异人，果然见一老翁银发飘逸，气宇轩昂，并且倒骑青牛向关门走来。尹喜忙上前迎接，通报姓名后，诚邀老子在此小住。老子欣然从命，在此著写了彪炳千秋的洋洋五千言 《道德经》。以后，函谷关一带的门拥或春联都书写 “紫气东来”，以示吉祥之意。","spot":"三门峡函谷关","cat":"景点知识"},{"q":"“战国四君子”指的哪四个人？","a":"齐国的孟尝君田文、楚国的春申君黄歇、魏国的信陵君魏无忌、赵","spot":"三门峡函谷关","cat":"景点知识"},{"q":"1=====PDF_PAGE207=====导游服务能力—一河南导游现场考试指南（第三版）沙国的平原君赵胜。7函谷关城楼景区目前还保留的历史遗迹有哪些？","a":"古城墙、兵器库、函谷古道等。","spot":"三门峡函谷关","cat":"景点知识"},{"q":"三门峡因什么而得名？","a":"相传大禹治水，使用神斧将高山劈成 “人门、神门、鬼门”三道峡谷，三门峡由此而得名。","spot":"三门峡函谷关","cat":"景点知识"},{"q":"据联合国教科文组织统计，什么书的发行量在全球仅次于《圣经》，位居第二。其作者被国人尊称为什么？","a":"《道德经》。哲圣。","spot":"三门峡函谷关","cat":"景点知识"},{"q":"O函谷关曾发生过哪些比较著名的战役？","a":"如周武王的 ”出谷会师”、秦国的＂割城求和＂、李自成的 “二出函谷”、辛亥革命的 “张钥出关”以及1947年的＂奔袭函谷关，解放灵宝城”等。＼庋安阳红旗渠I","spot":"三门峡函谷关","cat":"景点知识"},{"q":"红旗渠景区的地理位置在哪里？","a":"红旗渠景区位于河南省林州市。","spot":"红旗渠","cat":"景点知识"},{"q":"红旗渠是引自哪里的水？","a":"引自山西漳河的水，最后汇入海河。","spot":"红旗渠","cat":"景点知识"},{"q":"红旗渠景区里著名景点有哪几处？","a":"一是分水苑，二是青年洞，三是络丝潭。","spot":"红旗渠","cat":"景点知识"},{"q":"红旗渠从开始建渠到竣工共用了多长时间？","a":"9年零5个月 （也可以说成IO年）。","spot":"红旗渠","cat":"景点知识"},{"q":"为什么把红旗渠称为“人工天河”?","a":"当时林州人民在极其艰难的施工条件下，靠自力更生、艰苦创业的精神，克服重重困难，奋战于太行山悬崖绝壁之上、险滩峡谷之中，逢山凿洞，遇沟架桥，削平了1250座山头，架设152座渡漕，开凿2II 个隧洞，修建各种建筑物12408座，挖砌土石达2225万立方米，才建成了红旗渠，所以被称为 “人工天河＇。","spot":"红旗渠","cat":"景点知识"},{"q":"“青年洞”洞长多少米？是在怎样的条件下凿成的？","a":"“青年洞＇全长616米。当时资金严重缺乏，食物空前紧张，青年们","spot":"红旗渠","cat":"景点知识"},{"q":"请解释一下红旗渠精神。答：红旗渠在修建过程中形成了“自力更生，艰苦创业，团结协作，无私奉献”的精神。今天的红旗渠已经不单是一项水利工程，它已经成为民族精神的一个象征，要将红旗渠精神继续学习和发扬下去。8周恩来总理自豪地对外国友人说，中国有两大奇迹，一个是南京长江大桥，另一个是什么？","a":"林州红旗渠。","spot":"红旗渠","cat":"景点知识"},{"q":"1996年6月，江泽民视察红旗渠并亲笔题词，具体题词是什么？","a":"发扬自力更生、艰苦创业的红旗渠精神。","spot":"红旗渠","cat":"景点知识"},{"q":"进入青年洞景区的第一个景点叫什么名字？","a":"｀｀鹰咀山”是进入青年洞景区的第一景。尹呾钮扭纪念曰","spot":"红旗渠","cat":"景点知识"},{"q":"中共中央组织部命名的“中华人民共和国成立以来在群众中享有崇高威望的共产党员优秀代表”有哪五位？","a":"雷锋、焦裕禄、王进喜、史来贺、钱学森。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"焦裕猓纪念园景区主要建筑物由哪三部分组成？","a":"革命烈士纪念碑、焦裕禄烈士墓、焦裕禄纪念馆。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"现在的焦裕禄纪念馆于哪一年落成？","a":"1994年5月14 日，为纪念焦裕禄逝世30周年，正式落成并开馆。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"焦裕禄在兰考需要面对的＂三害”是哪＂三害”?","a":"风沙、盐碱、内捞。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"临上任前，组织上给焦裕禄讲到兰考有哪三个最？","a":"第一最苦；第二最穷；第三最难。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"焦裕禄提出了哪“三同”的做法？","a":"同住、同吃、同劳动。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"毛泽东于1966年9月15日，在天安门城楼上接见了焦裕禄的哪位亲属？203=====PDF_PAGE209=====导游服务能力——河南导游现场考试指南（第三版）吵答：二女儿焦守云。8习近平2014年3月视察兰考，提出从哪四方面学习焦裕禄精神？","a":"“心中装着全体人民，唯独没有他自己＂的公仆情怀；凡事探求就里、“吃别人嚼过的懊没味道”的求实作风；＂敢教日月换新天”“革命者要在困难面前逞英雄”的奋斗精神；艰苦朴素、廉洁奉公、“任何时候都不搞特殊化”的道德情操。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"1966年2月7日，《人民日报》发表的社论和长篇通讯是什么（高度赞扬了焦裕禄彻底的革命精神）？","a":"《向毛泽东同志的好学生焦裕禄同志学习》的社论和《县委书记的榜样——焦裕禄》长篇通讯。","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"焦裕禄在兰考工作了多长时间？","a":"一年零三个月。［河南黄河小浪底风景区＼","spot":"焦裕禄纪念园","cat":"景点知识"},{"q":"小浪底工程的拦河大坝有什么特点？","a":"主体大坝，南接祁山，北接王屋，拔地通天，如铜墙铁壁。拦河大坝是我国江河上修建的最大的土石坝，坝顶长1317米，宽15米，最大坝高","spot":"王屋山","cat":"景点知识"},{"q":"历史上有哪些诗人赞美过王屋山？","a":"唐代诗人李白、杜甫、白居易、李商隐、韩愈先后来王屋山游历。他们在此流连忘返，留下了许多不朽的名篇佳句。王维在《送张道士归山》中说：“先生何处去，王屋访茅居。别妇留丹诀，驱鸡人白云。”刘禹锡在《奉送家兄归隐王屋》中写道：“阳落天坛上，依稀似玉京。夜分先见日，月静远闻笙。云路将鸡犬，丹台有姓名。古来成道者，兄弟亦同行。”","spot":"王屋山","cat":"景点知识"},{"q":"王屋山的主峰是什么，海拔多少米？205=====PDF_PAGE211=====□导游服务能力—河南鳍现场考i葫南（第三版）坅答：主峰是天坛峰，海拔1715米。3王屋山著名的“四大天象奇观＇是什么？","a":"“天坛云海”“天坛倒影”“天坛日出““王母仙灯”。","spot":"王屋山","cat":"景点知识"},{"q":"王屋山的名称是怎么来的？","a":"我国最早的地理志《禹贡》记载，因其山形如王者之屋，故名王屋山。","spot":"王屋山","cat":"景点知识"},{"q":"阳台宫坐北朝南，依山而建，整体布局依中轴线依次有哪些？","a":"山门、三清殿、玉皇阁、长生殿 （遗址），两侧有东西廊房、西王母殿等。","spot":"王屋山","cat":"景点知识"},{"q":"王屋山主峰为何称为“天坛峰”?","a":"据传是当年黄帝设坛祭天的地方。","spot":"王屋山","cat":"景点知识"},{"q":"王屋山景区最著名的道教三宫除了阳台宫，还有哪二宫？","a":"迎恩宫、紫微宫。","spot":"王屋山","cat":"景点知识"},{"q":"“济源山水好”是哪位名人对济源的盛赞？","a":"白居易。","spot":"嵖岈山","cat":"景点知识"},{"q":"王屋山运动大约发生在距今多少年前？","a":"14.5亿年前。厂 ＿ ＿＿＼驻马店峭岈山景一区＿！","spot":"王屋山","cat":"景点知识"},{"q":"峭岈山的位置在哪儿？","a":"位于驻马店市遂平县境内。","spot":"嵖岈山","cat":"景点知识"},{"q":"岐岈山主景区由哪几部分组成？","a":"峻岈山主景区由蜜蜡山、南山、北山、六峰山、天磨峰、秀蜜湖、琵琶湖、天磨湖、百花湖等组成。","spot":"嵖岈山","cat":"景点知识"},{"q":"驻马店都有哪些风物特产？","a":"泌阳花菇、小磨香油、棠溪宝剑等。","spot":"嵖岈山","cat":"景点知识"},{"q":"嵖岈山南北山的分界线在哪？","a":"石猴院北侧有一条很深的峡谷，也就是嵖岈山南北山的分界线，这就是石猴院断裂带。","spot":"嵖岈山","cat":"景点知识"},{"q":"嵖岈山屈于哪种岩石山体？206=====PDF_PAGE212=====第四章河南导游现场考试问答示范答：花岗岩。6．为什么说嵖岈山西游记神话色彩浓郁？","a":"嵖岈山是 《西游记》续集电视剧的外景拍摄地之一。","spot":"嵖岈山","cat":"景点知识"},{"q":"驻马店的哪个地方享有“小延安”之称？","a":"确山县竹沟镇。","spot":"嵖岈山","cat":"景点知识"},{"q":"蜜蜡峰名称的由来是什么？","a":"圆柱形山峰常有线状风化裂隙，恰似蜂蜜涂壁。","spot":"嵖岈山","cat":"景点知识"},{"q":"我国历史上第一个人民公社在哪里成立？叫什么名字？","a":"驻马店遂平县，峭岈山卫星人民公社。","spot":"嵖岈山","cat":"景点知识"},{"q":"万人洞曾是明末哪位农民起义军首领的藏兵洞？","a":"李自成。『 ～ ～ －－－－－－ ～ －－ －匕 －－ ～淮阳太昊伏羲陵景区丿----- - .","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊伏羲氏出生于哪里？安葬于什么地方？","a":"伏羲出生千甘肃天水，安葬于河南淮阳。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊伏羲陵的主要建筑有哪些？","a":"太吴伏羲陵以伏毅先天八卦的数理兴建，整个陵庙分为内城、外城、紫禁城三道皇城，总占地面积875亩。建筑布局是以陵墓为中心，中轴线上由南向北的建筑有：午朝门、玉带桥、道仪门、先天门、太极门、统天殿、显仁殿、太始门等。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"八卦中的三才和五行分别指的是什么？","a":"三才指的是天、地、人。五行指的是金、木、水、火、土。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"朱镕基总理1997年参观太昊陵时亲笔题写了什么字？","a":"＇羲皇故都”。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"伏羲氏功绩有哪些？","a":"（1） 都于宛丘；（2）结网苦；（3）养牺牲；（4） 兴庖厨；（5） 定姓氏；\n（6） 制嫁娶；（7）始画八卦；（8） 刻书契；（9） 作甲历；（IO) 兴礼乐；（I I) 造干戈；（12) 以龙纪官。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"请概述龙图腾由哪些图腾的特点组成。答：如马头、鹿角、虾须、虎目、蛇身、鱼鳞、鹰爪等，把它们结合在一块，形成一个共同图腾标志——龙。207=====PDF_PAGE213=====导游服务能力一—河南导游现场考试指南（第三版）沙7．太昊陵内保存最古老的建筑是哪个？","a":"太始门。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"河南太吴陵庙会的举办时间是在什么时候？","a":"每年农历二月初二至三月初三为太昊陵庙会，以二月初二这一天最为隆重。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"淮阳的旅游资源特征是什么？","a":"一城一湖一古陵。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"为什么说淮阳是中华姓氏起源地？","a":"伏羲在这里 “正姓氏，制嫁娶＂，开创了中华姓氏6000多年的历史。姓作为 “远禽兽，别婚姻＂的符号，是中华文明进步的重要标记，是维系中华民族生生不息的血缘纽带。伏羡风姓，为中国第一个姓氏，也是中华姓氏的源头。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"河南周口有哪些美誉？","a":"周口市是伏羲故都，老子故里，有 “华夏先驱、九州圣迹”的美誉，被中华全国伏羲文化研究会誉为 “中华文化发祥的重地”。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊陵祭拜伏毅氏的主要殿堂是什么殿？建于什么时期？","a":"统天殿，又称大殿，建于明代，是陵庙内体积最大、等级最高的重点建筑。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊陵的第一道大门是哪个门？","a":"午朝门，俗称 “午门”。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"伏羲氏对人类社会的贡献有哪些？","a":"伏羡画八卦，定姓氏，结网苦，养牲畜，制礼仪，定嫁娶，实现了中华民族的第一次大融合。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊伏羲陵景区的位置在哪儿？","a":"河南周口淮阳县城北关，古蔡河的北岸。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"伏羲氏生活的时期大致是在什么时候？","a":"伏羲氏生活的时期是一个由母系氏族向父系氏族过渡的时期。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"太昊伏羲陵周围最有特色的泥塑小玩具叫什么名字？","a":"泥泥狗。","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"百家姓中陈姓的发源地在哪儿？陈姓的始祖是谁？","a":"陈姓的发源地在周口淮阳，陈姓始祖是妫满。\n208\n（北京静安东里6号 邮编：100028)https://www.cttp.net.cn E-mail:cttp@mct.gov.cn营销中心电话：0 10-57377103, 010-57377106读者服务部电话：0 10~57377107排 版：北京旅教文化传播有限公司经 销：全国各地新华书店印 刷：北京明恒达印务有限公司版 次：2025年8月第3版 2 025年8月第1次印刷开 本：720毫米X 970毫米 1 /16印 张：13.5字 数：2 18千定 价：4 0.00元IS B N 978一7-5032-7654-5版权所有 翻印必究如发现质量问题，请直接与营销中心联系调换\n（第三版）图垦塑墅丿凇仆黔1，；芍d","spot":"太昊伏羲陵","cat":"景点知识"},{"q":"河南博物院创建于哪一年？最初馆址设在哪里？","a":"1927年创建，前身为河南省博物馆，由冯玉祥主导建立，最初馆址在开封。1998年5月1日新馆在郑州农业路落成开放，同时更名为河南博物院。","spot":"河南博物院","cat":"景点知识"},{"q":"河南博物院是哪一年从开封迁至郑州的？","a":"1961年。此后1997年7月，中原石刻艺术馆与河南省博物馆合并，成立河南博物院；1998年新馆建成开放。","spot":"河南博物院","cat":"景点知识"},{"q":"河南博物院馆藏文物有多少？以哪几类最具特色？","a":"馆藏文物17万余件（套），其中珍贵文物5万余件。藏品以史前文物、商周青铜器、历代陶瓷器、玉器及石刻最具特色。","spot":"河南博物院","cat":"景点知识"},{"q":"河南博物院的基本陈列叫什么？","a":"《泱泱华夏 择中建都》。取自“择天下之中而立国”的理念，突出河南在中华文明起源与都城发展史上的核心地位。","spot":"河南博物院","cat":"景点知识"},{"q":"河南博物院的“九大镇院之宝”是哪些？","a":"贾湖骨笛、妇好鸮尊、云纹铜禁、杜岭方鼎、莲鹤方壶、玉柄铁剑、武则天金简、四神云气图壁画、汝窑天蓝釉刻花鹅颈瓶。","spot":"河南博物院","cat":"景点知识"},{"q":"贾湖骨笛为什么被称为“中华第一笛”？","a":"它出土于河南舞阳贾湖遗址，距今约八九千年，用鹤类尺骨钻孔制成，多为七孔，能吹奏完整音阶，是中国目前出土年代最早、保存最完整的乐器，把中国音乐史向前推进了数千年。","spot":"河南博物院","cat":"景点知识"},{"q":"莲鹤方壶是什么时期的器物？出土于何处？","a":"春秋中期青铜器，1923年出土于新郑李家楼郑公大墓，共一对，一件藏河南博物院、一件藏故宫博物院。壶身饰蟠螭纹，壶顶双层莲瓣中立一只展翅欲飞的鹤，被誉为“青铜时代的绝唱”。","spot":"河南博物院","cat":"景点知识"},{"q":"武则天金简是何时、在何处发现的？内容是什么？","a":"1982年发现于登封嵩山峻极峰。为武则天晚年投于嵩山的“除罪金简”，上刻文字祈求三官九府免除其罪，是现存唯一一件与武则天直接相关的可移动文物。","spot":"河南博物院","cat":"景点知识"},{"q":"汝窑天蓝釉刻花鹅颈瓶为什么极为珍贵？","a":"汝窑为北宋五大名窑之首，烧造时间仅约20年，传世品极少。这件鹅颈瓶釉色天蓝、带刻花，是汝窑传世品中唯一一件刻花作品，属国宝级文物。","spot":"河南博物院","cat":"景点知识"},{"q":"杜岭方鼎的发现有什么意义？","a":"1974年出土于郑州商城遗址，是商代早期大型青铜方鼎，其发现为确认郑州商城为商代早期都城提供了重要实物证据，也证明郑州有3600年建城史。","spot":"河南博物院","cat":"景点知识"}];

  if(a.indexOf(b)>=0&&b.length>=Math.max(2,a.length*0.55))return true;
  if(b.indexOf(a)>=0&&a.length>=2)return true;
  return false;
}

/* ---------- 每日任务 ---------- */
function genDaily(){
  var d=dayIdx(), out={date:todayStr(),day:d,spot:[],quiz:[]};
  var spotChoice=[],spotFill=[],cards=[],quizCh=[],qaAll=[];
  ALL.forEach(function(q){
    if(q.kind==='spot'){ (q.type==='填空'?spotFill:spotChoice).push(q.id) }
    else if(q.kind==='card') cards.push(q.id);
    else if(q.kind==='quiz') quizCh.push(q.id);
    else qaAll.push(q.id);
  });
  function rank(arr,seed){
    return arr.slice().sort(function(x,y){
      var px=P(x),py=P(y);
      var wx=WRONG.indexOf(x)>=0?0:(px.n?2:1);
      var wy=WRONG.indexOf(y)>=0?0:(py.n?2:1);
      if(wx!==wy)return wx-wy;
      if(wx===0)return (py.bad||0)-(px.bad||0);
      if(wx===2)return (px.t||0)-(py.t||0);
      return Math.sin(seed+x.length*7+x.charCodeAt(1))-Math.sin(seed+y.length*7+y.charCodeAt(1));
    });
  }
  // 景点题
  var spotN=25;
  if(d<=3){ out.spot=rank(spotChoice,d*13).slice(0,spotN); }
  else if(d>=8){ out.spot=rank(cards,d*13).slice(0,spotN); }
  else {
    var A=rank(spotFill,d*13), B=rank(cards,d*13), mix=[];
    for(var i=0;i<Math.max(A.length,B.length);i++){
      if(A[i])mix.push(A[i]);
      if(B[i])mix.push(B[i]);
    }
    out.spot=mix.slice(0,spotN);
  }
  // 面试题
  if(d<=4){ out.quiz=rank(quizCh,d*17).slice(0,60); }
  else if(d<=7){ out.quiz=rank(qaAll,d*17).slice(0,55); }
  else { out.quiz=rank(WRONG.slice().concat(qaAll),d*17).slice(0,50); }
  return out;
}
function daily(){
  var t=todayStr();
  if(DAILY.date!==t){ DAILY=genDaily(); DAILY.date=t; saveD(); }
  return DAILY;
}
function label(d){

  return names[d]||('D'+d);
}
function typeName(d,isSpot){
  if(isSpot) return d<=3?'选择题':(d>=8?'默写':'填空 + 默写');
  return d<=4?'选择题':(d>=8?'错题回顾':'问答');
}

function markChoice(el,q,letters,submitted){
  var right=String(q.answer).split('');
  el.querySelectorAll('.opt').forEach(function(o){
    var k=o.getAttribute('data-k');
    var picked=letters.indexOf(k)>=0, isRight=right.indexOf(k)>=0;
    o.classList.remove('pick','right','wrong','dim');
    if(!submitted){ if(picked)o.classList.add('pick'); return; }
    if(isRight)o.classList.add('right');
    else if(picked)o.classList.add('wrong');
    else o.classList.add('dim');
  });
}

/* ---------- 判分 ---------- */
function judge(id,correct){
  var p=P(id);
  p.n=(p.n||0)+1;p.t=Date.now();
  if(correct){
    p.ok=(p.ok||0)+1;
    var wi=WRONG.indexOf(id);
    if(wi>=0){ WRONG.splice(wi,1);saveW();
      toast('答对了，已移出错题本', '撤销', function(){WRONG.push(id);saveW();renderNav();});
    }
  } else {
    p.bad=(p.bad||0)+1;
    if(WRONG.indexOf(id)<0){WRONG.push(id);saveW();}
  }
  setP(id,p);renderNav();
}

document.addEventListener('click',function(e){

      judge(sid,ok3);
    }
    return;
  }
  var see=e.target.closest('[data-see]');
  if(see){
    var aid=see.getAttribute('data-see');

    a.classList.toggle('on');

  }

  if(jb){

      (okj?'':'<span class="ex">参考答案：'+esc(jq.back).slice(0,120)+'…</span>');

});

  };
  var sel=document.getElementById('spsel');
  if(sel)sel.onchange=function(){window._spsel=sel.value;shownN=LIMIT;paintDrill()};
  paintDrill();
}
function paintDrill(){
  var ids=[];
  if(DRILL==='spot'){
    var f=window._spsel;
    ids=ALL.filter(function(q){return q.kind==='spot'&&(!f||q.spot===f)}).map(function(q){return q.id});
  } else if(DRILL==='quiz'){ids=ALL.filter(function(q){return q.kind==='quiz'}).map(function(q){return q.id})}
  else if(DRILL==='qa'){ids=ALL.filter(function(q){return q.kind==='qa'}).map(function(q){return q.id})}
  else {ids=ALL.map(function(q){return q.id})}
  var box=document.getElementById('dlist');
  var r=listHTML(ids);
  box.innerHTML=r.h||'<div class="empty">这里还没有题</div>';
  box.querySelectorAll('[data-more]').forEach(function(m){
    m.onclick=function(){shownN+=LIMIT;paintDrill()};
  });
}

/* 错题本 */
function renderWrong(){
  var h='<div class="stat"><div class="r"><b>'+WRONG.length+'</b><span>待攻克</span></div>'+
        '<div class="b"><b>'+Object.keys(PROG).filter(function(k){return PROG[k].n}).length+'</b><span>已做题</span></div>'+
        '<div class="g"><b>'+Object.keys(PROG).filter(function(k){return PROG[k].ok}).length+'</b><span>答对过</span></div></div>';
  h+='<p class="lead">答错自动进来，<b>答对 1 次就移出</b>。移出后 4 秒内可撤销。</p>';
  if(!WRONG.length){
    h+='<div class="empty">错题本是空的 🎉<br>去刷题吧，答错的会自动收进来</div>';
  } else {
    var ids=WRONG.slice().reverse();
    var r=listHTML(ids);
    h+=r.h;
  }
  h+='<div class="foot"><button id="clearw">清空错题本</button></div>';
  app.innerHTML=h;
  app.querySelectorAll('[data-more]').forEach(function(m){
    m.onclick=function(){shownN+=LIMIT;render()};
  });
  var c=document.getElementById('clearw');
  if(c)c.onclick=function(){if(confirm('清空错题本？（做题记录保留）')){WRONG=[];saveW();render()}};
}

/* modal */
var md=document.getElementById('modal');
function openM(t,d,txt){
  document.getElementById('mtitle').textContent=t;
  document.getElementById('mdesc').textContent=d;
  var ta=document.getElementById('mtext');ta.value=txt;ta.readOnly=true;
  document.getElementById('mcopy').textContent='复制';
  document.getElementById('mcopy').onclick=function(){
    ta.select();ta.setSelectionRange(0,999999);
    try{document.execCommand('copy');toast('已复制')}catch(err){alert('请长按文本手动复制')}
  };
  md.classList.add('on');
}
function closeM(){md.classList.remove('on')}
document.getElementById('mok').onclick=closeM;
md.onclick=function(e){if(e.target===md)closeM()};

/* tabs */
function setTab(t){
  TAB=t;shownN=LIMIT;
  document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.getAttribute('data-tab')===t)});
  render();
}
document.getElementById('nav').onclick=function(e){
  var b=e.target.closest('button');if(!b)return;
  setTab(b.getAttribute('data-tab'));
};

shownN=LIMIT;
render();
})();
</script>
